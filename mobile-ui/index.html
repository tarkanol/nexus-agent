<script>
'use strict';

/* ===== GLOBALS (sabitler aynı) ===== */
var START_BAL = 50, COMM = 0.0004, MAX_P = 1;
var DEMO_BASE = {BTCUSDT:74000,ETHUSDT:2050,SOLUSDT:83,BNBUSDT:588,XRPUSDT:0.605,DOGEUSDT:0.12,ADAUSDT:0.45,AVAXUSDT:35,LINKUSDT:14};
var balance = START_BAL, peakBal = START_BAL, dailyPnL = 0;
var positions = [], trades = [], posId = 1;
var pairs = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT'];
var currentPair = 'BTCUSDT', currentTF = '5m', scanSec = 30;
var engineOn = false, autoTrade = false, WORKER = '', appMode = 'demo', futBal = null;
var targetUSD = 0.10, riskUSD = 1.00, leverage = 3, tightSL = true, aggressiveMode = false;
var focusModeOn = true;
var spreadFilterOn = false; // YENİ: spread filtresi
var maxPositionSize = 10;
var cooldowns = {}, slStreak = {}, pxState = {}, prevPx = {}, pData = {};
var loopTimer = null, cdTimer = null, trackerTimer = null, chartRAF = null;
var lastCW = 0, chartCtx = null;
var trackerTick = 0;

// Son gönderilen SL/TP değerlerini tut (buffer için)
var lastSentSL = {};   // pos.id -> son SL değeri
var lastSentTP = {};   // pos.id -> son TP değeri

/* ===== YARDIMCI ===== */
function fp(p) {
  if (!p || isNaN(p)) return '--';
  if (p >= 10000) return Math.round(p).toLocaleString();
  if (p >= 1000) return p.toFixed(2);
  if (p >= 10)   return p.toFixed(3);
  if (p >= 1)    return p.toFixed(4);
  if (p >= 0.01) return p.toFixed(5);
  return p.toFixed(6);
}
// (notify, log, logPos aynı) ...

/* ===== TEKNİK ANALİZ (calcEMA, calcRSI, calcMACD, calcATR, calcVolRatio, calcBB aynı) ===== */
// ... fonksiyon tanımları aynı ...

/* ===== GELİŞMİŞ ANALİZ (V4.0) ===== */
function analyze(sym) {
  var pd = pData[sym]; if (!pd) return null;
  var kl5 = pd.kl5m || [], kl15 = pd.kl15m || [], kl1h = pd.kl1h || [];
  if (kl5.length < 40 || kl15.length < 25) return null;

  var price = pd.price || kl5[kl5.length-1].c;
  var atr5 = calcATR(kl5, 14), atrPct = (atr5 / price) * 100;

  /* ATR filtresi */
  if (atrPct < 0.04 && !aggressiveMode) return null;
  if (atrPct > 3.0) return null;

  var i;
  var c5 = [], c15 = [], c1h = [];
  for (i = 0; i < kl5.length;  i++) c5.push(kl5[i].c);
  for (i = 0; i < kl15.length; i++) c15.push(kl15[i].c);
  for (i = 0; i < kl1h.length; i++) c1h.push(kl1h[i].c);

  /* 1h trend */
  var trend1h = 'NEUTRAL';
  if (kl1h.length >= 50) {
    var e20_1h = calcEMA(c1h, 20), e50_1h = calcEMA(c1h, 50);
    var l20_1h = e20_1h[e20_1h.length-1], l50_1h = e50_1h[e50_1h.length-1];
    if (l20_1h && l50_1h) trend1h = l20_1h > l50_1h ? 'LONG' : 'SHORT';
  }

  /* 15m trend */
  var e9_15 = calcEMA(c15, 9), e21_15 = calcEMA(c15, 21);
  var l9_15 = e9_15[e9_15.length-1], l21_15 = e21_15[e21_15.length-1];
  var trend15 = (l9_15 && l21_15) ? (l9_15 > l21_15 ? 'LONG' : l9_15 < l21_15 ? 'SHORT' : 'NEUTRAL') : 'NEUTRAL';

  /* 5m momentum */
  var e9_5  = calcEMA(c5, 9),  e21_5  = calcEMA(c5, 21);
  var l9_5  = e9_5[e9_5.length-1],   l21_5  = e21_5[e21_5.length-1];
  var p9_5  = e9_5[e9_5.length-2],   p21_5  = e21_5[e21_5.length-2];
  if (!l9_5 || !l21_5 || !p9_5 || !p21_5) return null;

  var macd5  = calcMACD(c5);
  var rsi5   = calcRSI(c5, 14);
  var rsi15  = calcRSI(c15, 14);
  var vr     = calcVolRatio(kl5);
  var bb5    = calcBB(c5, 20, 2);
  var atr15  = calcATR(kl15, 14);

  var goldenX = (p9_5 <= p21_5) && (l9_5 > l21_5);
  var deathX  = (p9_5 >= p21_5) && (l9_5 < l21_5);
  var aboveEMA = l9_5 > l21_5, belowEMA = l9_5 < l21_5;

  var rawSig = 'WAIT';
  if (goldenX || (aboveEMA && macd5.cross === 'UP')) rawSig = 'LONG';
  else if (deathX || (belowEMA && macd5.cross === 'DN')) rawSig = 'SHORT';
  else if (aboveEMA && macd5.hist > 0 && macd5.hist > macd5.prev && rsi5 > 50 && rsi5 < 68) rawSig = 'LONG';
  else if (belowEMA && macd5.hist < 0 && macd5.hist < macd5.prev && rsi5 < 50 && rsi5 > 32) rawSig = 'SHORT';
  if (rawSig === 'WAIT') return null;

  /* RSI aşırı bölge */
  if (rawSig === 'LONG'  && rsi5 > 72) return null;
  if (rawSig === 'SHORT' && rsi5 < 28) return null;
  if (rawSig === 'LONG'  && rsi15 > 75) return null;
  if (rawSig === 'SHORT' && rsi15 < 25) return null;

  /* Hacim filtresi */
  if (vr < 0.85 && !aggressiveMode) return null;

  /* TF uyumu */
  var tfConfirm = 0;
  if (aboveEMA && rawSig === 'LONG')  tfConfirm++;
  if (belowEMA && rawSig === 'SHORT') tfConfirm++;
  if (trend15 === rawSig) tfConfirm++;
  if (trend1h === rawSig) tfConfirm++;
  if (tfConfirm < (aggressiveMode ? 2 : 3)) return null;

  /* BB squeeze */
  if (bb5.squeeze && !aggressiveMode) return null;

  /* Spread filtresi */
  if (spreadFilterOn && pd.spread !== undefined && pd.spread > 0.0005) { // %0.05'ten büyük spread
    log('Spread yuksek: ' + sym.replace('USDT','') + ' %' + (pd.spread*100).toFixed(3), 'info');
    return null;
  }

  /* Skor hesaplama (aynı) */
  var reasons = [];
  var score = 20;
  // ... skor detayları aynı ...

  score = Math.min(100, score);
  var scoreThreshold = aggressiveMode ? 50 : 65;
  if (score < scoreThreshold) return null;

  /* Dinamik SL hesabı (aynı) */
  var atrMult;
  if (atrPct < 0.08) atrMult = 1.4;
  else if (atrPct < 0.15) atrMult = 1.1;
  else if (atrPct < 0.30) atrMult = 0.9;
  else atrMult = 0.75;

  var slDistFromAtr5  = atr5  * atrMult;
  var slDistFromAtr15 = atr15 * 0.5;
  var atrSlDist = Math.max(slDistFromAtr5, slDistFromAtr15);
  var minSlDist = price * 0.0015;
  var maxSlDist = price * 0.004;
  var slDist = Math.min(Math.max(atrSlDist, minSlDist), maxSlDist);

  var rrRatio = targetUSD / riskUSD;
  var minRR   = aggressiveMode ? 1.2 : 1.5;
  if (rrRatio < minRR) rrRatio = minRR;
  var tpDist = Math.max(slDist * rrRatio, price * 0.004);

  var sl, tp;
  if (rawSig === 'LONG')  { sl = price - slDist; tp = price + tpDist; }
  else                    { sl = price + slDist; tp = price - tpDist; }

  var riskBasedPosVal = Math.min(riskUSD / (slDist / price), balance * 0.25);
  if (isNaN(riskBasedPosVal) || riskBasedPosVal < 1) riskBasedPosVal = 1;
  var posVal = Math.min(riskBasedPosVal, maxPositionSize);
  var qty = posVal * leverage / price, comm = posVal * COMM * 2;

  return {
    signal: rawSig, score: score, price: price, sl: sl, tp: tp,
    slDist: slDist, tpDist: tpDist, posVal: posVal, qty: qty, comm: comm,
    reasons: reasons, atrPct: atrPct, vr: vr, atrMult: atrMult,
    indicators: {rsi5:rsi5, rsi15:rsi15, macd:macd5, vr:vr, atrPct:atrPct,
                 goldenX:goldenX, deathX:deathX, aboveEMA:aboveEMA, bbSqueeze:bb5.squeeze},
    mtf: {'5m': aboveEMA ? 'LONG' : belowEMA ? 'SHORT' : 'WAIT', '15m': trend15, '1h': trend1h}
  };
}

// analyzeAll() aynı ...

/* ===== POZİSYON AÇ ===== */
function openPos(sym, side, auto, manTP, manSL) {
  if (inCD(sym)) { notify(sym + ' cooldown', 'error'); return; }
  if (positions.length >= MAX_P) { notify('Max ' + MAX_P + ' pozisyon dolu', 'error'); return; }
  var k;
  for (k = 0; k < positions.length; k++) if (positions[k].pair === sym) { notify(sym + ' zaten acik', 'error'); return; }

  var pd = pData[sym], an = pd && pd.an;
  var price = an ? an.price : (pData[sym] ? pData[sym].price : (DEMO_BASE[sym] || 1));
  var posVal, qty, sl, tp, comm;

  if (manTP && manSL) {
    sl = side === 'LONG' ? price - manSL : price + manSL;
    tp = side === 'LONG' ? price + manTP : price - manTP;
    var riskBased = Math.min(riskUSD / (manSL / price), balance * 0.25);
    if (isNaN(riskBased) || riskBased < 1) riskBased = 1;
    posVal = Math.min(riskBased, maxPositionSize);
    qty = posVal * leverage / price; comm = posVal * COMM * 2;
  } else if (an) {
    sl = an.sl; tp = an.tp; posVal = an.posVal; qty = an.qty; comm = an.comm;
  } else { notify('Sinyal yok veya TP/SL gerekli', 'error'); return; }

  var newPos = {id:posId++, pair:sym, side:side, entry:price, qty:qty, posVal:posVal,
                sl:sl, tp:tp, comm:comm, openTime:Date.now(),
                highPnl:0, breakeven:false, trailStage:0};

  // Buffer değişkenlerini sıfırla
  lastSentSL[newPos.id] = null;
  lastSentTP[newPos.id] = null;

  if (appMode === 'live' && WORKER) {
    notify('Order gonderiliyor...', 'info');
    var dp = price > 1000 ? 2 : price > 10 ? 3 : 4;
    xfetch(WORKER + '/order', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({symbol:sym, side:side, usdAmount:posVal, leverage:leverage,
        sl:parseFloat(sl.toFixed(dp)), tp:parseFloat(tp.toFixed(dp))})},
    function(r) {
      if (r && (r.success || r.ok || r.status === 'ok')) {
        balance -= comm; dailyPnL -= comm;
        positions.push(newPos);
        if (balance > peakBal) peakBal = balance;
        var lm = side + ' ' + sym.replace('USDT','') + ' @' + fp(price) + ' | SL:' + fp(sl) + ' TP:' + fp(tp) + ' | $' + posVal.toFixed(2) + ' x' + leverage;
        log('ORDER OK: ' + lm, 'ok'); logPos('ACILDI: ' + lm, 'ok');
        notify((auto ? 'AUTO ' : '') + side + ' ' + sym.replace('USDT','') + ' acildi', 'success');
        startTracker(); updatePosUI(); updateSignalUI();
      } else {
        var em = r && r.error ? r.error : 'basarisiz';
        log('Order err: ' + em, 'err'); notify('Order basarisiz: ' + em, 'error');
      }
    }, function(code) { log('Order net err: ' + code, 'err'); notify('Baglanti hatasi', 'error'); });
  } else {
    balance -= comm; dailyPnL -= comm;
    positions.push(newPos);
    if (balance > peakBal) peakBal = balance;
    var lm2 = side + ' ' + sym.replace('USDT','') + ' @' + fp(price) + ' | SL:' + fp(sl) + ' TP:' + fp(tp) + ' | $' + posVal.toFixed(2) + ' x' + leverage;
    log((auto ? '[AUTO] ' : '') + lm2, 'ok');
    logPos('ACILDI: ' + lm2, 'ok');
    notify((auto ? 'AUTO ' : '') + side + ' ' + sym.replace('USDT','') + ' acildi', 'success');
    startTracker(); updatePosUI(); updateSignalUI();
  }
}

/* ===== POZİSYON KAPAT (İYİLEŞTİRİLMİŞ) ===== */
var closingPositions = {}; // id -> true, kapanma aşamasında olanlar
function closePos(id, reason) {
  var pos = null, idx = -1, i;
  for (i = 0; i < positions.length; i++) if (positions[i].id === id) { pos = positions[i]; idx = i; break; }
  if (!pos) return;
  if (closingPositions[id]) return; // zaten kapanıyor
  var pr = (pData[pos.pair] && pData[pos.pair].price) || pos.entry;
  var gross = (pr - pos.entry) * (pos.side === 'LONG' ? 1 : -1) * pos.qty;
  var net = gross - pos.comm;

  // Anında lokal kapatma (demo veya canlı)
  if (appMode === 'live' && WORKER) {
    closingPositions[id] = true;
    notify('Pozisyon kapatiliyor...', 'info');
    xfetch(WORKER + '/close', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:pos.pair, side:pos.side})},
      function(d) {
        // Başarılı
        delete closingPositions[id];
        // Lokal olarak kapat (zaten aşağıda yapacağız)
        finalizeClose(pos, idx, net, reason, pr);
        if (d && d.success) log('Kapat OK', 'ok');
      },
      function(err) {
        // Hata olsa bile lokal kapatalım, ama kullanıcıya bildirelim
        delete closingPositions[id];
        finalizeClose(pos, idx, net, reason, pr);
        log('Kapat hatasi (lokal kapatildi): ' + err, 'err');
      }
    );
    // Burada hemen return yapmıyoruz, çünkü asenkron kapanma işlemi yapıldı.
    // Ancak UI hemen güncellensin diye finalizeClose'u asenkron callback'te çağırdık.
    // Aşağıdaki satırlara düşmemesi için return ekleyelim.
    return;
  }

  // Demo veya live yoksa direkt kapat
  finalizeClose(pos, idx, net, reason, pr);
}

function finalizeClose(pos, idx, net, reason, pr) {
  // Pozisyonu diziden çıkar
  // Eğer hala listede ise (asenkron sırasında değişmemişse) çıkaralım
  if (positions[idx] && positions[idx].id === pos.id) {
    positions.splice(idx, 1);
  } else {
    // Belki çoktan silinmiş, tekrar arayıp bul
    var fidx = -1;
    for (var i = 0; i < positions.length; i++) if (positions[i].id === pos.id) { fidx = i; break; }
    if (fidx >= 0) positions.splice(fidx, 1);
    else return; // zaten yok
  }

  balance += net + pos.posVal; dailyPnL += net;
  if (balance > peakBal) peakBal = balance;
  if (net < 0 && (reason.indexOf('STOP') !== -1 || reason.indexOf('SL') !== -1)) {
    slStreak[pos.pair] = (slStreak[pos.pair] || 0) + 1;
    if (slStreak[pos.pair] >= 2) { setCD(pos.pair, 20, '2 SL ust uste'); slStreak[pos.pair] = 0; }
  } else if (net > 0) { slStreak[pos.pair] = 0; }
  trades.push({pair:pos.pair, side:pos.side, pnl:net, reason:reason, entry:pos.entry, exit:pr});

  var icon = net > 0 ? 'WIN ✓' : 'STOP ✗';
  var msg = icon + ' ' + pos.pair.replace('USDT','') + ' ' + pos.side + ' | PnL:' + (net >= 0 ? '+' : '') + '$' + net.toFixed(4) + ' | ' + reason;
  log(msg, net >= 0 ? 'ok' : 'err');
  logPos(msg, net >= 0 ? 'ok' : 'err');
  notify(msg, net >= 0 ? 'success' : 'error');

  if (positions.length === 0) stopTracker();
  updatePosUI(); updateSignalUI();
  // Buffer temizliği
  delete lastSentSL[pos.id];
  delete lastSentTP[pos.id];
}

/* ===== GELİŞMİŞ TRACKER (V4.0) ===== */
function startTracker() {
  if (trackerTimer) clearInterval(trackerTimer);
  trackerTick = 0;
  trackerTimer = setInterval(runTracker, 2000);
  logPos('Tracker basladi (2s aralik, Binance sync aktif)', 'ok');
}
function stopTracker() {
  if (trackerTimer) { clearInterval(trackerTimer); trackerTimer = null; }
  var et = document.getElementById('eTrack'); if (et) et.textContent = 'DURDU';
  logPos('Tracker durdu', 'info');
}

function runTracker() {
  if (positions.length === 0) { stopTracker(); return; }
  trackerTick++;
  var et = document.getElementById('eTrack'); if (et) et.textContent = 'AKTIF #' + trackerTick;

  if (appMode === 'live' && WORKER) {
    xfetch(WORKER + '/open_positions', null, function(d) {
      if (!d || !d.success || !Array.isArray(d.data)) { runTrailLogic(); return; }
      var i, j, p, rp, mp;
      for (i = 0; i < positions.length; i++) {
        p = positions[i];
        if (closingPositions[p.id]) continue;
        var found = false;
        for (j = 0; j < d.data.length; j++) {
          if (d.data[j].symbol === p.pair) {
            found = true;
            rp = parseFloat(d.data[j].unrealizedProfit || d.data[j].unRealizedProfit || 0);
            if (!isNaN(rp)) p.realPnl = rp;
            mp = parseFloat(d.data[j].markPrice || d.data[j].entryPrice || 0);
            if (mp > 0) { if (!pData[p.pair]) pData[p.pair] = {}; pData[p.pair].price = mp; }
            var bSl = parseFloat(d.data[j].stopPrice || 0);
            var bTp = parseFloat(d.data[j].takeProfitPrice || 0);
            if (bSl > 0) p.bnbSl = bSl;
            if (bTp > 0) p.bnbTp = bTp;
            // Spread güncelle
            if (d.data[j].bid && d.data[j].ask) {
              var spread = (d.data[j].ask - d.data[j].bid) / d.data[j].bid;
              if (pData[p.pair]) pData[p.pair].spread = spread;
            }
            break;
          }
        }
        if (!found) {
          logPos('SYNC: ' + p.pair.replace('USDT','') + ' Binance kapali — kapatiliyor', 'err');
          closePos(p.id, 'BINANCE SYNC');
          return;
        }
      }
      var bp = document.getElementById('eBnbPnl');
      if (bp && positions.length) {
        var totalRealPnl = 0;
        for (var pi = 0; pi < positions.length; pi++) {
          if (positions[pi].realPnl !== undefined) totalRealPnl += positions[pi].realPnl;
        }
        bp.textContent = (totalRealPnl >= 0 ? '+' : '') + '$' + totalRealPnl.toFixed(4);
        bp.style.color = totalRealPnl >= 0 ? 'var(--long)' : 'var(--short)';
      }
      runTrailLogic();
    }, function() { runTrailLogic(); });
  } else {
    runTrailLogic();
  }
  updatePosUI();
}

/* ===== TRAILING LOGIC (V4.0 - highPnl kullanımı) ===== */
function runTrailLogic() {
  var i, pos, pr, pnl, pnlRatio, changed, reason;
  for (i = positions.length - 1; i >= 0; i--) {
    pos = positions[i];
    if (closingPositions[pos.id]) continue;
    pr  = (pData[pos.pair] && pData[pos.pair].price) || pos.entry;
    pnl = (pos.realPnl !== undefined) ? pos.realPnl
          : (pr - pos.entry) * (pos.side === 'LONG' ? 1 : -1) * pos.qty;

    // Maksimum karı izle (highPnl)
    if (pnl > pos.highPnl) pos.highPnl = pnl;

    // Yeni yaklaşım: highPnl'den belirli bir oranda geri çekilme ile SL ayarla
    // Kar ne kadar büyükse, SL o kadar sıkı (yüzde olarak)
    var high = pos.highPnl;
    if (high <= 0) continue; // henüz kara geçmemiş

    // Geri çekilme oranı: kar arttıkça azalır
    var pullbackRatio;
    if (high >= targetUSD * 0.9) pullbackRatio = 0.08;  // %90+ hedef -> %8 geri ver
    else if (high >= targetUSD * 0.6) pullbackRatio = 0.12;
    else if (high >= targetUSD * 0.3) pullbackRatio = 0.18;
    else pullbackRatio = 0.25;

    // SL seviyesi: highPnl anındaki fiyattan geriye doğru
    var trailSL;
    if (pos.side === 'LONG') {
      var highPrice = pos.entry + high / pos.qty; // highPnl anındaki tahmini fiyat
      trailSL = highPrice * (1 - pullbackRatio * (pos.entry / highPrice)); // yaklaşık
    } else {
      var highPriceShort = pos.entry - high / pos.qty;
      trailSL = highPriceShort * (1 + pullbackRatio * (pos.entry / highPriceShort));
    }
    // Daha basit: doğrudan pnl'den geriye
    var buffer = high * pullbackRatio; // bu kadar düşüşe izin ver
    var adjustedSL;
    if (pos.side === 'LONG') {
      adjustedSL = pos.entry + (high - buffer) / pos.qty; // highPnl'den buffer kadar düşük
    } else {
      adjustedSL = pos.entry - (high - buffer) / pos.qty;
    }

    // Mevcut SL'den daha iyi ise (karı kilitleme yönünde) güncelle
    var betterSL = false;
    if (pos.side === 'LONG' && adjustedSL > pos.sl) betterSL = true;
    if (pos.side === 'SHORT' && adjustedSL < pos.sl) betterSL = true;
    if (!betterSL) continue;

    reason = 'TRAIL_HIGH';
    pos.sl = adjustedSL;
    changed = true;

    // TP uzatma (opsiyonel) – %85 üzerinde ise genişlet
    if (high >= targetUSD * 0.85) {
      var extTP;
      if (pos.side === 'LONG') {
        extTP = pr + (pr - pos.entry) * 0.5;
        if (extTP > pos.tp) { pos.tp = extTP; reason += ' TP_EXT'; }
      } else {
        extTP = pr - (pos.entry - pr) * 0.5;
        if (extTP < pos.tp) { pos.tp = extTP; reason += ' TP_EXT'; }
      }
    }

    if (changed) {
      var msg2 = '[TRAIL] ' + pos.pair.replace('USDT','') + ' | ' + reason + ' | HighPnl:$' + high.toFixed(4) + ' SL:' + fp(pos.sl) + ' TP:' + fp(pos.tp);
      log(msg2, 'ok'); logPos(msg2, 'ok');
      // Binance'e göndermek için buffer kontrolü
      if (appMode === 'live' && WORKER) maybePushTpSl(pos);
    }

    // Hedefin %98'ine ulaşırsa kapat (daha sıkı)
    if (high >= targetUSD * 0.98) {
      closePos(pos.id, 'HEDEF ALINDI (98%)');
      continue;
    }

    // SL tetikleme
    if (pos.side === 'LONG'  && pr >= pos.tp) { closePos(pos.id, 'TAKE PROFIT'); continue; }
    if (pos.side === 'SHORT' && pr <= pos.tp) { closePos(pos.id, 'TAKE PROFIT'); continue; }
    if (pos.side === 'LONG'  && pr <= pos.sl) { closePos(pos.id, 'STOP LOSS');   continue; }
    if (pos.side === 'SHORT' && pr >= pos.sl) { closePos(pos.id, 'STOP LOSS');   continue; }
  }
}

/* ===== TP/SL GÖNDERME (BUFFERLI) ===== */
function maybePushTpSl(pos) {
  var lastSL = lastSentSL[pos.id];
  var lastTP = lastSentTP[pos.id];
  var slChanged = !lastSL || Math.abs(pos.sl - lastSL) / pos.entry > 0.0005; // %0.05 fark
  var tpChanged = !lastTP || Math.abs(pos.tp - lastTP) / pos.entry > 0.0005;
  if (slChanged || tpChanged) {
    pushTpSl(pos);
    lastSentSL[pos.id] = pos.sl;
    lastSentTP[pos.id] = pos.tp;
  }
}

function pushTpSl(pos) {
  var dp = pos.entry > 1000 ? 2 : pos.entry > 10 ? 3 : 4;
  xfetch(WORKER + '/update_tpsl', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({symbol:pos.pair, side:pos.side,
      tp:parseFloat(pos.tp.toFixed(dp)), sl:parseFloat(pos.sl.toFixed(dp))})},
    function(r) { if (r && r.success) logPos('BNB TP/SL guncellendi: ' + pos.pair.replace('USDT',''), 'ok'); },
    function()  { logPos('BNB TP/SL guncelleme hata (lokal devam)', 'info'); });
}

/* ===== MOTOR (runEngine aynı) ===== */
function runEngine() {
  if (!engineOn) return;
  var elLast = document.getElementById('eLast'), elOpen = document.getElementById('eOpen'), elSig = document.getElementById('eSig');
  if (elLast) elLast.textContent = new Date().toLocaleTimeString('tr-TR');
  if (elOpen) elOpen.textContent = positions.length;

  if (focusModeOn && positions.length > 0) {
    if (elSig) elSig.textContent = 'Odak: ' + positions[0].pair.replace('USDT','') + ' izleniyor';
    var banner = document.getElementById('posFocusBanner');
    if (banner) banner.style.display = 'block';
    return;
  }
  var banner2 = document.getElementById('posFocusBanner');
  if (banner2) banner2.style.display = 'none';

  var best = null, bestScore = -1, i, s, an;
  for (i = 0; i < pairs.length; i++) {
    s = pairs[i]; if (inCD(s)) continue;
    an = pData[s] && pData[s].an;
    if (!an || an.signal === 'WAIT') continue;
    if (an.score > bestScore) { bestScore = an.score; best = {sym:s, an:an}; }
  }
  if (!best) { if (elSig) elSig.textContent = 'sinyal yok'; return; }
  if (elSig) elSig.textContent = best.sym.replace('USDT','') + ' ' + best.an.signal + ' (' + best.an.score + '%)';
  if (autoTrade && positions.length < MAX_P) openPos(best.sym, best.an.signal, true);
  else if (!autoTrade) log('SIG: ' + best.sym.replace('USDT','') + ' ' + best.an.signal + ' SKOR:' + best.an.score + '%', 'info');
}
