// ═══════════════════════════════════
// İNDİKATÖRLER (EMA, RSI, ATR, MACD, ADX, FIB hesaplamaları aynen korundu)
function ema(arr,p){if(!arr||arr.length<p)return arr?arr.slice():[];var k=2/(p+1),out=new Array(p-1);for(var i=0;i<p-1;i++)out[i]=null;var e=0;for(var j=0;j<p;j++)e+=arr[j];e/=p;out.push(e);for(var m=p;m<arr.length;m++){e=arr[m]*k+e*(1-k);out.push(e);}return out;}
function rsi(closes,p){p=p||14;if(closes.length<p+2)return 50;var g=0,l=0;for(var i=1;i<=p;i++){var d=closes[i]-closes[i-1];d>0?g+=d:l-=d;}var ag=g/p,al=l/p;for(var j=p+1;j<closes.length;j++){var d2=closes[j]-closes[j-1];ag=(ag*(p-1)+(d2>0?d2:0))/p;al=(al*(p-1)+(d2<0?-d2:0))/p;}return al===0?100:100-(100/(1+ag/al));}
function atr(kl,p){p=p||14;if(!kl||kl.length<p+1)return kl&&kl.length>1?kl[kl.length-1].h-kl[kl.length-1].l:1;var trs=[];for(var i=1;i<kl.length;i++){var pc=kl[i-1].c;trs.push(Math.max(kl[i].h-kl[i].l,Math.abs(kl[i].h-pc),Math.abs(kl[i].l-pc)));}var sum=0;for(var j=trs.length-p;j<trs.length;j++)sum+=trs[j];return sum/p;}
function macd(closes){var e12=ema(closes,12),e26=ema(closes,26);var ml=[];for(var i=0;i<closes.length;i++){if(e12[i]&&e26[i])ml.push(e12[i]-e26[i]);}if(!ml.length)return{hist:0,macd:0};var sg=ema(ml,9);return{hist:ml[ml.length-1]-sg[sg.length-1],macd:ml[ml.length-1]};}
function adxCalc(kl,p){p=p||14;if(!kl||kl.length<p+2)return{adx:20,pDI:20,mDI:20};var trs=[],pDM=[],mDM=[];for(var i=1;i<kl.length;i++){var h=kl[i].h,l=kl[i].l,ph=kl[i-1].h,pl=kl[i-1].l,pc=kl[i-1].c;trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));var up=h-ph,dn=pl-l;pDM.push(up>dn&&up>0?up:0);mDM.push(dn>up&&dn>0?dn:0);}var sumTR=0,sumPD=0,sumMD=0;for(var j=trs.length-p;j<trs.length;j++)sumTR+=trs[j];for(var k=pDM.length-p;k<pDM.length;k++)sumPD+=pDM[k];for(var m2=mDM.length-p;m2<mDM.length;m2++)sumMD+=mDM[m2];var av=sumTR/p||1;return{adx:Math.abs(sumPD/p/av*100-sumMD/p/av*100)/(sumPD/p/av*100+sumMD/p/av*100+.001)*100,pDI:sumPD/p/av*100,mDI:sumMD/p/av*100};}

// ═══════════════════════════════════
// FİLTRELER
function isTradingHours(){if(!timeFilterActive)return true;var h=new Date().getUTCHours()+3;if(h>=24)h-=24;return(h>=7||h<2);}
function isInCooldown(sym){var c=cooldown[sym];if(c&&Date.now()<c.until)return true;if(c)delete cooldown[sym];return false;}
function applyCooldown(sym,r){cooldown[sym]={until:Date.now()+10*60*1000,reason:r};addLog('🚫 CD(10dk): '+sym.replace('USDT','')+' '+r,'info');}

// Dinamik TP/SL hesabı
function calcTPSL(side,entry){
  var slPrice, tpPrice;
  var posValue=Math.min(riskAmountUSD/(slPercent/100),balance*0.25);
  var qty=(posValue*currentLeverage)/entry;
  var tpMove=profitTargetUSD/qty;
  if(side==='LONG'){slPrice=entry*(1-slPercent/100);tpPrice=entry+tpMove;}
  else{slPrice=entry*(1+slPercent/100);tpPrice=entry-tpMove;}
  return{sl:slPrice,tp:tpPrice};
}

// ═══════════════════════════════════
// YENİ SCALP SİNYAL ANALİZİ
function analyzeChallenge(sym){
  if(isInCooldown(sym))return null;
  var pd=pData[sym];if(!pd)return null;
  var k5=pd.kl5m||[],k15=pd.kl15m||[],k1=pd.kl1h||[],k4=pd.kl4h||[];
  if(k5.length<20||k15.length<20||k1.length<20)return null;
  var price=pd.price||k5[k5.length-1].c;

  // Hacim onayı (1.2x)
  if(volumeConfirmActive&&k15.length>=20){
    var vols=k15.slice(-20).map(function(k){return k.v;});
    var avg=vols.slice(0,-1).reduce(function(a,b){return a+b;},0)/19;
    if(vols[19]<avg*1.2)return null;
  }

  var c5=k5.map(function(k){return k.c;}),c15=k15.map(function(k){return k.c;}),c1=k1.map(function(k){return k.c;});
  var e9_5=ema(c5,9),e21_5=ema(c5,21),e9_15=ema(c15,9),e21_15=ema(c15,21),e50_15=ema(c15,50),e9_1=ema(c1,9),e21_1=ema(c1,21),e50_1=ema(c1,50);
  var l9_5=e9_5[e9_5.length-1],l21_5=e21_5[e21_5.length-1],l9_15=e9_15[e9_15.length-1],l21_15=e21_15[e21_15.length-1],l50_15=e50_15[e50_15.length-1],l9_1=e9_1[e9_1.length-1],l21_1=e21_1[e21_1.length-1],l50_1=e50_1[e50_1.length-1];

  var sBull=0,sBear=0;
  if(l9_5>l21_5)sBull+=3;else sBear+=3;
  if(l9_15>l21_15&&l21_15>l50_15)sBull+=4;else if(l9_15<l21_15&&l21_15<l50_15)sBear+=4;else if(l9_15>l21_15)sBull++;else sBear++;
  if(l9_1>l21_1&&l21_1>l50_1)sBull+=5;else if(l9_1<l21_1&&l21_1<l50_1)sBear+=5;else if(l9_1>l21_1)sBull+=2;else sBear+=2;
  var rs=rsi(c15,14);if(rs>55&&rs<70)sBull+=3;else if(rs<45&&rs>30)sBear+=3;
  var adx=adxCalc(k15,14);if(adx.adx>20){if(adx.pDI>adx.mDI)sBull+=4;else sBear+=4;}

  // 4h filtre
  var c4=k4.map(function(k){return k.c;}),e50_4=ema(c4,50),l50_4=e50_4[e50_4.length-1];
  var htf='NEUTRAL';if(price>l50_4*1.005)htf='LONG';else if(price<l50_4*0.995)htf='SHORT';

  var sig='WAIT',conf=0;
  if(sBull>sBear&&sBull>=12){sig='LONG';conf=Math.round(sBull/(sBull+sBear)*100);}
  else if(sBear>sBull&&sBear>=12){sig='SHORT';conf=Math.round(sBear/(sBull+sBear)*100);}
  if(sig==='WAIT')return null;
  if(htf!=='NEUTRAL'&&sig!==htf)return null;

  // Çakışma koruması (eşik 0.9)
  if(conflictActive){var opp=sig==='LONG'?sBear:sBull;if(opp>(sig==='LONG'?sBull:sBear)*0.9)return null;}

  if(conf<minConfidence)return null;

  var tpsl=calcTPSL(sig,price);
  return{signal:sig,conf:conf,price:price,sl:tpsl.sl,tp:tpsl.tp,rrRatio:userRR,
    indicators:{rsi:rs,macdHist:macd(c15).hist,adx:adx.adx,ema50above:price>l50_1},
    mtf:{'5m':l9_5>l21_5?'LONG':'SHORT','15m':l9_15>l21_15?'LONG':'SHORT','1h':l9_1>l21_1?'LONG':'SHORT','4h':htf}
  };
}
function analyzeAll(){
  for(var i=0;i<customPairs.length;i++){
    var sym=customPairs[i];
    if(!pData[sym])continue;
    if(isInCooldown(sym)){pData[sym].analysis=null;continue;}
    try{pData[sym].analysis=analyzeChallenge(sym);}catch(e){}
  }
}

// ═══════════════════════════════════
// CHART
var chartCtx;
function initChart(){chartCtx=document.getElementById('chart').getContext('2d');}
function drawChart(){
  if(!chartCtx||currentPage!=='signal')return;
  var pd=pData[currentPair];if(!pd)return;
  var tfMap={'5m':'kl5m','15m':'kl15m','1h':'kl1h','4h':'kl4h'};
  var kl=pd[tfMap[currentTF]||'kl15m']||[];if(kl.length<10)return;
  var c=chartCtx.canvas;c.width=c.offsetWidth;c.height=155;
  var W=c.width,H=155,ctx=chartCtx;ctx.clearRect(0,0,W,H);
  var n=Math.min(60,kl.length),k=kl.slice(-n),cl=k.map(function(x){return x.c;});
  var an=pd.analysis,mn=Math.min.apply(null,k.map(function(x){return x.l;}))*0.999,mx=Math.max.apply(null,k.map(function(x){return x.h;}))*1.001;
  if(an&&an.sl){mn=Math.min(mn,an.sl*0.998);mx=Math.max(mx,(an.tp||mx)*1.002);}
  var rng=mx-mn;if(rng<=0)return;
  var toY=function(v){return H-6-((v-mn)/rng)*(H-12);},cw=W/n;
  ctx.beginPath();ctx.moveTo(0.5*cw,toY(cl[0]));for(var i=0;i<cl.length;i++)ctx.lineTo((i+0.5)*cw,toY(cl[i]));
  ctx.strokeStyle=cl[0]<=cl[cl.length-1]?'#00e676':'#ff3d5c';ctx.lineWidth=1.5;ctx.stroke();
  if(an&&an.sl){ctx.setLineDash([4,4]);ctx.strokeStyle='#ff3d5c';ctx.beginPath();ctx.moveTo(0,toY(an.sl));ctx.lineTo(W,toY(an.sl));ctx.stroke();ctx.setLineDash([]);}
  if(an&&an.tp){ctx.setLineDash([4,4]);ctx.strokeStyle='#4ade80';ctx.beginPath();ctx.moveTo(0,toY(an.tp));ctx.lineTo(W,toY(an.tp));ctx.stroke();ctx.setLineDash([]);}
}
function setTF(btn,tf){document.querySelectorAll('.ct').forEach(function(c){c.classList.remove('active');});btn.classList.add('active');currentTF=tf;drawChart();}

function updateSignalUI(){
  var pd=pData[currentPair],an=pd?pd.analysis:null,price=pd?pd.price:DEMO_BASE[currentPair]||1;
  document.getElementById('sigBadge').textContent=an?an.signal:'WAIT';
  document.getElementById('sigBadge').className='sig-badge '+(an?an.signal:'WAIT');
  if(an&&an.indicators){
    document.getElementById('iRsi').textContent=an.indicators.rsi.toFixed(1);
    document.getElementById('iMacd').textContent=an.indicators.macdHist.toFixed(4);
    document.getElementById('iAdx').textContent=an.indicators.adx.toFixed(1);
    document.getElementById('iEma').textContent=an.indicators.ema50above?'Üstünde':'Altında';
  }
  if(an&&an.mtf){
    document.getElementById('m5m').textContent=an.mtf['5m'];document.getElementById('m5m').className='mtf-v '+an.mtf['5m'];
    document.getElementById('m15m').textContent=an.mtf['15m'];document.getElementById('m15m').className='mtf-v '+an.mtf['15m'];
    document.getElementById('m1h').textContent=an.mtf['1h'];document.getElementById('m1h').className='mtf-v '+an.mtf['1h'];
    document.getElementById('m4h').textContent=an.mtf['4h'];document.getElementById('m4h').className='mtf-v '+an.mtf['4h'];
  }
  document.getElementById('btnL').disabled=!(positions.length<getMaxPositions());
  document.getElementById('btnS').disabled=!(positions.length<getMaxPositions());
  drawChart();
}
function updatePairRow(){

// POZİSYONLAR
function calcUnrealPnl(pos){var pr=(pData[pos.pair]&&pData[pos.pair].price)||pos.entry,m=pos.side==='LONG'?1:-1;return(pr-pos.entry)*m*pos.qty;}
function updatePosUI(){
  updateChallenge();
  var html='';
  if(!positions.length)html='<div style="text-align:center;padding:24px;color:var(--dim)">Açık pozisyon yok</div>';
  else positions.forEach(function(p){
    var pr=(pData[p.pair]&&pData[p.pair].price)||p.entry,pnl=calcUnrealPnl(p);
    html+='<div class="pos-c '+(p.side.toLowerCase())+'"><div class="pos-h"><div><span class="pos-sym">'+p.pair.replace('USDT','')+'</span><span class="pos-side '+p.side+'">'+p.side+'</span></div><div><span class="pos-pnl '+(pnl>=0?'up':'dn')+'">'+(pnl>=0?'+':'')+'$'+pnl.toFixed(4)+'</span></div></div><div class="pos-btns"><button class="btn btn-outline" style="font-size:10px;padding:5px 10px;min-height:38px" onclick="closePos('+p.id+',\'Manuel\',1)">✕ Kapat</button></div></div>';
  });
  document.getElementById('posList').innerHTML=html;
  document.getElementById('posBdg').textContent=positions.length+'/'+getMaxPositions();
  var histHtml=trades.slice(-5).reverse().map(function(t){return'<div class="th-row"><span>'+t.pair.replace('USDT','')+' '+t.side+'</span><span style="color:'+(t.pnl>=0?'var(--long)':'var(--short)')+'">'+(t.pnl>=0?'+':'')+'$'+t.pnl.toFixed(4)+'</span></div>';}).join('');
  document.getElementById('histBox').innerHTML=histHtml||'<div style="color:var(--dim)">Henüz işlem yok</div>';
}

async function openPos(sym,side,auto){
  var pd=pData[sym],an=pd?pd.analysis:null;
  if(!an||!an.sl){notify('Sinyal/SL yok','error');return false;}
  if(isInCooldown(sym)){notify(sym+' cooldown','error');return false;}
  if(positions.length>=getMaxPositions()){notify('Pozisyon limiti','error');return false;}
  var price=an.price,slDist=Math.abs(an.sl-price),slPct=(slDist/price)*100;
  var posValue=Math.min(riskAmountUSD/(slPct/100),balance*0.25);
  var qty=(posValue*currentLeverage)/price,comm=posValue*COMM*2;
  positions.push({id:posId++,pair:sym,side:side,entry:price,qty:qty,lev:currentLeverage,posValue:posValue,sl:an.sl,tp:an.tp,comm:comm,auto:auto,openTime:Date.now()});
  dailyPnL-=comm;balance-=comm;totalComm+=comm;dailyTradeCount++;
  if(balance>peakBal)peakBal=balance;
  notify('✅ '+side+' '+sym.replace('USDT','')+' @$'+fp(price),'success');
  if(appMode==='live'&&WORKER){
    try{var r=await fetch(WORKER+'/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:sym,side:side,usdAmount:posValue,leverage:currentLeverage,sl:parseFloat(an.sl.toFixed(4)),tp:parseFloat(an.tp.toFixed(4))})}).then(function(x){return x.json();});}catch(e){}
  }
  updatePosUI();return true;
}
function manualOpen(side){openPos(currentPair,side,false);}
async function closePos(id,reason,fraction){
  if(fraction===undefined)fraction=1;
  var pos=positions.find(function(p){return p.id===id;});if(!pos)return;
  var pr=(pData[pos.pair]&&pData[pos.pair].price)||pos.entry,m=pos.side==='LONG'?1:-1;
  var gross=(pr-pos.entry)*m*pos.qty*fraction,net=gross-pos.comm*fraction;
  dailyPnL+=net;balance+=net+pos.posValue*fraction;totalComm+=pos.comm*fraction;if(net<0)dailyLossAmt+=Math.abs(net);
  if(balance>peakBal)peakBal=balance;
  trades.push({pair:pos.pair,side:pos.side,pnl:net,reason:reason});
  positions=positions.filter(function(p){return p.id!==id;});
  if(reason.indexOf('SL')!==-1||reason.indexOf('STOP')!==-1){
    if(!consecutiveSL[pos.pair])consecutiveSL[pos.pair]=0;
    consecutiveSL[pos.pair]++;
    if(consecutiveSL[pos.pair]>=3){applyCooldown(pos.pair,'3 SL');consecutiveSL[pos.pair]=0;}
  }else{consecutiveSL[pos.pair]=0;}
  notify((net>=0?'🟢':'🔴')+' '+pos.pair.replace('USDT','')+' '+reason+' $'+net.toFixed(4),net>=0?'success':'error');
  updatePosUI();calcProj();
}
async function checkPositions(){
  for(var i=0;i<positions.length;i++){
    var p=positions[i],pr=(pData[p.pair]&&pData[p.pair].price)||p.entry,pnl=calcUnrealPnl(p);
    // Kısmi kâr kilitleme
    if(scalpMode && p.tp){
      var tpMove=Math.abs(p.tp-p.entry);
      var progress=p.side==='LONG'?(pr-p.entry)/tpMove:(p.entry-pr)/tpMove;
      if(progress>=0.7&&progress<1.0){
        if(p.side==='LONG'&&p.sl<p.entry){p.sl=p.entry;addLog('🔒 BE: '+p.pair.replace('USDT','')+' SL başabaş çekildi','info');}
        else if(p.side==='SHORT'&&p.sl>p.entry){p.sl=p.entry;addLog('🔒 BE: '+p.pair.replace('USDT','')+' SL başabaş çekildi','info');}
      }
    }
    if(p.tp&&((p.side==='LONG'&&pr>=p.tp)||(p.side==='SHORT'&&pr<=p.tp))){await closePos(p.id,'TAKE PROFIT');i--;continue;}
    if((p.side==='LONG'&&pr<=p.sl)||(p.side==='SHORT'&&pr>=p.sl)){await closePos(p.id,'STOP LOSS');i--;continue;}
  }
}

// ENGINE
async function runEngine(){
  if(!engineOn)return;
  if(!isTradingHours())return;
  
  var selEl=document.getElementById('signalSelection');
  if(selEl)signalSelection=selEl.value;
  
  var signals=[];
  for(var i=0;i<customPairs.length;i++){
    var sym=customPairs[i];
    if(isInCooldown(sym))continue;
    var an=pData[sym]?pData[sym].analysis:null;
    if(!an||an.signal==='WAIT'||an.conf<minConfidence)continue;
    signals.push({sym:sym,an:an,conf:an.conf});
  }
  if(!signals.length){
    document.getElementById('eSig').textContent='Sinyal yok';
    return;
  }
  if(signalSelection==='best')signals.sort(function(a,b){return b.conf-a.conf;});
  var sel=signals[0];
  document.getElementById('eSig').textContent=sel.sym.replace('USDT','')+':'+sel.an.signal+'('+sel.conf+'%)';
  document.getElementById('eOpened').textContent=positions.length;
  
  if(autoTrade){
    var can=positions.length<getMaxPositions()&&(!challengeRulesActive||(dailyTradeCount<getMaxDailyTrades()&&dailyLossAmt<getMaxDailyLoss()));
    if(can&&!positions.some(function(p){return p.pair===sel.sym;})){
      await openPos(sel.sym,sel.an.signal,true);
    }
  }
}

// DATA
function demoTick(sym){var s=pState[sym],base=DEMO_BASE[sym]||1,drift=(base-s.price)*0.0008;s.vel=s.vel*0.88+(Math.random()-0.5)*s.price*0.0003+drift;s.price=Math.max(s.price*0.85,s.price+s.vel);return s.price;}
function makeKlines(sym,n,tf){var tfMs={'5m':300000,'15m':900000,'1h':3600000,'4h':14400000}[tf]||900000,p=pState[sym]?pState[sym].price:(DEMO_BASE[sym]||1),kl=[];for(var i=n-1;i>=0;i--){var o=p,c=o*(1+(Math.random()-0.5)*0.008),rng=Math.abs(o-c)*1.2;kl.unshift({t:Date.now()-(n-i)*tfMs,o:o,h:Math.max(o,c)+rng*0.35,l:Math.min(o,c)-rng*0.35,c:c,v:Math.random()*8000+1000});p=c;}if(kl.length)kl[kl.length-1].c=pState[sym]?pState[sym].price:(DEMO_BASE[sym]||1);return kl;}
function refreshDemoFast(){
  var now=Date.now();
  for(var i=0;i<customPairs.length;i++){
    var sym=customPairs[i];prevP[sym]=pState[sym].price;demoTick(sym);var p=pState[sym].price;
    if(!pData[sym])pData[sym]={};pData[sym].price=p;
    if(!pData[sym].lastKl||now-pData[sym].lastKl>15000){
      pData[sym].kl4h=makeKlines(sym,200,'4h');pData[sym].kl1h=makeKlines(sym,120,'1h');pData[sym].kl15m=makeKlines(sym,120,'15m');pData[sym].kl5m=makeKlines(sym,100,'5m');pData[sym].lastKl=now;
    }else{
      ['kl4h','kl1h','kl15m','kl5m'].forEach(function(key){var kl=pData[sym][key];if(kl&&kl.length){kl[kl.length-1].c=p;kl[kl.length-1].h=Math.max(kl[kl.length-1].h,p);kl[kl.length-1].l=Math.min(kl[kl.length-1].l,p);}});
    }
  }
  analyzeAll();updateSignalUI();updatePairRow();updateTicker();updatePosUI();
}
function refreshDemo(){
  var now=Date.now();
  for(var i=0;i<customPairs.length;i++){
    var sym=customPairs[i];prevP[sym]=pState[sym].price;demoTick(sym);var p=pState[sym].price;
    if(!pData[sym])pData[sym]={};pData[sym].price=p;
    pData[sym].kl4h=makeKlines(sym,200,'4h');pData[sym].kl1h=makeKlines(sym,120,'1h');pData[sym].kl15m=makeKlines(sym,120,'15m');pData[sym].kl5m=makeKlines(sym,100,'5m');pData[sym].lastKl=now;
  }
  analyzeAll();
}
async function fetchLive(){

    var prices=await Promise.all(customPairs.map(function(s){return fetch(WORKER+'/price?symbol='+s).then(function(r){return r.json();}).catch(function(){return null;});}));
    customPairs.forEach(function(s,i){var pr=prices[i];if(pr&&pr.success){var p=parseFloat(pr.data.lastPrice||pr.data.price);if(p>0){prevP[s]=pState[s].price;pState[s].price=p;if(!pData[s])pData[s]={};pData[s].price=p;}}});

}

function resetChallenge(){balance=CHALLENGE_START;peakBal=CHALLENGE_START;dailyPnL=0;dailyTradeCount=0;dailyLossAmt=0;totalComm=0;positions=[];trades=[];posId=1;notify('🔄 Sıfırlandı');updatePosUI();}
async function mainLoop(){
