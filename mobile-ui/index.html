<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NEXUS Control</title>

  <style>
    :root {
      --bg: #05070a;
      --panel: #0b111a;
      --border: #1c2736;
      --accent: #00d4ff;
      --green: #00ff88;
      --red: #ff3355;
      --yellow: #ffcc00;
      --text: #e0eaf5;
      --text-dim: #7f8fa6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "San Francisco", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .label {
      color: var(--text-dim);
    }

    .value {
      font-weight: 600;
    }

    .status {
      color: var(--green);
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      margin-top: 10px;
    }

    .btn-start {
      background: var(--green);
      color: #000;
    }

    .btn-stop {
      background: var(--red);
      color: #fff;
    }

    .section-title {
      font-size: 13px;
      margin-bottom: 12px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .pairs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pair {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      background: #070c14;
      color: var(--text-dim);
    }

    .pair.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,212,255,0.08);
    }

    .selector {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .option {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .option.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,212,255,0.08);
    }

    .slider-wrap {
      margin-top: 10px;
    }

    input[type=range] {
      width: 100%;
    }

    .slider-value {
      text-align: right;
      font-size: 14px;
      margin-top: 4px;
      color: var(--text-dim);
    }

    .warning {
      background: rgba(255, 204, 0, 0.1);
      border: 1px solid var(--yellow);
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: var(--yellow);
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>NEXUS</h1>

  <!-- STATUS -->
  <div class="card">
    <div class="row">
      <span class="label">STATUS</span>
      <span class="value status">RUNNING</span>
    </div>
    <div class="row">
      <span class="label">MODE</span>
      <span class="value">AUTO</span>
    </div>
    <div class="row">
      <span class="label">ACCOUNT</span>
      <span class="value">TESTNET</span>
    </div>

    <button class="btn btn-start">START AGENT</button>
    <button class="btn btn-stop">STOP AGENT</button>
  </div>

  <!-- PAIRS -->
  <div class="card">
    <div class="section-title">PAIRS</div>
    <div class="pairs">
      <div class="pair active">BTCUSDT</div>
      <div class="pair active">ETHUSDT</div>
      <div class="pair">SOLUSDT</div>
      <div class="pair">XRPUSDT</div>
    </div>
  </div>

  <!-- RISK -->
  <div class="card">
    <div class="section-title">RISK SETUP</div>

    <div class="label">LEVERAGE</div>
    <div class="selector">
      <div class="option">x1</div>
      <div class="option active">x3</div>
      <div class="option">x5</div>
    </div>

    <div class="slider-wrap">
      <div class="label">TAKE PROFIT</div>
      <input type="range" min="1" max="10" value="6" />
      <div class="slider-value">0.6 %</div>
    </div>

    <div class="slider-wrap">
      <div class="label">STOP LOSS</div>
      <input type="range" min="1" max="10" value="3" />
      <div class="slider-value">0.3 %</div>
    </div>
  </div>

  <!-- WARNING -->
  <div class="warning">
    AUTO mode enabled.<br />
    Agent will trade automatically within defined limits.
  </div>

</body>
</html>
