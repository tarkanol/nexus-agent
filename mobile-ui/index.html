<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS — Agent Control Panel</title>

<style>
body{
  background:#0b0f17;
  color:#e8eef7;
  padding:18px;
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

h1{
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  font-size:13px;
  color:#8fa0b8;
  margin-bottom:12px;
}

.card{
  background:#121724;
  border:1px solid #1f2a40;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin:6px 0;
}

button{
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
  font-weight:600;
}

.start{
  background:#00e676;
  color:#000;
}

.stop{
  background:#ff3b5c;
  color:#fff;
}

.badge{
  padding:4px 10px;
  border-radius:10px;
  font-size:12px;
}

.RUNNING{background:#0f5132;color:#5cffb0;}
.STOPPED{background:#5c1d24;color:#ff7a8a;}

.log{
  font-size:12px;
  color:#9fb0c8;
  border-bottom:1px solid #1f2a40;
  padding:4px 0;
}
</style>
</head>

<body>

<h1>NEXUS</h1>
<div class="sub">Agent Control Panel</div>

<!-- MODE / STATE -->
<div class="card">
  <div class="row"><span>Mode</span><span id="mode">PAPER</span></div>
  <div class="row">
    <span>State</span>
    <span id="state" class="badge STOPPED">STOPPED</span>
  </div>
</div>

<!-- BALANCE -->
<div class="card">
  <div class="row"><span>Paper Balance</span><span id="balance">—</span></div>
  <div class="row"><span>PnL</span><span id="pnl">—</span></div>
</div>

<!-- CONTROLS -->
<div class="card">
  <button class="start" onclick="startAgent()">START</button>
  <button class="stop" onclick="stopAgent()">STOP</button>
</div>

<!-- LOGS -->
<div class="card">
  <strong>Trade Logs</strong>
  <div id="logs"></div>
</div>

<script>
const BACKEND_URL = "https://nexus-agent-backend.tarkanol.workers.dev";
let tickTimer = null;

async function startAgent(){
  await fetch(BACKEND_URL + "/agent/auto",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ on:true })
  });
  state.textContent="RUNNING";
  state.className="badge RUNNING";

  tickTimer=setInterval(()=>{
    fetch(BACKEND_URL+"/agent/tick",{method:"POST"});
  },15000);
}

async function stopAgent(){
  clearInterval(tickTimer);
  await fetch(BACKEND_URL+"/agent/stop",{method:"POST"});
  state.textContent="STOPPED";
  state.className="badge STOPPED";
}

async function refresh(){
  const r = await fetch(BACKEND_URL + "/status");
  const d = await r.json();

  mode.textContent = d.mode;
  balance.textContent = d.paper.balance.toFixed(2) + " USDT";
  pnl.textContent = d.paper.pnl.toFixed(2) + " USDT";

  logs.innerHTML = (d.logs || []).map(l => `<div class="log">${l}</div>`).join("");
}

setInterval(refresh,4000);
refresh();
</script>

</body>
</html>
