// YENİ: Dinamik TP/SL hesaplama (formül düzeltildi)
function calcTPSL(side, entry, slDistPercent, rrRatio){
  // slDistPercent: 0.5 -> %0.5
  let slPrice, tpPrice;
  if(side==='LONG'){
    slPrice = entry * (1 - slDistPercent/100);
    // TP'yi pozisyon büyüklüğüne göre dinamik hesapla
    let posValue = Math.min(riskAmountUSD/(slDistPercent/100), balance*0.25);
    let qty = (posValue * currentLeverage) / entry;
    let tpMove = profitTargetUSD / qty;
    tpPrice = entry + tpMove;
  } else {
    slPrice = entry * (1 + slDistPercent/100);
    let posValue = Math.min(riskAmountUSD/(slDistPercent/100), balance*0.25);
    let qty = (posValue * currentLeverage) / entry;
    let tpMove = profitTargetUSD / qty;
    tpPrice = entry - tpMove;
  }
  return {sl: slPrice, tp: tpPrice};
}

// PROJEKSİYON (aynı)
function calcProj(){
  var projTradesEl=document.getElementById('projTrades');
  var nTrades=parseInt((projTradesEl && projTradesEl.value) || 250);
  var projWREl=document.getElementById('projWR');
  var wr=parseFloat((projWREl && projWREl.value) || 55)/100;
  var projRREl=document.getElementById('projRR');
  var rr=parseFloat((projRREl && projRREl.value) || 2.5);
  var tpAmt=profitTargetUSD>0?profitTargetUSD:(riskAmountUSD*rr);
  var slAmt=tpAmt/rr;
  var wins=Math.round(nTrades*wr);
  var losses=nTrades-wins;
  var grossProfit=wins*tpAmt;
  var grossLoss=losses*slAmt;
  var commTotal=nTrades*riskAmountUSD*0.001;
  var net=grossProfit-grossLoss-commTotal;
  var remaining=100-balance;
  var months=net>0?Math.ceil(remaining/net):99;
  function el(id){return document.getElementById(id);}
  if(el('projTarget')) el('projTarget').textContent='$'+tpAmt.toFixed(3);
  if(el('projProfit')) el('projProfit').textContent='$'+grossProfit.toFixed(2);
  if(el('projLoss')) el('projLoss').textContent='-$'+grossLoss.toFixed(2);
  if(el('projNet')){ el('projNet').textContent=(net>=0?'+':'')+'$'+net.toFixed(2); el('projNet').style.color=net>=0?'var(--long)':'var(--short)'; }
  if(el('projMonths')) el('projMonths').textContent=net>0?months+' ay':'Kârsız';
  var note=net>0?'✅ '+nTrades+' işlem/ay ile $'+remaining.toFixed(2)+' hedefine '+months+' ayda ulaşılır.':'⚠️ Bu parametrelerle kâr negatif. Win Rate veya R:R artır.';
  if(el('projNote')) el('projNote').textContent=note;
  var monthlyTrades=trades.length;
  var monthlyProfit=trades.reduce(function(a,t){return a+t.pnl;},0);
  var avgPerTrade=monthlyTrades>0?monthlyProfit/monthlyTrades:0;
  if(el('monthEarned')) el('monthEarned').textContent=(monthlyProfit>=0?'+':'')+'$'+monthlyProfit.toFixed(2);
  if(el('monthTrades')) el('monthTrades').textContent=monthlyTrades;
  if(el('monthAvg')) el('monthAvg').textContent=monthlyTrades>0?(avgPerTrade>=0?'+':'')+'$'+avgPerTrade.toFixed(3):'--';
  if(el('monthWR')) el('monthWR').textContent=trades.length?((trades.filter(t=>t.pnl>0).length/trades.length)*100).toFixed(1)+'%':'--';
}

// İNDİKATÖRLER (Aynı)
function ema(arr,p){if(!arr||arr.length<p)return arr?arr.slice():[];var k=2/(p+1),out=new Array(p-1);for(var i=0;i<p-1;i++)out[i]=null;var e=0;for(var j=0;j<p;j++)e+=arr[j];e/=p;out.push(e);for(var m=p;m<arr.length;m++){e=arr[m]*k+e*(1-k);out.push(e);}return out;}
function rsi(closes,p){p=p||14;if(closes.length<p+2)return 50;var g=0,l=0;for(var i=1;i<=p;i++){var d=closes[i]-closes[i-1];d>0?g+=d:l-=d;}var ag=g/p,al=l/p;for(var j=p+1;j<closes.length;j++){var d2=closes[j]-closes[j-1];ag=(ag*(p-1)+(d2>0?d2:0))/p;al=(al*(p-1)+(d2<0?-d2:0))/p;}return al===0?100:100-(100/(1+ag/al));}
function atr(kl,p){p=p||14;if(!kl||kl.length<p+1)return kl&&kl.length>1?kl[kl.length-1].h-kl[kl.length-1].l:1;var trs=[];for(var i=1;i<kl.length;i++){var pc=kl[i-1].c;trs.push(Math.max(kl[i].h-kl[i].l,Math.abs(kl[i].h-pc),Math.abs(kl[i].l-pc)));}var sum=0;for(var j=trs.length-p;j<trs.length;j++)sum+=trs[j];return sum/p;}
function macd(closes){var e12=ema(closes,12),e26=ema(closes,26);var ml=[];for(var i=0;i<closes.length;i++){if(e12[i]&&e26[i])ml.push(e12[i]-e26[i]);}if(!ml.length)return{hist:0,prevHist:0,macd:0,signal:0,cross:null};var sg=ema(ml,9);var m=ml[ml.length-1],s=sg[sg.length-1];var pm=ml.length>1?ml[ml.length-2]:m,ps=sg.length>1?sg[sg.length-2]:s;return{hist:m-s,prevHist:pm-ps,macd:m,signal:s,cross:pm<ps&&m>s?'UP':pm>ps&&m<s?'DN':null};}
function adxCalc(kl,p){p=p||14;if(!kl||kl.length<p+2)return{adx:20,pDI:20,mDI:20};var trs=[],pDM=[],mDM=[];for(var i=1;i<kl.length;i++){var h=kl[i].h,l=kl[i].l,ph=kl[i-1].h,pl=kl[i-1].l,pc=kl[i-1].c;trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));var up=h-ph,dn=pl-l;pDM.push(up>dn&&up>0?up:0);mDM.push(dn>up&&dn>0?dn:0);}var sumTR=0,sumPD=0,sumMD=0;for(var j=trs.length-p;j<trs.length;j++)sumTR+=trs[j];for(var k=pDM.length-p;k<pDM.length;k++)sumPD+=pDM[k];for(var m2=mDM.length-p;m2<mDM.length;m2++)sumMD+=mDM[m2];var av=sumTR/p||1;var pdi=sumPD/p/av*100;var mdi=sumMD/p/av*100;return{adx:Math.abs(pdi-mdi)/(pdi+mdi+.001)*100,pDI:pdi,mDI:mdi};}
function bbCalc(closes,p,k){p=p||20;k=k||2;if(closes.length<p)return{upper:closes[closes.length-1]*1.02,mid:closes[closes.length-1],lower:closes[closes.length-1]*0.98,w:0.02};var sl=closes.slice(-p);var sum=0;for(var i=0;i<sl.length;i++)sum+=sl[i];var mean=sum/p;var sqSum=0;for(var j=0;j<sl.length;j++)sqSum+=(sl[j]-mean)*(sl[j]-mean);var std=Math.sqrt(sqSum/p);return{upper:mean+k*std,mid:mean,lower:mean-k*std,w:(2*k*std)/(mean||1)};}
function volRatio(kl,p){p=p||20;if(!kl||kl.length<p+1)return 1;var v=kl.slice(-p).map(function(k){return k.v;});var sum=0;for(var i=0;i<v.length-1;i++)sum+=v[i];var avg=sum/(v.length-1);return avg>0?v[v.length-1]/avg:1;}
function fibCalc(kl,n){n=n||60;if(!kl||kl.length<10)return null;n=Math.min(n,kl.length);var rec=kl.slice(-n);var sh=-Infinity,sl=Infinity;for(var i=0;i<rec.length;i++){if(rec[i].h>sh)sh=rec[i].h;if(rec[i].l<sl)sl=rec[i].l;}var rng=sh-sl;if(rng<=0)return null;return{sh,sl,r236:sh-rng*.236,r382:sh-rng*.382,r500:sh-rng*.5,r618:sh-rng*.618,r786:sh-rng*.786};}
function findSwings(kl,lb){lb=lb||1;var highs=[],lows=[];for(var i=lb;i<kl.length-lb;i++){var h=kl[i].h,l=kl[i].l,isH=true,isL=true;for(var j=i-lb;j<i;j++){if(kl[j].h>=h)isH=false;if(kl[j].l<=l)isL=false;}for(var k=i+1;k<=i+lb;k++){if(kl[k].h>=h)isH=false;if(kl[k].l<=l)isL=false;}if(isH)highs.push({price:h,idx:i});if(isL)lows.push({price:l,idx:i});}return{highs:highs.slice(-4),lows:lows.slice(-4)};}

// Monte Carlo (iyileştirildi: 50 trial, 0.55 eşik)
function runMonteCarlo(sym, side, entry, sl, tp){
  if(!monteCarloActive) return true;
  var pd=pData[sym];if(!pd)return true;
  var kl=pd.kl5m||pd.kl15m||[];
  if(kl.length<30) return true;
  var closes=kl.slice(-50).map(function(k){return k.c;});
  var returns=[];
  for(var i=1;i<closes.length;i++) returns.push((closes[i]-closes[i-1])/closes[i-1]);
  if(!returns.length) return true;
  var trials=50, wins=0;
  for(var t=0;t<trials;t++){
    var simPrice=entry;
    for(var step=0;step<20;step++){
      var rIdx=Math.floor(Math.random()*returns.length);
      simPrice*=(1+returns[rIdx]);
      if(side==='LONG'){
        if(simPrice>=tp){wins++;break;}
        if(simPrice<=sl) break;
      }else{
        if(simPrice<=tp){wins++;break;}
        if(simPrice>=sl) break;
      }
    }
  }
  var score=wins/trials;
  if(score<0.55){addLog('🎲 MC: '+sym.replace('USDT','')+' elendi (skor: '+(score*100).toFixed(0)+'%)','info');return false;}
  return true;
}

// Dinamik Fibonacci (iyileştirildi: çakışma toleransı)
function calcDynamicFibLevels(sym, entry, side){
  var pd=pData[sym];if(!pd)return null;
  var kl3m=pd.kl5m||pd.kl15m||[];
  var kl15m=pd.kl15m||[];
  if(kl3m.length<20||kl15m.length<20) return null;
  var fib3=fibCalc(kl3m,40), fib15=fibCalc(kl15m,60);
  if(!fib3||!fib15) return null;
  var levels3=[fib3.r236,fib3.r382,fib3.r5||fib3.r500,fib3.r618,fib3.r786];
  var levels15=[fib15.r236,fib15.r382,fib15.r5||fib15.r500,fib15.r618,fib15.r786];
  var bestTP=null,bestSL=null,minDist=Infinity;
  for(var i=0;i<levels3.length;i++){
    for(var j=0;j<levels15.length;j++){
      var diff=Math.abs(levels3[i]-levels15[j]);
      if(diff/entry < 0.003 && (side==='LONG'?levels3[i]>entry:levels3[i]<entry)){
        var dist=Math.abs(levels3[i]-entry);
        if(dist<minDist){
          minDist=dist;
          bestTP=levels3[i];
          bestSL=(side==='LONG'?entry-(bestTP-entry)*0.5:entry+(entry-bestTP)*0.5);
        }
      }
    }
  }
  if(bestTP){
    // TP'nin minimum scalp hedefini sağladığını kontrol et
    var profitDist=Math.abs(bestTP-entry);
    var qty = (Math.min(riskAmountUSD/(0.5/100), balance*0.25) * currentLeverage) / entry;
    var minProfit=profitTargetUSD / qty;
    if(profitDist<minProfit) return null;
    return {tp:bestTP, sl:bestSL};
  }
  return null;
}

// GELİŞMİŞ SİNYAL ANALİZİ (Scalp odaklı)
function analyzeChallenge(sym){
  if(isInCooldown(sym)) return null;
  var pd=pData[sym];if(!pd)return null;
  var kl5m=pd.kl5m||[],kl15m=pd.kl15m||[],kl1h=pd.kl1h||[],kl4h=pd.kl4h||[];
  if(kl5m.length<20||kl15m.length<20||kl1h.length<20) return null;
  var price=pd.price||kl5m[kl5m.length-1].c;

  // Hacim onayı (1.2x)
  if(volumeConfirmActive && kl15m.length>=20){
    var volumes=kl15m.slice(-20).map(function(k){return k.v;});
    var avgVol=volumes.slice(0,-1).reduce(function(a,b){return a+b;},0)/19;
    var lastVol=volumes[volumes.length-1];
    if(lastVol < avgVol*volumeMultiplier) return null;
  }

  // Scalp trend ağırlıkları: 5m/15m/1h ağırlıklı, 4h sadece filtre
  var c5=kl5m.map(k=>k.c),c15=kl15m.map(k=>k.c),c1=kl1h.map(k=>k.c);
  var e9_5=ema(c5,9),e21_5=ema(c5,21);
  var e9_15=ema(c15,9),e21_15=ema(c15,21),e50_15=ema(c15,50);
  var e9_1=ema(c1,9),e21_1=ema(c1,21),e50_1=ema(c1,50);
  var lastE9_5=e9_5[e9_5.length-1],lastE21_5=e21_5[e21_5.length-1];
  var lastE9_15=e9_15[e9_15.length-1],lastE21_15=e21_15[e21_15.length-1],lastE50_15=e50_15[e50_15.length-1];
  var lastE9_1=e9_1[e9_1.length-1],lastE21_1=e21_1[e21_1.length-1],lastE50_1=e50_1[e50_1.length-1];

  var scalpbull=0, scalpbear=0;
  // 5 dk EMA
  if(lastE9_5>lastE21_5) scalpbull+=3; else scalpbear+=3;
  // 15 dk EMA
  if(lastE9_15>lastE21_15 && lastE21_15>lastE50_15) scalpbull+=4;
  else if(lastE9_15<lastE21_15 && lastE21_15<lastE50_15) scalpbear+=4;
  else if(lastE9_15>lastE21_15) scalpbull+=1; else scalpbear+=1;
  // 1h EMA
  if(lastE9_1>lastE21_1 && lastE21_1>lastE50_1) scalpbull+=5;
  else if(lastE9_1<lastE21_1 && lastE21_1<lastE50_1) scalpbear+=5;
  else if(lastE9_1>lastE21_1) scalpbull+=2; else scalpbear+=2;

  // RSI 15m
  var rsi15=rsi(c15,14);
  if(rsi15>55 && rsi15<70) scalpbull+=3;
  else if(rsi15<45 && rsi15>30) scalpbear+=3;

  // ADX 15m
  var adx15=adxCalc(kl15m,14);
  if(adx15.adx>20){
    if(adx15.pDI>adx15.mDI) scalpbull+=4;
    else scalpbear+=4;
  }

  // 4h trend filtre (sadece engel olmasın)
  var c4=kl4h.map(k=>k.c);
  var e50_4=ema(c4,50);
  var lastE50_4=e50_4[e50_4.length-1];
  var htfTrend='NEUTRAL';
  if(price > lastE50_4*1.005) htfTrend='LONG';
  else if(price < lastE50_4*0.995) htfTrend='SHORT';

  var signal='WAIT';
  var conf=0;
  if(scalpbull>scalpbear && scalpbull>=12){
    signal='LONG';
    conf=Math.round(scalpbull/(scalpbull+scalpbear)*100);
  } else if(scalpbear>scalpbull && scalpbear>=12){
    signal='SHORT';
    conf=Math.round(scalpbear/(scalpbull+scalpbear)*100);
  }
  if(signal==='WAIT') return null;

  // 4h trende ters düşme
  if(htfTrend!=='NEUTRAL' && signal!==htfTrend){
    addLog('🚫 4h blok: '+sym.replace('USDT','')+' sinyal '+signal+' ama 4h '+htfTrend,'info');
    return null;
  }

  // Çakışma koruması (ters sinyal skoru)
  if(conflictActive){
    var oppScore = signal==='LONG'?scalpbear:scalpbull;
    if(oppScore > (signal==='LONG'?scalpbull:scalpbear)*0.8) return null;
  }

  // TP/SL hesabı (dinamik)
  var slDistPercent = slPercent;
  var tpSl = calcTPSL(signal, price, slDistPercent, userRR);
  var sl=tpSl.sl, tp=tpSl.tp;

  // Dinamik fib TP (eğer açıksa ve geçerliyse)
  if(dynamicTPActive){
    var dyn=calcDynamicFibLevels(sym, price, signal);
    if(dyn){tp=dyn.tp; sl=dyn.sl;}
  }

  // Monte Carlo (isteğe bağlı)
  if(monteCarloActive){
    if(!runMonteCarlo(sym,signal,price,sl,tp)) return null;
  }

  return {signal,conf,price,sl,tp,rrRatio:userRR,
    indicators:{rsi:rsi15,macdHist:macd(c15).hist,adx:adx15.adx,ema50above:price>lastE50_1},
    mtf:{'5m':lastE9_5>lastE21_5?'LONG':'SHORT','15m':lastE9_15>lastE21_15?'LONG':'SHORT','1h':lastE9_1>lastE21_1?'LONG':'SHORT','4h':htfTrend}
  };
}
function analyzeAll(){
  for(var i=0;i<customPairs.length;i++){

    if(!pData[sym])continue;

    try{pData[sym].analysis=analyzeChallenge(sym);}catch(e){addLog('Analiz hatası '+sym+': '+e.message,'err');}
  }
}

async function checkPositions(){
  for(var i=0;i<positions.length;i++){
    var p=positions[i];
    var pr=(pData[p.pair]&&pData[p.pair].price)||p.entry;
    var pnl=calcUnrealPnl(p);
    // Kısmi kâr kilitleme: TP'nin %70'ine ulaştıysa SL'yi entry'e çek
    if(scalpMode && p.tp){
      var tpMove = Math.abs(p.tp - p.entry);
      var progress = p.side==='LONG' ? (pr - p.entry) / tpMove : (p.entry - pr) / tpMove;
      if(progress >= 0.7 && progress < 1.0){
        if(p.side==='LONG' && p.sl < p.entry){
          p.sl = p.entry;
          addLog('🔒 BE: '+p.pair.replace('USDT','')+' SL başabaş çekildi','info');
        } else if(p.side==='SHORT' && p.sl > p.entry){
          p.sl = p.entry;
          addLog('🔒 BE: '+p.pair.replace('USDT','')+' SL başabaş çekildi','info');
        }
      }
    }
    // TP/SL kontrolü
    if(scalpMode&&profitTargetUSD>0&&pnl>=profitTargetUSD){await closePos(p.id,'SCALP TARGET ⚡');i--;continue;}
    if(p.tp&&((p.side==='LONG'&&pr>=p.tp)||(p.side==='SHORT'&&pr<=p.tp))){await closePos(p.id,'TAKE PROFIT');i--;continue;}
    if((p.side==='LONG'&&pr<=p.sl)||(p.side==='SHORT'&&pr>=p.sl)){await closePos(p.id,'STOP LOSS');i--;continue;}
  }
}
