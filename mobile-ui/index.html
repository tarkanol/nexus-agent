<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#02040a">
  <title>APEX v7.1 — Quick Smooth + iPhone Fix</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#02040a; --bg2:#060b14; --bg3:#080d18;
      --border:#0f1e30; --border2:#162840;
      --accent:#00ffcc; --accent2:#00cc99;
      --long:#00ff88; --short:#ff4466;
      --yellow:#ffdd00; --blue:#44aaff; --orange:#ff9944; --purple:#aa66ff;
      --tier-high:#00ff88; --tier-med:#ffdd00; --tier-low:#44aaff;
      --quick:#ff66aa;
      --text:#ddeeff; --text2:#6688aa; --text3:#2a4060;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bot:env(safe-area-inset-bottom,0px);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100dvh;overflow-x:hidden;}
    .app{display:flex;flex-direction:column;min-height:100dvh;padding-top:var(--safe-top);}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(60px + var(--safe-bot));}
    .wrap{max-width:1240px;margin:0 auto;padding:10px;}

    header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:100;}
    .logo{font-family:'Bebas Neue';font-size:22px;letter-spacing:4px;color:var(--accent);}
    .logo small{display:block;font-family:'Space Mono';font-size:8px;letter-spacing:1px;color:var(--text3);margin-top:-2px;}
    .hbadges{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
    .hbadge{font-family:'Space Mono';font-size:8px;letter-spacing:0.5px;padding:3px 7px;border:1px solid;}
    .hbadge.live{color:var(--long);border-color:var(--long);animation:pulse 2s infinite;}
    .hbadge.sim{color:var(--yellow);border-color:var(--yellow);}
    .hbadge.off{color:var(--text3);border-color:var(--text3);}
    .hbadge.scanning{color:var(--blue);border-color:var(--blue);animation:pulse 1.5s infinite;}
    .hbadge.warn{color:var(--orange);border-color:var(--orange);}
    .hbadge.quick-badge{color:var(--quick);border-color:var(--quick);animation:pulse 0.8s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

    .daily-bar{background:rgba(0,0,0,.6);border-bottom:1px solid var(--border2);padding:6px 14px;display:flex;gap:10px;align-items:center;font-family:'Space Mono';font-size:9px;overflow-x:auto;white-space:nowrap;}
    .db-item{display:flex;gap:5px;align-items:center;}
    .db-label{color:var(--text3);}.db-val{color:var(--text2);}
    .db-val.ok{color:var(--long);}.db-val.warn{color:var(--yellow);}.db-val.stop{color:var(--short);}
    .db-sep{color:var(--text3);opacity:.3;}
    .daily-progress{flex:1;min-width:80px;height:3px;background:var(--border2);overflow:hidden;}
    .daily-fill{height:100%;background:var(--accent);transition:width .5s;}
    .daily-fill.warn{background:var(--yellow);}.daily-fill.stop{background:var(--short);}

    .comm-banner{display:none;background:rgba(255,68,102,.08);border-bottom:2px solid rgba(255,68,102,.3);padding:8px 14px;font-family:'Space Mono';font-size:9px;color:var(--short);text-align:center;}
    .comm-banner.show{display:block;}

    .tab-nav{display:flex;background:var(--bg2);border-top:1px solid var(--border2);position:sticky;bottom:0;z-index:1000;will-change:transform;touch-action:manipulation;}
    .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:none;background:transparent;color:var(--text3);font-family:'Space Mono';font-size:7px;letter-spacing:.5px;cursor:pointer;transition:color .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:44px;justify-content:center;}
    .tab-btn.active{color:var(--accent);}
    .tab-pane{display:none;}.tab-pane.active{display:block;}

    .panel{background:var(--bg2);border:1px solid var(--border);position:relative;overflow:hidden;margin-bottom:10px;}
    .panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);opacity:.2;}
    .ph{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);}
    .ph-title{font-family:'Space Mono';font-size:8px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;display:flex;align-items:center;gap:6px;}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
    .dot.scan{background:var(--blue);animation:pulse 1.5s infinite;}
    .dot.quick-dot{background:var(--quick);animation:pulse 0.8s infinite;}
    .pb{padding:12px;}

    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .stat-card{background:var(--bg2);border:1px solid var(--border);padding:11px 13px;}
    .stat-label{font-size:8px;color:var(--text3);letter-spacing:1px;font-family:'Space Mono';text-transform:uppercase;}
    .stat-val{font-family:'Bebas Neue';font-size:24px;letter-spacing:2px;margin-top:1px;line-height:1;}
    .stat-sub{font-size:9px;color:var(--text2);margin-top:2px;font-family:'Space Mono';}

    .tier-section{margin-bottom:10px;}
    .tier-header{display:flex;align-items:center;justify-content:space-between;padding:8px 13px;border:1px solid;margin-bottom:6px;}
    .tier-header.high{border-color:rgba(0,255,136,.4);background:rgba(0,255,136,.04);}
    .tier-header.med{border-color:rgba(255,221,0,.3);background:rgba(255,221,0,.03);}
    .tier-header.low{border-color:rgba(68,170,255,.25);background:rgba(68,170,255,.03);}
    .tier-label{font-family:'Bebas Neue';font-size:16px;letter-spacing:2px;}
    .tier-label.high{color:var(--tier-high);}.tier-label.med{color:var(--tier-med);}.tier-label.low{color:var(--tier-low);}
    .tier-desc{font-family:'Space Mono';font-size:8px;color:var(--text3);}
    .tier-count{font-family:'Space Mono';font-size:9px;}

    .signal-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
    .sig-card{border:1px solid var(--border2);padding:8px;cursor:pointer;transition:all .2s;position:relative;}
    .sig-card.long{border-color:rgba(0,255,136,.4);}
    .sig-card.short{border-color:rgba(255,68,102,.4);}
    .sig-card.wait{opacity:.4;}
    .sig-card:hover{border-color:var(--accent);}
    .sig-card .sc-pair{font-family:'Bebas Neue';font-size:16px;letter-spacing:1px;}
    .sig-card .sc-pair.long{color:var(--long);}.sig-card .sc-pair.short{color:var(--short);}
    .sig-card .sc-sig{font-family:'Space Mono';font-size:8px;margin-top:2px;}
    .sig-card .sc-conf{font-family:'Space Mono';font-size:9px;font-weight:700;margin-top:3px;}
    .sig-card .sc-tp{font-family:'Space Mono';font-size:8px;color:var(--text3);margin-top:2px;}
    .sig-card .sc-comm{font-family:'Space Mono';font-size:8px;margin-top:2px;}
    .sig-card .sc-comm.ok{color:var(--long);}.sig-card .sc-comm.risk{color:var(--yellow);}
    .tier-badge{position:absolute;top:4px;right:4px;font-family:'Space Mono';font-size:7px;padding:1px 4px;border:1px solid;}
    .tier-badge.high{border-color:var(--tier-high);color:var(--tier-high);}
    .tier-badge.med{border-color:var(--tier-med);color:var(--tier-med);}
    .tier-badge.low{border-color:var(--tier-low);color:var(--tier-low);}

    .slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 13px;}
    .slot-card{border:1px solid var(--border2);padding:10px;position:relative;min-height:100px;transition:border-color .3s;}
    .slot-card.empty{border-style:dashed;opacity:.45;}
    .slot-card.long-pos{border-color:var(--long);}
    .slot-card.short-pos{border-color:var(--short);}
    .slot-card.quick-pos{border-color:var(--quick);}
    .slot-num{position:absolute;top:5px;right:7px;font-family:'Space Mono';font-size:8px;color:var(--text3);}
    .slot-pair{font-family:'Bebas Neue';font-size:17px;letter-spacing:2px;}
    .slot-pair.long{color:var(--long);}.slot-pair.short{color:var(--short);}.slot-pair.quick-mode{color:var(--quick);}
    .slot-pair.empty{color:var(--text3);}
    .slot-meta{font-family:'Space Mono';font-size:8px;color:var(--text3);margin-top:2px;}
    .slot-pnl{font-family:'Space Mono';font-size:11px;font-weight:700;margin-top:5px;}
    .slot-tpsl{font-family:'Space Mono';font-size:8px;color:var(--text3);margin-top:3px;}
    .slot-tier{display:inline-block;font-family:'Space Mono';font-size:7px;padding:1px 4px;border:1px solid;margin-top:3px;}
    .slot-tier.high{border-color:var(--tier-high);color:var(--tier-high);}
    .slot-tier.med{border-color:var(--tier-med);color:var(--tier-med);}
    .slot-tier.low{border-color:var(--tier-low);color:var(--tier-low);}
    .slot-tier.quick-tier{border-color:var(--quick);color:var(--quick);}
    .slot-close{position:absolute;bottom:6px;right:6px;background:rgba(255,68,102,.15);border:1px solid var(--short);color:var(--short);font-size:8px;padding:3px 6px;cursor:pointer;font-family:'Space Mono';}
    .slots-footer{display:flex;align-items:center;gap:12px;padding:0 13px 10px;font-family:'Space Mono';font-size:10px;flex-wrap:wrap;}

    .price-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 13px 8px;}
    .price-big{font-family:'Bebas Neue';font-size:32px;letter-spacing:2px;line-height:1;}
    .price-chg{font-size:10px;font-family:'Space Mono';margin-top:2px;}
    .price-meta{text-align:right;font-family:'Space Mono';font-size:9px;color:var(--text2);}
    canvas{width:100%!important;display:block;}
    .chart-controls{display:flex;gap:6px;padding:6px 13px 0;flex-wrap:wrap;}
    .iv-btn{padding:4px 10px;font-family:'Space Mono';font-size:9px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;}
    .iv-btn.active{border-color:var(--accent);color:var(--accent);}

    .signal-hero{padding:16px 14px;text-align:center;}
    .signal-badge{font-family:'Bebas Neue';font-size:38px;letter-spacing:4px;padding:12px 28px;border:2px solid;display:inline-block;transition:all .3s;min-width:160px;}
    .signal-badge.LONG{color:var(--long);border-color:var(--long);}
    .signal-badge.SHORT{color:var(--short);border-color:var(--short);}
    .signal-badge.WAIT{color:var(--text2);border-color:var(--border2);}
    .signal-conf{font-family:'Space Mono';font-size:10px;color:var(--text3);margin-top:5px;}
    .signal-tier-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
    .signal-tier-badge{font-family:'Space Mono';font-size:10px;padding:4px 12px;border:1px solid;}
    .signal-tier-badge.high{border-color:var(--tier-high);color:var(--tier-high);background:rgba(0,255,136,.07);}
    .signal-tier-badge.med{border-color:var(--tier-med);color:var(--tier-med);background:rgba(255,221,0,.06);}
    .signal-tier-badge.low{border-color:var(--tier-low);color:var(--tier-low);background:rgba(68,170,255,.06);}
    .signal-tier-badge.none{border-color:var(--border2);color:var(--text3);}
    .comm-check{font-family:'Space Mono';font-size:9px;margin-top:5px;}
    .comm-check.ok{color:var(--long);}.comm-check.warn{color:var(--yellow);}.comm-check.block{color:var(--short);}

    .score-meter{display:flex;height:5px;border-radius:2px;overflow:hidden;margin:10px 0 4px;}
    .sm-bull{background:var(--long);transition:flex .5s;}
    .sm-neut{background:var(--yellow);transition:flex .5s;}
    .sm-bear{background:var(--short);transition:flex .5s;}
    .score-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text3);font-family:'Space Mono';}
    .ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
    .ind-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:rgba(0,0,0,.3);border:1px solid var(--border);}
    .ind-name{color:var(--text2);font-size:10px;font-family:'Space Mono';}
    .ind-val{font-weight:700;font-size:11px;font-family:'Space Mono';}
    .bull{color:var(--long);}.bear{color:var(--short);}.neut{color:var(--yellow);}

    .atr-info{display:flex;gap:10px;padding:6px 13px;background:rgba(0,0,0,.3);border-top:1px solid var(--border);font-family:'Space Mono';font-size:9px;flex-wrap:wrap;}
    .atr-item .al{color:var(--text3);}.atr-item .av{color:var(--accent);}
    .atr-item .av.long{color:var(--long);}.atr-item .av.short{color:var(--short);}

    .fib-panel{background:rgba(0,0,0,.3);border:1px solid var(--border);margin:8px 13px;padding:8px 10px;}
    .fib-title{font-family:'Space Mono';font-size:8px;letter-spacing:2px;color:var(--text3);margin-bottom:8px;}
    .fib-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
    .fib-level{text-align:center;padding:5px 3px;border:1px solid;}
    .fib-level .fl-r{font-family:'Space Mono';font-size:8px;font-weight:700;}
    .fib-level .fl-p{font-family:'Space Mono';font-size:9px;margin-top:2px;}
    .fib-level .fl-d{font-size:8px;color:var(--text3);font-family:'Space Mono';margin-top:1px;}
    .fib-level.near{background:rgba(255,255,255,.05);}
    .fib-236{border-color:#00ffcc;color:#00ffcc;}
    .fib-382{border-color:#ff9944;color:#ff9944;}
    .fib-500{border-color:#ffdd00;color:#ffdd00;}
    .fib-618{border-color:#aa66ff;color:#aa66ff;}
    .fib-786{border-color:#44aaff;color:#44aaff;}

    .mode-select{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;}
    .mode-opt{padding:10px 8px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-family:'Space Mono';font-size:9px;cursor:pointer;text-align:center;letter-spacing:.5px;transition:all .2s;}
    .mode-opt.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,204,.06);}
    .mode-opt.active-quick{border-color:var(--quick);color:var(--quick);background:rgba(255,102,170,.06);}
    .mode-opt .mo-name{font-family:'Bebas Neue';font-size:16px;letter-spacing:1px;display:block;}
    .mode-opt .mo-desc{font-size:8px;opacity:.7;margin-top:2px;}
    .mode-opt .mo-tp{font-size:9px;margin-top:4px;}

    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
    .field label{font-size:9px;color:var(--text3);letter-spacing:1px;font-family:'Space Mono';text-transform:uppercase;}
    .field input,.field select{background:#040810;border:1px solid var(--border2);color:var(--text);padding:10px 12px;font-family:'Space Mono';font-size:12px;outline:none;width:100%;-webkit-appearance:none;}
    .field input:focus,.field select:focus{border-color:var(--accent);}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
    .lev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
    .lev-btn{padding:10px 4px;font-family:'Space Mono';font-size:10px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;text-align:center;transition:all .2s;}
    .lev-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,204,.06);}

    .trade-preview{background:rgba(0,0,0,.4);border:1px solid var(--border2);padding:10px 13px;margin-bottom:12px;font-family:'Space Mono';font-size:9px;}
    .tp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
    .tp-label{color:var(--text3);}.tp-val{color:var(--text);}
    .tp-val.ok{color:var(--long);}.tp-val.warn{color:var(--yellow);}.tp-val.bad{color:var(--short);}
    .comm-warn-box{background:rgba(255,68,102,.06);border:1px solid rgba(255,68,102,.3);padding:8px 12px;margin-bottom:10px;font-family:'Space Mono';font-size:9px;color:var(--short);}

    .btn-long{background:var(--long);color:#000;font-family:'Space Mono';font-size:13px;font-weight:700;padding:15px;cursor:pointer;border:none;letter-spacing:1px;width:100%;margin-bottom:6px;}
    .btn-short{background:var(--short);color:#fff;font-family:'Space Mono';font-size:13px;font-weight:700;padding:15px;cursor:pointer;border:none;letter-spacing:1px;width:100%;margin-bottom:6px;}
    .btn-quick{background:var(--quick);color:#fff;font-family:'Space Mono';font-size:13px;font-weight:700;padding:15px;cursor:pointer;border:none;letter-spacing:1px;width:100%;margin-bottom:6px;}
    .btn-long:disabled,.btn-short:disabled,.btn-quick:disabled{opacity:.3;cursor:not-allowed;}
    .btn-accent{background:var(--accent);color:#000;font-family:'Space Mono';font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;border:none;padding:13px 18px;width:100%;margin-bottom:6px;}
    .btn-red{background:var(--short);color:#fff;font-family:'Space Mono';font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;border:none;padding:13px 18px;width:100%;}
    .btn-accent:disabled,.btn-red:disabled{opacity:.3;}

    .hist-item{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--border);font-size:10px;font-family:'Space Mono';}
    .hist-item:last-child{border-bottom:none;}
    .hist-side{padding:2px 7px;font-size:8px;font-weight:700;}
    .hist-side.L{background:rgba(0,255,136,.12);color:var(--long);}
    .hist-side.S{background:rgba(255,68,102,.12);color:var(--short);}
    .hist-side.Q{background:rgba(255,102,170,.12);color:var(--quick);}
    .hist-tier{font-size:8px;color:var(--text3);}

    .compound-val{font-family:'Bebas Neue';font-size:34px;letter-spacing:2px;color:var(--accent);}
    .progress-bar{height:4px;background:var(--bg3);margin:6px 0;}
    .progress-fill{height:100%;background:var(--accent);transition:width 1s ease;}
    .ms-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;}
    .ms-cell{text-align:center;padding:6px 3px;background:rgba(0,0,0,.3);border:1px solid var(--border);}
    .ms-cell .ms-n{font-size:8px;color:var(--text3);font-family:'Space Mono';}
    .ms-cell .ms-v{font-size:10px;color:var(--text);font-family:'Space Mono';}
    .daily-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;}
    .ds-cell{text-align:center;padding:8px;background:rgba(0,0,0,.3);border:1px solid var(--border);}
    .ds-cell .ds-label{font-family:'Space Mono';font-size:8px;color:var(--text3);}
    .ds-cell .ds-val{font-family:'Bebas Neue';font-size:18px;letter-spacing:1px;margin-top:2px;}

    .scan-countdown{display:flex;align-items:center;gap:8px;padding:6px 13px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.2);}
    .countdown-bar{flex:1;height:3px;background:var(--border);overflow:hidden;}
    .countdown-fill{height:100%;background:var(--blue);transition:width 1s linear;}
    .scan-wrap{overflow-x:auto;}
    .scan-table{width:100%;border-collapse:collapse;font-size:10px;font-family:'Space Mono';min-width:320px;}
    .scan-table th{padding:7px 10px;text-align:left;color:var(--text3);border-bottom:1px solid var(--border);font-size:8px;letter-spacing:1px;}
    .scan-table td{padding:7px 10px;border-bottom:1px solid var(--border);}
    .scan-table tr:last-child td{border-bottom:none;}
    .scan-table tr.high-row{background:rgba(0,255,136,.03);}
    .scan-table tr.med-row{background:rgba(255,221,0,.02);}
    .sig-pill{display:inline-block;padding:2px 6px;font-size:8px;font-weight:700;letter-spacing:1px;}
    .sig-pill.LONG{background:rgba(0,255,136,.12);color:var(--long);}
    .sig-pill.SHORT{background:rgba(255,68,102,.12);color:var(--short);}
    .sig-pill.WAIT{background:rgba(42,64,96,.3);color:var(--text3);}
    .tier-pill{display:inline-block;padding:1px 5px;font-size:7px;border:1px solid;margin-left:3px;}
    .tier-pill.HIGH{border-color:var(--tier-high);color:var(--tier-high);}
    .tier-pill.MED{border-color:var(--tier-med);color:var(--tier-med);}
    .tier-pill.LOW{border-color:var(--tier-low);color:var(--tier-low);}
    .comm-pct{font-size:8px;}
    .comm-pct.ok{color:var(--long);}.comm-pct.risk{color:var(--yellow);}.comm-pct.block{color:var(--short);}

    .pair-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 13px;}

    .awake-status{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);font-family:'Space Mono';font-size:10px;}

    .toggle-sw::after{content:'';position:absolute;width:14px;height:14px;background:var(--text3);border-radius:50%;top:2px;left:2px;transition:all .2s;}

    .info-box{background:rgba(255,221,0,.03);border:1px solid rgba(255,221,0,.2);padding:10px 13px;font-family:'Space Mono';font-size:9px;line-height:1.9;color:var(--text2);margin-bottom:10px;}
    .info-box .ib-title{color:var(--yellow);font-size:10px;margin-bottom:5px;font-weight:700;}
    .info-box code{color:var(--accent);background:rgba(0,255,204,.07);padding:1px 5px;}
    .log-box{height:180px;overflow-y:auto;padding:10px;background:var(--bg);font-size:9px;font-family:'Space Mono';line-height:1.9;}

    .le{display:flex;gap:8px;}.lt{color:var(--text3);flex-shrink:0;}
    .lINFO{color:var(--text2)}.lLONG{color:var(--long)}.lSHORT{color:var(--short)}

    .lSCAN{color:var(--blue)}.lFIB{color:#aa66ff}.lROTATE{color:#ff9944}.lBLOCK{color:var(--short)}
    .lQUICK{color:var(--quick)}.lMOLA{color:#ff9944}

    .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .ticker{background:var(--bg3);border-bottom:1px solid var(--border);overflow:hidden;padding:4px 0;}
    .ticker-inner{display:flex;gap:20px;animation:tick 18s linear infinite;white-space:nowrap;width:max-content;}
    @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .ti-item{font-size:9px;display:flex;gap:4px;font-family:'Space Mono';}
    .ti-s{color:var(--text2);}.ti-p{color:var(--text);}

    .col-acc{color:var(--accent)}.col-long{color:var(--long)}.col-short{color:var(--short)}
    .col-yellow{color:var(--yellow)}.col-blue{color:var(--blue)}.col-quick{color:var(--quick)}
    .col-text{color:var(--text)}

    .auto-bar{border:1px solid var(--border2);margin-bottom:10px;overflow:hidden;}
    .auto-bar.mode-off{border-color:var(--border2);}
    .auto-bar.mode-swing{border-color:var(--yellow);}
    .auto-bar.mode-full{border-color:var(--accent);}
    .auto-bar-top{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:rgba(0,0,0,.2);}
    .auto-bar-title{font-family:'Bebas Neue';font-size:16px;letter-spacing:2px;}
    .auto-bar-desc{font-size:9px;color:var(--text2);font-family:'Space Mono';padding:0 13px 10px;}
    .auto-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--border);}
    .auto-btn{padding:10px 4px;font-family:'Space Mono';font-size:9px;border:none;border-right:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;text-align:center;letter-spacing:.5px;transition:all .2s;}
    .auto-btn:last-child{border-right:none;}

    .auto-btn.active-swing{color:var(--yellow);background:rgba(255,221,0,.06);}
    .auto-btn.active-full{color:var(--accent);background:rgba(0,255,204,.06);}

    .daily-limit-panel{background:rgba(255,68,102,.05);border:1px solid rgba(255,68,102,.2);padding:10px 13px;margin-bottom:10px;font-family:'Space Mono';font-size:9px;}
    .dlp-title{color:var(--short);font-size:10px;margin-bottom:6px;font-weight:700;}
    .dlp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
    .dlp-label{color:var(--text3);}.dlp-val{color:var(--text2);}
    .dlp-val.ok{color:var(--long);}.dlp-val.warn{color:var(--yellow);}.dlp-val.stop{color:var(--short);}

    .quick-panel{background:rgba(255,102,170,.04);border:1px solid rgba(255,102,170,.25);padding:10px 13px;margin-bottom:10px;font-family:'Space Mono';font-size:9px;}
    .quick-title{color:var(--quick);font-size:10px;margin-bottom:6px;font-weight:700;}
    .quick-mola{background:rgba(255,153,68,.1);border:1px solid rgba(255,153,68,.3);padding:8px 13px;font-family:'Space Mono';font-size:9px;color:var(--orange);text-align:center;margin-bottom:10px;display:none;}
    .quick-mola.show{display:block;}

    .range-label span{font-size:11px;font-weight:700;}
    input[type=range]{width:100%;accent-color:var(--accent);height:3px;}

    @media(min-width:700px){
      .tab-nav{display:none;}
      .tab-pane{display:block!important;}
      .content{overflow:visible;padding-bottom:20px;}
      .stat-grid{grid-template-columns:repeat(4,1fr);}
    }
  </style>
</head>
<body>
<div class="app">

<div class="ticker"><div class="ticker-inner" id="tickerInner">

<div class="tab-pane active" id="tab0">
  <div class="panel">

            <option value="1">1 – Hızlı (tek sinyal)</option>

</div>

<script>
// v7.1 Quick Smooth + iPhone Fix
const COMMISSION_RT = 0.0004;
const MAX_SLOTS = 3;
let WORKER = '';
let wakeLock = null;

let S = {
  connected:false, running:false,
  autoMode:'off', tradeMode:'swing',
  pair:'BTCUSDT', interval:'15m', leverage:2,
  capital:50, startCapital:50, balance:50,
  dayPnl:0, totalPnl:0, totalCommission:0,
  trades:[], positions:[], klines:[], price:0,
  indicators:{}, signal:'WAIT', score:{},
  lastTradeTime:0,
  refreshTimer:null, hbTimer:null,
  heartbeatInterval:10000,
  chartData:{prices:[],ema9:[],ema21:[]},
  mode:'sim',
  scanResults:[], tierHigh:[], tierMed:[], tierLow:[],
  fib:null,
  atrTpMult:2.0, atrSlMult:1.0,
  dailyMax:8, dailyToday:0, dailyWin:0, dailyLoss:0,
  posIdCounter:1,
  scanPairs:["BTCUSDT","ETHUSDT","SOLUSDT","BNBUSDT","XRPUSDT"],
  quickTp:0.06, quickSl:0.15, quickDailyTarget:1.00, quickSize:10,
  quickDailyPnl:0, quickMola:false,
  quickScanActive:false, quickTimer:null,
  quickSmoothLevel:2,        // 1,2,3
  quickSignalBuffer:[]       // son N sinyal yönü
};

function switchTab(n){
  document.querySelectorAll('.tab-pane').forEach((p,i)=>p.classList.toggle('active',i===n));
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===n));
}

function updateQuickSettings(){
  S.quickTp = parseFloat(document.getElementById('quickTp').value)||0.06;
  S.quickSl = parseFloat(document.getElementById('quickSl').value)||0.15;
  S.quickDailyTarget = parseFloat(document.getElementById('quickDailyTarget').value)||1.00;
  S.quickSize = parseFloat(document.getElementById('quickSize').value)||10;
  S.quickSmoothLevel = parseInt(document.getElementById('quickSmooth').value)||2;
}

function isQuickMola(){ return S.quickMola || S.quickDailyPnl >= S.quickDailyTarget; }

function setTradeMode(mode){
  S.tradeMode = mode;
  document.getElementById('quickSettingsPanel').style.display = mode==='quick' ? 'block' : 'none';
  if(mode==='quick') { S.interval = '1m'; }
  else { S.interval = '15m'; }
  updateQuickSettings();
}

function manualTrade(side){ openTrade(side, false); }

function getPairPrice(sym){
  if(sym===S.pair) return S.price||0;
  return 0;
}

// Basit fiyat simülasyonu (gerçek worker yoksa)
async function fetchTicker(sym){
  if(!WORKER) return {lastPrice: 50000 + Math.random()*100};
  try{ const r=await fetch(`${WORKER}/price?symbol=${sym}`); const j=await r.json(); return j.data; }catch(e){return null;}
}
async function fetchKlines(sym,interval,limit=50){
  if(!WORKER) return Array(limit).fill([0,0,0,0,50000+Math.random()*100,0]);
  try{ const r=await fetch(`${WORKER}/klines?symbol=${sym}&interval=${interval}&limit=${limit}`); const j=await r.json(); return j.data; }catch(e){return null;}
}

function ema(prices,period){ /* aynı */ return prices.map((_,i)=>i<period-1?null:prices.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period); }
function rsi(prices,p=14){ /* basit */ return 50; }
function macd(prices){ return {hist:0}; }
function stochRSI(prices){ return {k:50,d:50}; }
function calcATR(klines){ return 50; }
function calcAll(closes,klines){ return {r:50,macd:{hist:0},e9:closes[closes.length-1],e21:closes[closes.length-1],last:closes[closes.length-1]}; }
function scoreSignal(ind){
  // Quick mod için basitleştirilmiş skor (demo)
  const r = Math.random();
  if(r>0.6) return {bull:12,bear:4,neut:1,conf:75,signal:'LONG',reason:'test'};
  else if(r>0.3) return {bull:4,bear:12,neut:1,conf:75,signal:'SHORT',reason:'test'};
  return {bull:4,bear:4,neut:8,conf:50,signal:'WAIT',reason:'yatay'};
}

// Sinyal yumuşatma buffer kontrolü
function getSmoothedQuickSignal(score){
  if(!score || score.signal==='WAIT') {
    S.quickSignalBuffer = [];
    return 'WAIT';
  }
  const dir = score.signal; // LONG veya SHORT
  const needed = S.quickSmoothLevel || 2;
  S.quickSignalBuffer.push(dir);
  if(S.quickSignalBuffer.length > needed) S.quickSignalBuffer.shift();
  if(S.quickSignalBuffer.length < needed) return 'WAIT';
  const allSame = S.quickSignalBuffer.every(d=>d===dir);
  return allSame ? dir : 'WAIT';
}

async function refresh(){
  if(!S.running) return;
  try{
    const ticker = await fetchTicker(S.pair);
    if(ticker) S.price = parseFloat(ticker.lastPrice||ticker.price)||S.price;
    const klines = await fetchKlines(S.pair, S.interval, 50);
    if(klines && klines.length>20){
      const closes = klines.map(k=>parseFloat(k[4]));
      S.chartData.prices = closes;
      const ind = calcAll(closes, klines);
      S.score = scoreSignal(ind);
    }
    checkSLTP();
    renderSlots();
  }catch(e){}
}

function checkSLTP(){
  S.positions.forEach(p=>{
    const cp = getPairPrice(p.pair)||p.entry;
    if(p.tradeMode==='quick'){
      const pnlPerUnit = (cp-p.entry)*(p.side==='LONG'?1:-1)*p.lev;
      const totalPnl = pnlPerUnit * p.qty;
      if(totalPnl >= p.tpDollar) closeTrade(p.id,'TP');
      else if(totalPnl <= -p.slDollar) closeTrade(p.id,'SL');
    }
  });
}

async function openTrade(side, auto=false, pairOverride=null, tierOverride=null){
  if(!S.connected) return;
  const pair = pairOverride||S.pair;
  const ep = getPairPrice(pair)||S.price;
  const isQuick = S.tradeMode==='quick';
  let tp, sl, tpDollar=0, slDollar=0;
  if(isQuick){
    const qty = S.quickSize / ep;
    tpDollar = S.quickTp; slDollar = S.quickSl;
    tp = side==='LONG' ? ep + tpDollar/qty : ep - tpDollar/qty;
    sl = side==='LONG' ? ep - slDollar/qty : ep + slDollar/qty;
  }
  const usdAmount = isQuick ? S.quickSize : S.balance*0.33;
  const qty = usdAmount/ep;
  S.positions.push({
    id:S.posIdCounter++, pair, side, entry:ep, qty, lev:S.leverage,
    size:usdAmount, tp, sl, tier:isQuick?'QUICK':null,
    tradeMode:S.tradeMode, auto, tpDollar, slDollar
  });
  S.lastTradeTime = Date.now();
  S.dailyToday++;
}

async function closeTrade(id, reason='MANUAL'){
  const pos = S.positions.find(p=>p.id===id); if(!pos) return;
  const cp = getPairPrice(pos.pair)||pos.entry;
  const pnl = (cp-pos.entry)*(pos.side==='LONG'?1:-1)*pos.qty*pos.lev;
  const netPnl = pnl - commissionCost(pos.size);
  S.balance += netPnl; S.dayPnl += netPnl;
  if(pos.tradeMode==='quick') S.quickDailyPnl += netPnl;
  S.positions = S.positions.filter(p=>p.id!==id);
  if(pos.tradeMode==='quick' && S.quickDailyPnl >= S.quickDailyTarget){
    S.quickMola = true;
    addLog('MOLA','🛑 Quick hedefe ulaşıldı');
    stopQuickScan();
  }
  renderSlots();
}

function renderSlots(){
  const grid = document.getElementById('slotsGrid');
  grid.innerHTML = S.positions.map(p=>`<div class="slot-card">${p.pair} ${p.side}</div>`).join('') || 'BOŞ';
}

async function manualQuickScan(){
  if(!S.connected || isQuickMola()) return;
  await refresh();
  const smoothSignal = getSmoothedQuickSignal(S.score);
  if(smoothSignal==='WAIT'){ addLog('QUICK','Yumuşatılmış sinyal yok'); return; }
  openTrade(smoothSignal, false);
  startQuickScan();
}

function startQuickScan(){
  if(S.quickScanActive) return;
  S.quickScanActive = true;
  S.quickTimer = setInterval(async ()=>{
    if(!S.running || isQuickMola()){ stopQuickScan(); return; }
    await refresh();
    const smooth = getSmoothedQuickSignal(S.score);
    if(smooth!=='WAIT' && S.positions.length<MAX_SLOTS){
      openTrade(smooth, false);
    }
    checkSLTP();
  }, 10000);
}

function stopQuickScan(){
  if(S.quickTimer){ clearInterval(S.quickTimer); S.quickTimer=null; }
  S.quickScanActive = false;
}

function setPair(btn,pair){ S.pair=pair; }
function setLev(btn,lev){ S.leverage=lev; }
function setAutoMode(mode){ S.autoMode=mode; }

async function connect(){
  WORKER = document.getElementById('workerUrl').value.trim();
  if(!WORKER) return;
  S.connected = true; S.running = true;
  S.refreshTimer = setInterval(refresh, S.heartbeatInterval);
  await refresh();
}

function stopAgent(){
  S.running = false;
  clearInterval(S.refreshTimer);
  stopQuickScan();
}

function addLog(type,msg){ console.log(type,msg); }

window.addEventListener('load', ()=>{
  setTradeMode('swing');
  updateQuickSettings();
  renderSlots();
});
</script>
