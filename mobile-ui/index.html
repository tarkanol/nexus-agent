<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>APEX Pro V4.0 – Price Action Core</title>
<style>
:root{
  --bg:#020810;--panel:#07111f;--brd:#0e1e35;
  --acc:#00ffe0;--long:#00e676;--short:#ff3d5c;
  --warn:#f5a623;--text:#b8cce0;--dim:#4a5e78;--deep:#0d1e33;
  --gold:#fbbf24;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'JetBrains Mono',system-ui,monospace;font-size:13px}
header{background:var(--panel);border-bottom:1px solid var(--brd);padding:calc(env(safe-area-inset-top)+6px) 14px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100}
.logo{font-weight:700;font-size:15px;color:var(--gold);letter-spacing:2px}
.logo span{color:var(--dim);font-size:10px;margin-left:4px;font-weight:400}
.badges{display:flex;align-items:center;flex-wrap:wrap}
.bdg{font-size:9px;padding:3px 7px;border-radius:3px;background:var(--deep);color:var(--dim);margin-right:4px;margin-bottom:4px}
.bdg:last-child{margin-right:0}
.bdg.live{background:#0a2f1a;color:var(--long)}
.bdg.gold{background:rgba(251,191,36,.15);color:var(--gold);border:1px solid rgba(251,191,36,.3)}
.bdg.scalp{background:rgba(0,255,224,.12);color:var(--acc);border:1px solid rgba(0,255,224,.3)}
.bdg.danger{background:rgba(255,61,92,.15);color:var(--short)}
.ticker{background:#040c18;border-bottom:1px solid var(--brd);padding:5px 12px;overflow-x:auto;white-space:nowrap;display:flex;flex-shrink:0;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tick{display:inline-flex;align-items:center;font-size:10px;margin-right:14px}
.tick:last-child{margin-right:0}
.tick-s{color:var(--dim)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--panel);border-top:1px solid var(--brd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;padding:9px 4px 7px;background:none;border:none;color:var(--dim);font-size:9px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:color .15s;min-height:44px}
.nb.active{color:var(--gold)}
.ni{font-size:18px;line-height:1}
.page{display:none;flex-direction:column;height:100%;overflow:hidden}
.page.active{display:flex}
.scroll{flex:1;overflow-y:auto;padding:10px 12px 100px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--panel);border:1px solid var(--brd);border-radius:6px;padding:10px;margin-bottom:8px}
.challenge-bar{background:var(--panel);border-bottom:1px solid var(--brd);padding:8px 12px;flex-shrink:0}
.ch-bal{font-size:18px;font-weight:700;color:var(--gold)}
.sig-wrap{text-align:center;padding:14px 0 10px}
.sig-badge{font-size:30px;font-weight:700;letter-spacing:4px;padding:10px 28px;border-radius:8px;display:inline-block;min-width:155px}
.sig-badge.LONG{background:rgba(0,230,118,.1);color:var(--long);border:2px solid rgba(0,230,118,.3)}
.sig-badge.SHORT{background:rgba(255,61,92,.1);color:var(--short);border:2px solid rgba(255,61,92,.3)}
.sig-badge.WAIT{background:var(--deep);color:var(--dim);border:2px solid var(--brd)}
.sig-info{font-size:10px;color:var(--dim);margin-top:5px;text-align:center}
canvas{display:block;width:100%;border-radius:4px}
.fr{margin-bottom:8px}
label{font-size:9px;color:var(--dim);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
input,select{background:var(--deep);border:1px solid var(--brd);color:var(--text);padding:8px 10px;border-radius:5px;width:100%;font-family:inherit;font-size:12px;outline:none;min-height:38px}
.btn{border:none;border-radius:5px;padding:11px 14px;font-weight:700;cursor:pointer;font-size:12px;font-family:inherit;min-height:44px;transition:filter .12s}
.btn-gold{background:var(--gold);color:#000}
.btn-outline{background:transparent;border:1px solid var(--brd);color:var(--text)}
.tog-row{display:flex;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--brd)}
.tog{width:38px;height:22px;background:var(--deep);border-radius:11px;cursor:pointer;position:relative;border:1px solid var(--brd);flex-shrink:0;transition:background .2s;margin-top:1px;min-width:38px;margin-right:10px}
.tog.on{background:var(--acc);border-color:var(--acc)}
.tog::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s}
.tog.on::after{left:18px}
.tog-b{flex:1}.tog-l{font-size:11px;color:var(--text)}.tog-d{font-size:9px;color:var(--dim);margin-top:1px}
.logbox{background:#000;color:#3a6a5a;font-size:10px;height:180px;overflow-y:auto;padding:7px;border-radius:4px;line-height:1.8}
#notif{position:fixed;top:calc(env(safe-area-inset-top)+50px);left:12px;right:12px;z-index:999;display:flex;flex-direction:column;pointer-events:none}
.notif{padding:10px 14px;border-radius:6px;font-size:11px;font-weight:700;animation:nin .2s ease;pointer-events:auto;margin-bottom:6px}
.notif.success{background:#0a2f1a;border:1px solid var(--long);color:var(--long)}
.notif.error{background:#2a0a10;border:1px solid var(--short);color:var(--short)}
@keyframes nin{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.pos-c{background:var(--deep);border-radius:6px;padding:10px;margin-bottom:8px;border-left:3px solid transparent}
.pos-c.long{border-color:var(--long)}.pos-c.short{border-color:var(--short)}
.pos-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pos-pnl{font-size:17px;font-weight:700}
.pos-pnl.up{color:var(--long)}.pos-pnl.dn{color:var(--short)}
.brow{display:flex;margin-bottom:6px}
.brow .btn{margin-right:6px}
.brow .btn:last-child{margin-right:0}
</style>
</head>
<body>
<div id="notif"></div>
<header>
  <div class="logo">APEX <span>V4.0</span></div>
  <div class="badges">
    <span class="bdg" id="connBdg">DEMO</span>
    <span class="bdg scalp" id="scalpModeBdg">SCALP $0.12</span>
    <span class="bdg gold" id="stageBdg">PRO</span>
    <span class="bdg" id="posBdg">0/3</span>
    <span class="bdg" id="engBdg">OFF</span>
  </div>
</header>
<div class="challenge-bar">
  <div class="ch-row">
    <div><div class="ch-bal" id="chBal">$37.44</div><div class="ch-target" id="chTarget">Hedef: $100.00</div></div>
    <div style="text-align:right"><div class="ch-pct" id="chPct">+0.00%</div></div>
  </div>
</div>

<!-- SİNYAL SAYFASI -->
<div class="page" id="pg-signal"><div class="scroll">
    <div class="card"><div class="sig-wrap"><div class="sig-badge WAIT" id="sigBadge">WAIT</div><div class="sig-info" id="sigInfo">Fiyat hareketi analizi bekleniyor...</div></div>
    <canvas id="chart" height="155"></canvas></div>
    <div class="card"><div style="font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:7px">MANUEL GİRİŞ</div>
    <div class="brow"><button class="btn btn-outline" id="btnL" onclick="manualOpen('LONG')" disabled>▲ LONG</button><button class="btn btn-outline" id="btnS" onclick="manualOpen('SHORT')" disabled>▼ SHORT</button></div></div>
</div></div>

<!-- POZİSYON SAYFASI -->
<div class="page" id="pg-pos"><div class="scroll">
    <div class="card"><div class="ch-bal" id="dispBal">$37.44</div><div id="dispDay" style="font-size:10px;">Günlük: $0.00</div></div>
    <div id="posList"></div>
    <div class="card"><div style="font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:6px">SON İŞLEMLER</div><div id="histBox"></div></div>
</div></div>

<!-- MOTOR SAYFASI -->
<div class="page" id="pg-engine"><div class="scroll">
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:13px;font-weight:700" id="engTxt">MOTOR KAPALI</div></div><button class="btn btn-gold" id="btnEng" onclick="toggleEng()">▶ Başlat</button></div></div>
    <div class="card">
        <div style="font-size:9px;color:var(--gold);letter-spacing:1px;margin-bottom:8px">🤖 STRATEJİ: HACİM + KIRILIM + MOMENTUM</div>
        <div class="tog-row"><div class="tog off" id="togAutoTrade" onclick="toggleAutoTrade()"></div><div class="tog-b"><div class="tog-l">Otomatik İşlem</div><div class="tog-d" id="autoTradeDesc">Kapalı: sadece sinyal gösterir</div></div></div>
        <div class="fr"><label>Kâr Hedefi ($)</label><input type="number" id="profitTargetUSD" value="0.12" step="0.01" onchange="profitTargetUSD=parseFloat(this.value)"></div>
        <div class="fr"><label>Stop Loss (%)</label><input type="number" id="slPercent" value="0.4" step="0.05" onchange="slPercent=parseFloat(this.value)"></div>
        <div class="fr"><label>Risk ($)</label><input type="number" id="riskAmount" value="1.5" step="0.5" onchange="riskAmountUSD=parseFloat(this.value)"></div>
        <div class="fr"><label>Kaldıraç</label><select id="selLeverage" onchange="currentLeverage=parseInt(this.value)"><option value="2" selected>2x</option><option value="3">3x</option></select></div>
        <div class="fr"><label>Tarama (sn)</label><select id="selInt" onchange="scanSec=parseInt(this.value)"><option value="120" selected>2 dk</option><option value="180">3 dk</option></select></div>
    </div>
</div></div>

<nav class="nav">
  <button class="nb active" id="nb-signal" onclick="sw('signal')"><span class="ni">📡</span>Sinyal</button>
  <button class="nb" id="nb-pos" onclick="sw('pos')"><span class="ni">📂</span>Pozisyon</button>
  <button class="nb" id="nb-engine" onclick="sw('engine')"><span class="ni">⚙️</span>Motor</button>
</nav>

<script>
// ═══════════════════════════════════
// KONFİGÜRASYON
const CHALLENGE_START=37.44, COMM=0.0004;
let customPairs=['BTCUSDT','ETHUSDT','SOLUSDT'];
const DEMO_BASE={BTCUSDT:74000,ETHUSDT:2050,SOLUSDT:83};
let WORKER='',appMode='demo';
let balance=CHALLENGE_START, peakBal=CHALLENGE_START;
let dailyPnL=0, dailyTradeCount=0, totalComm=0, futBal=null;
let positions=[], trades=[], posId=1;
let currentPair='BTCUSDT', currentTF='5m';
let scanSec=120, engineOn=false;
let autoTrade=false;
let currentLeverage=2, slPercent=0.4, riskAmountUSD=1.5, profitTargetUSD=0.12;
let loopTimer=null, cdTimer2=null, quickUpdateInterval=null;
const pState={}, prevP={}, pData={};

function initDataForPairs(){customPairs.forEach(s=>{let bp=DEMO_BASE[s]||1;pState[s]={price:bp,vel:0};prevP[s]=bp;if(!pData[s])pData[s]={};});}
initDataForPairs();

// ═══════════════════════════════════
// UTILS
var currentPage='signal';
function sw(p){currentPage=p;document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));var tp=document.getElementById('pg-'+p);if(tp)tp.classList.add('active');var tb=document.getElementById('nb-'+p);if(tb)tb.classList.add('active');if(p==='signal')setTimeout(drawChart,50);}
function notify(msg,type){var s=document.getElementById('notif');var d=document.createElement('div');d.className='notif '+(type||'info');d.textContent=msg;s.appendChild(d);setTimeout(()=>d.remove(),3000);}
function fp(p){if(!p||isNaN(p))return'--';return p>=1000?p.toFixed(2):p.toFixed(4);}
function updateChallenge(){var bal=appMode==='live'&&futBal!==null?futBal:balance;document.getElementById('chBal').textContent='$'+bal.toFixed(2);document.getElementById('dispBal').textContent='$'+bal.toFixed(2);document.getElementById('dispDay').textContent='Günlük: '+(dailyPnL>=0?'+':'')+dailyPnL.toFixed(2);var pct=(bal-CHALLENGE_START)/CHALLENGE_START*100;document.getElementById('chPct').textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%';}

// ═══════════════════════════════════
// YENİ NESİL SİNYAL MOTORU (PRICE ACTION)
function findSwings(kl, len){
  len=len||5; let highs=[], lows=[];
  for(let i=len; i<kl.length-len; i++){
    let isHigh=true, isLow=true;
    for(let j=i-len; j<=i+len; j++){
      if(j===i) continue;
      if(kl[j].h >= kl[i].h) isHigh=false;
      if(kl[j].l <= kl[i].l) isLow=false;
    }
    if(isHigh) highs.push({price:kl[i].h, idx:i});
    if(isLow) lows.push({price:kl[i].l, idx:i});
  }
  return {highs: highs.slice(-3), lows: lows.slice(-3)};
}

function analyzePriceAction(sym){
  var pd=pData[sym]; if(!pd) return null;
  var kl=pd.kl5m || []; if(kl.length < 40) return null;
  var price = pd.price || kl[kl.length-1].c;

  // 1. Hacim Patlaması (Alıcı/Satıcı gücü)
  var vols = kl.slice(-10).map(k=>k.v);
  var avgVol = vols.slice(0,-1).reduce((a,b)=>a+b,0)/9;
  var lastVol = vols[vols.length-1];
  if(lastVol < avgVol * 1.5) return null; // Hacim yoksa işlem yok

  // 2. Kırılma Tespiti
  var swings = findSwings(kl, 5);
  var lastHigh = swings.highs.length ? swings.highs[swings.highs.length-1].price : price*1.01;
  var lastLow = swings.lows.length ? swings.lows[swings.lows.length-1].price : price*0.99;

  var signal = 'WAIT';
  if(price > lastHigh) signal = 'LONG';
  else if(price < lastLow) signal = 'SHORT';
  if(signal === 'WAIT') return null;

  // 3. Momentum Onayı (Peş peşe 2 yeşil/kırmızı mum)
  var lastC = kl[kl.length-1].c, prevC = kl[kl.length-2].c, prev2C = kl[kl.length-3].c;
  if(signal === 'LONG' && !(lastC > prevC && prevC > prev2C)) return null;
  if(signal === 'SHORT' && !(lastC < prevC && prevC < prev2C)) return null;

  // TP/SL Hesaplama (Dinamik)
  var posValue=Math.min(riskAmountUSD/(slPercent/100),balance*0.25);
  var qty=(posValue*currentLeverage)/price;
  var tpMove=profitTargetUSD/qty;
  var sl = signal==='LONG' ? price*(1-slPercent/100) : price*(1+slPercent/100);
  var tp = signal==='LONG' ? price+tpMove : price-tpMove;

  return { signal, conf: 85, price, sl, tp };
}

function analyzeAll(){ customPairs.forEach(sym => { if(pData[sym]) pData[sym].analysis = analyzePriceAction(sym); }); }

// ═══════════════════════════════════
// POZİSYON YÖNETİMİ
function calcUnrealPnl(pos){var pr=(pData[pos.pair]&&pData[pos.pair].price)||pos.entry;var mult=pos.side==='LONG'?1:-1;return(pr-pos.entry)*mult*pos.qty;}
function updatePosUI(){
  updateChallenge();
  var html='';
  if(!positions.length)html='<div style="text-align:center;padding:24px;color:var(--dim)">Açık pozisyon yok</div>';
  else positions.forEach(p=>{
    var pr=(pData[p.pair]&&pData[p.pair].price)||p.entry, pnl=calcUnrealPnl(p);
    html+='<div class="pos-c '+(p.side.toLowerCase())+'"><div class="pos-h"><span>'+p.pair.replace('USDT','')+' '+p.side+'</span><span class="pos-pnl '+(pnl>=0?'up':'dn')+'">'+(pnl>=0?'+':'')+'$'+pnl.toFixed(4)+'</span></div><button class="btn btn-outline" onclick="closePos('+p.id+')" style="font-size:10px;padding:5px 10px;min-height:32px;">✕ Kapat</button></div>';
  });
  document.getElementById('posList').innerHTML=html;
  document.getElementById('posBdg').textContent=positions.length+'/3';
  var histHtml=trades.slice(-5).reverse().map(t=>'<div style="font-size:10px;margin-bottom:2px;">'+t.pair.replace('USDT','')+' '+t.side+' <span style="color:'+(t.pnl>=0?'var(--long)':'var(--short)')+'">'+(t.pnl>=0?'+':'')+'$'+t.pnl.toFixed(4)+'</span></div>').join('');
  document.getElementById('histBox').innerHTML=histHtml||'--';
}
async function openPos(sym,side){
  var an=pData[sym]?pData[sym].analysis:null;
  if(!an||!an.sl) return;
  if(positions.length>=3) return;
  var price=an.price, slPct=Math.abs(an.sl-price)/price*100;
  var posValue=Math.min(riskAmountUSD/(slPct/100),balance*0.25);
  var qty=(posValue*currentLeverage)/price, comm=posValue*COMM*2;
  positions.push({id:posId++,pair:sym,side,entry:price,qty,lev:currentLeverage,posValue,sl:an.sl,tp:an.tp,comm,openTime:Date.now()});
  dailyPnL-=comm; balance-=comm; totalComm+=comm; dailyTradeCount++;
  if(balance>peakBal) peakBal=balance;
  notify('✅ '+side+' '+sym.replace('USDT','')+' @$'+fp(price),'success');
  updatePosUI();
}
async function closePos(id){
  var pos=positions.find(p=>p.id===id); if(!pos) return;
  var pr=(pData[pos.pair]&&pData[pos.pair].price)||pos.entry;
  var mult=pos.side==='LONG'?1:-1;
  var gross=(pr-pos.entry)*mult*pos.qty, net=gross-pos.comm;
  dailyPnL+=net; balance+=net+pos.posValue; totalComm+=pos.comm;
  if(balance>peakBal) peakBal=balance;
  trades.push({pair:pos.pair,side:pos.side,pnl:net});
  positions=positions.filter(p=>p.id!==id);
  notify((net>=0?'🟢':'🔴')+' '+pos.pair.replace('USDT','')+' Kapatıldı $'+net.toFixed(4), net>=0?'success':'error');
  updatePosUI();
}
async function checkPositions(){
  for(var i=0;i<positions.length;i++){
    var p=positions[i], pr=(pData[p.pair]&&pData[p.pair].price)||p.entry;
    if(p.tp&&((p.side==='LONG'&&pr>=p.tp)||(p.side==='SHORT'&&pr<=p.tp))){await closePos(p.id);i--;continue;}
    if((p.side==='LONG'&&pr<=p.sl)||(p.side==='SHORT'&&pr>=p.sl)){await closePos(p.id);i--;continue;}
  }
}

// ═══════════════════════════════════
// ENGINE
async function runEngine(){
  if(!engineOn) return;
  var signals=[];
  customPairs.forEach(sym => {
    var an=pData[sym]?pData[sym].analysis:null;
    if(an && an.signal!=='WAIT') signals.push({sym, an});
  });
  if(!signals.length) { document.getElementById('sigInfo').textContent='Sinyal bekleniyor...'; return; }
  var sel = signals[0];
  document.getElementById('sigInfo').textContent='Sinyal: '+sel.sym.replace('USDT','')+' '+sel.an.signal;
  if(autoTrade && positions.length<3) await openPos(sel.sym, sel.an.signal);
}
function manualOpen(side){ openPos(currentPair, side); }

// ═══════════════════════════════════
// KONTROLLER
function toggleEng(){
  engineOn=!engineOn;
  document.getElementById('btnEng').textContent=engineOn?'⏸ Durdur':'▶ Başlat';
  document.getElementById('engBdg').textContent=engineOn?'ON':'OFF';
  document.getElementById('engTxt').textContent=engineOn?'MOTOR ÇALIŞIYOR':'MOTOR KAPALI';
  notify(engineOn?'🚀 Motor açıldı':'⏸ Motor durdu');
  if(engineOn) { startCD(); mainLoop(); }
  else { if(loopTimer)clearTimeout(loopTimer); if(cdTimer2)clearInterval(cdTimer2); }
}
function startCD(){if(cdTimer2)clearInterval(cdTimer2);var left=scanSec;cdTimer2=setInterval(()=>{left--;if(left<=0)clearInterval(cdTimer2);},1000);}
function toggleAutoTrade(){autoTrade=!autoTrade;document.getElementById('togAutoTrade').classList.toggle('on',autoTrade);}

// ═══════════════════════════════════
// DATA
function demoTick(sym){var s=pState[sym],base=DEMO_BASE[sym]||1,drift=(base-s.price)*0.0008;s.vel=s.vel*0.88+(Math.random()-0.5)*s.price*0.0003+drift;s.price=Math.max(s.price*0.85,s.price+s.vel);return s.price;}
function makeKlines(sym,n,tf){var tfMs={'5m':300000}[tf]||300000,p=pState[sym]?pState[sym].price:(DEMO_BASE[sym]||1),kl=[];for(var i=n-1;i>=0;i--){var o=p,c=o*(1+(Math.random()-0.5)*0.008);var rng=Math.abs(o-c)*1.2;kl.unshift({t:Date.now()-(n-i)*tfMs,o,h:Math.max(o,c)+rng*0.35,l:Math.min(o,c)-rng*0.35,c,v:Math.random()*8000+1000});p=c;}if(kl.length)kl[kl.length-1].c=pState[sym]?pState[sym].price:(DEMO_BASE[sym]||1);return kl;}
function refreshDemoFast(){
  customPairs.forEach(sym=>{prevP[sym]=pState[sym].price;demoTick(sym);if(!pData[sym])pData[sym]={};pData[sym].price=pState[sym].price;
    var now=Date.now(); if(!pData[sym].lastKl||now-pData[sym].lastKl>15000){pData[sym].kl5m=makeKlines(sym,100,'5m');pData[sym].lastKl=now;}});
  analyzeAll(); updateUI();
}
function refreshDemo(){customPairs.forEach(sym=>{prevP[sym]=pState[sym].price;demoTick(sym);if(!pData[sym])pData[sym]={};pData[sym].price=pState[sym].price;pData[sym].kl5m=makeKlines(sym,100,'5m');});analyzeAll();}
function updateUI(){updatePosUI(); if(currentPage==='signal') drawChart();}

// ═══════════════════════════════════
// CHART
var chartCtx;
function initChart(){chartCtx=document.getElementById('chart').getContext('2d');}
function drawChart(){
  if(!chartCtx||currentPage!=='signal')return;
  var pd=pData[currentPair];if(!pd||!pd.kl5m||pd.kl5m.length<10)return;
  var kl=pd.kl5m, W=chartCtx.canvas.width, H=155, ctx=chartCtx;
  ctx.clearRect(0,0,W,H);
  var n=Math.min(60,kl.length), k=kl.slice(-n), cl=k.map(x=>x.c);
  var mn=Math.min(...k.map(x=>x.l))*0.999, mx=Math.max(...k.map(x=>x.h))*1.001;
  var rng=mx-mn, cw=W/n;
  var toY=v=>H-6-((v-mn)/rng)*(H-12);
  ctx.beginPath();ctx.moveTo(0.5*cw,toY(cl[0]));for(var i=0;i<cl.length;i++)ctx.lineTo((i+0.5)*cw,toY(cl[i]));
  ctx.strokeStyle=cl[0]<=cl[cl.length-1]?'#00e676':'#ff3d5c';ctx.lineWidth=1.5;ctx.stroke();
}
