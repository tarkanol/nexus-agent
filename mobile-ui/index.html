<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APEX PRO · Kurumsal Futures Terminal</title>
  <style>
    :root {
      --bg: #030711; --panel: #060f1e; --border: #131f38;
      --acc: #00e0a0; --long: #00e676; --short: #ff3d5c;
      --warn: #f5a623; --text: #c0cde0; --dim: #5a6a80; --deep: #2a3348;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--font); height:100vh; display:flex; flex-direction:column; }
    header { background:var(--panel); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .logo { font-weight:700; font-size:20px; color:var(--acc); }
    .status { display:flex; gap:10px; }
    .badge { font-size:11px; padding:4px 10px; border-radius:4px; background:var(--deep); color:var(--dim); }
    .badge.live { background:#0a2f1a; color:var(--long); }
    .badge.demo { background:#2a2000; color:var(--warn); }
    .ticker { background:#0a101a; border-bottom:1px solid var(--border); padding:5px 16px; display:flex; gap:20px; overflow:hidden; font-family:var(--mono); font-size:12px; }
    main { flex:1; overflow-y:auto; padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:800px) { main { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; }
    .card h3 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:12px; }
    .flex-row { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { border:none; border-radius:6px; padding:10px 18px; font-weight:600; cursor:pointer; font-size:13px; transition:all .2s; }
    .btn:disabled { opacity:0.4; cursor:default; }
    .btn-long { background:var(--long); color:#000; }
    .btn-short { background:var(--short); color:#fff; }
    .btn-acc { background:var(--acc); color:#000; }
    .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
    .metric { font-family:var(--mono); font-size:24px; font-weight:600; }
    .metric-label { font-size:10px; color:var(--dim); margin-top:2px; }
    .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    input, select { background:var(--deep); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:4px; width:100%; font-family:var(--mono); }
    .log-box { background:#000; color:var(--dim); font-family:var(--mono); font-size:11px; height:200px; overflow-y:auto; padding:8px; border-radius:6px; margin-top:8px; }
    .signal-badge { font-size:28px; font-weight:700; padding:8px 20px; border-radius:8px; display:inline-block; }
    .LONG { background:rgba(0,230,118,0.15); color:var(--long); }
    .SHORT { background:rgba(255,61,92,0.15); color:var(--short); }
    .WAIT { background:var(--deep); color:var(--dim); }
    canvas { width:100%; border-radius:6px; }
    .tab-bar { display:flex; gap:0; margin-bottom:12px; }
    .tab { padding:8px 16px; background:var(--deep); border:none; color:var(--dim); cursor:pointer; font-size:12px; }
    .tab.active { background:var(--panel); color:var(--acc); border-bottom:2px solid var(--acc); }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
  </style>
</head>
<body>
<header>
  <div class="logo">APEX PRO</div>
  <div class="status">
    <span class="badge demo" id="connBadge">DEMO</span>
    <span class="badge demo" id="modeBadge">SIM</span>
    <span class="badge" id="posBadge">0/3</span>
    <span class="badge" id="riskBadge" style="background:#0a2f1a">RISK OK</span>
  </div>
</header>
<div class="ticker" id="ticker">Fiyatlar yükleniyor...</div>

<main>
  <div class="card" style="grid-column:1/-1;">
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('signal')">Sinyal</button>
      <button class="tab" onclick="switchTab('engine')">Pro Motor</button>
      <button class="tab" onclick="switchTab('portfolio')">Portföy</button>
      <button class="tab" onclick="switchTab('settings')">Ayarlar</button>
    </div>

    <!-- Sinyal Sekmesi -->
    <div id="signal" class="tab-content active">
      <div class="flex-row" style="justify-content:space-between;align-items:center;">
        <h3 id="pairTitle">BTCUSDT · 15m</h3>
        <div class="signal-badge WAIT" id="sigMain">WAIT</div>
      </div>
      <canvas id="chart" height="180"></canvas>
      <div class="grid-3" style="margin-top:10px;">
        <div><span class="metric-label">RSI</span><div class="metric" id="indRsi">--</div></div>
        <div><span class="metric-label">MACD</span><div class="metric" id="indMacd">--</div></div>
        <div><span class="metric-label">ATR</span><div class="metric" id="indAtr">--</div></div>
        <div><span class="metric-label">ADX (Rejim)</span><div class="metric" id="indAdx">--</div></div>
        <div><span class="metric-label">Hacim Oranı</span><div class="metric" id="indVol">--</div></div>
        <div><span class="metric-label">POC</span><div class="metric" id="indPoc">--</div></div>
      </div>
      <div class="flex-row" style="margin-top:10px;">
        <button class="btn btn-long" id="btnLong" onclick="manualTrade('LONG')">LONG</button>
        <button class="btn btn-short" id="btnShort" onclick="manualTrade('SHORT')">SHORT</button>
        <button class="btn btn-outline" onclick="runBacktest()">Backtest</button>
      </div>
    </div>

    <!-- Pro Motor Sekmesi -->
    <div id="engine" class="tab-content">
      <h3>Pro Trade Motoru</h3>
      <div class="grid-2">
        <div><label>Strateji</label><select id="strategy"><option value="trend">Trend İzleyen</option><option value="mean">Mean Reversion</option><option value="breakout">Breakout</option></select></div>
        <div><label>Risk Modeli</label><select id="riskModel"><option value="kelly">Kelly Kriteri</option><option value="fixed">Sabit %2</option><option value="atr">ATR Bazlı</option></select></div>
        <div><label>Maks. Günlük DD %</label><input id="maxDailyDD" value="5" type="number"></div>
        <div><label>Zaman Filtresi (UTC)</label><input id="timeFilter" value="02:00-07:00" placeholder="Başlangıç-Bitiş"></div>
      </div>
      <div class="flex-row" style="margin-top:12px;">
        <button class="btn btn-acc" id="btnStartEngine" onclick="toggleEngine()">Motoru Başlat</button>
        <button class="btn btn-outline" onclick="runBacktest()">Backtest</button>
      </div>
      <div class="grid-3" style="margin-top:12px;">
        <div><span class="metric-label">Kelly %</span><div class="metric" id="kellyPct">--</div></div>
        <div><span class="metric-label">Pozisyon $</span><div class="metric" id="posSize">--</div></div>
        <div><span class="metric-label">Günlük DD</span><div class="metric" id="dailyDD">0%</div></div>
      </div>
    </div>

    <!-- Portföy Sekmesi -->
    <div id="portfolio" class="tab-content">
      <h3>Portföy</h3>
      <div class="grid-3">
        <div><span class="metric-label">Bakiye</span><div class="metric" id="balance">$50.00</div></div>
        <div><span class="metric-label">Açık P&L</span><div class="metric" id="openPnl">$0.00</div></div>
        <div><span class="metric-label">Win Rate</span><div class="metric" id="winRate">--</div></div>
      </div>
      <div class="log-box" id="tradeLog" style="height:150px;"></div>
    </div>

    <!-- Ayarlar Sekmesi -->
    <div id="settings" class="tab-content">
      <h3>Ayarlar</h3>
      <div class="grid-2">
        <div><label>Worker URL</label><input id="workerUrl" value="demo"></div>
        <div><label>Başlangıç Sermayesi</label><input id="capital" value="50" type="number"></div>
      </div>
      <button class="btn btn-acc" style="margin-top:10px;" onclick="connect()">Bağlan</button>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════════
// APEX PRO ENGINE v1.0 – OTOMATİK DEMO BAŞLANGIÇ
// ═══════════════════════════════════════════════════════
const MAX_POS = 3;
const COMM = 0.0004;

// State
let WORKER = 'demo';
let connected = true;   // demo modda hep true
let engineRunning = false;
let balance = 50, startBalance = 50;
let positions = [], trades = [];
let posId = 1;
let dailyPnL = 0, peakBalance = 50;
let kellyFraction = 0.10; // Kelly'nin %10'u (güvenli)
let currentPair = 'BTCUSDT';
let klines = [], indicators = {};
let signal = 'WAIT';

// Demo fiyat havuzu
const DEMO = {
  BTCUSDT:68000, ETHUSDT:3500, SOLUSDT:180, BNBUSDT:590, XRPUSDT:0.65
};

// ═══════════════════════ UI YARDIMCILARI ════════════
function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (event && event.target) event.target.classList.add('active');
  if (id === 'signal') drawChart();
}

function updateUI() {
  document.getElementById('balance').textContent = '$' + balance.toFixed(2);
  document.getElementById('posBadge').textContent = positions.length + '/' + MAX_POS;
  const dailyDD = peakBalance > 0 ? ((peakBalance - balance) / peakBalance * 100).toFixed(1) : 0;
  document.getElementById('dailyDD').textContent = dailyDD + '%';
  document.getElementById('riskBadge').textContent = dailyDD > 5 ? 'RISK HIGH' : 'RISK OK';
  document.getElementById('riskBadge').style.background = dailyDD > 5 ? '#3a1a1a' : '#0a2f1a';
  if (balance > peakBalance) peakBalance = balance;

  const wins = trades.filter(t => t.pnl > 0).length;
  const total = trades.length;
  document.getElementById('winRate').textContent = total ? (wins/total*100).toFixed(1)+'%' : '--';
  document.getElementById('openPnl').textContent = (dailyPnL >= 0 ? '+':'') + '$' + dailyPnL.toFixed(2);

  if (total >= 10) {
    const avgWin = trades.filter(t=>t.pnl>0).reduce((s,t)=>s+t.pnl,0) / (wins||1);
    const avgLoss = Math.abs(trades.filter(t=>t.pnl<0).reduce((s,t)=>s+t.pnl,0) / ((total-wins)||1));
    const wr = wins/total;
    const kelly = avgLoss > 0 ? (wr - (1-wr)/(avgWin/avgLoss)) : 0;
    kellyFraction = Math.max(0.05, Math.min(0.20, kelly * 0.10));
    document.getElementById('kellyPct').textContent = (kellyFraction*100).toFixed(1)+'%';
  } else {
    document.getElementById('kellyPct').textContent = 'veri yok';
  }

  const atrVal = indicators.atr || 50;
  const riskAmount = balance * kellyFraction * 0.1;
  const size = riskAmount / (atrVal * 1.5);
  document.getElementById('posSize').textContent = '$' + Math.min(size * currentPrice(), balance*0.5).toFixed(0);

  document.getElementById('btnLong').disabled = !connected;
  document.getElementById('btnShort').disabled = !connected;
}

function currentPrice() {
  if (WORKER === 'demo') return DEMO[currentPair] || 100;
  return indicators.last || 100;
}

function addLog(msg) {
  const box = document.getElementById('tradeLog');
  const time = new Date().toLocaleTimeString();
  box.innerHTML += `<div style="font-size:10px;margin:2px 0;">${time} ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

// ═══════════════════════ TICKER ═══════════════════
function updateTicker() {
  const pairs = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT'];
  let html = '';
  pairs.forEach(sym => {
    const p = DEMO[sym] || 0;
    html += `<span>${sym.replace('USDT','')} $${p.toFixed(2)}</span>`;
  });
  document.getElementById('ticker').innerHTML = html;
}

// ═══════════════════════ DEMO DATA ═════════════════
function generateKlines(sym, count=100) {
  let base = DEMO[sym] || 100;
  const k = [];
  for (let i=0; i<count; i++) {
    const open = base * (1 + (Math.random()-0.5)*0.006);
    const close = open * (1 + (Math.random()-0.5)*0.008);
    const high = Math.max(open,close) * (1 + Math.random()*0.004);
    const low = Math.min(open,close) * (1 - Math.random()*0.004);
    const vol = Math.random()*3000+500;
    k.push({time:Date.now()-(count-i)*60000, open, high, low, close, volume:vol});
    base = close;
  }
  DEMO[sym] = base;
  return k;
}

// ═══════════════════════ İNDİKATÖRLER ═════════════
function ema(data, period) {
  const k = 2/(period+1);
  let ema = [data[0]];
  for (let i=1; i<data.length; i++) ema.push(data[i]*k + ema[i-1]*(1-k));
  return ema;
}
function rsi(closes, period=14) {
  if (closes.length < period+1) return 50;
  let gains=0, losses=0;
  for (let i=1; i<=period; i++) {
    const diff = closes[i] - closes[i-1];
    if (diff>0) gains += diff; else losses -= diff;
  }
  let avgGain = gains/period, avgLoss = losses/period;
  for (let i=period+1; i<closes.length; i++) {
    const diff = closes[i] - closes[i-1];
    avgGain = (avgGain*13 + (diff>0?diff:0)) / 14;
    avgLoss = (avgLoss*13 + (diff<0?-diff:0)) / 14;
  }
  if (avgLoss === 0) return 100;
  return 100 - (100/(1+avgGain/avgLoss));
}
function atr(klines, period=14) {
  let tr = [];
  for (let i=1; i<klines.length; i++) {
    const h = klines[i].high, l = klines[i].low, pc = klines[i-1].close;
    tr.push(Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc)));
  }
  return tr.slice(-period).reduce((a,b)=>a+b,0)/period;
}
function adx(klines, period=14) {
  const highs = klines.map(k=>k.high), lows = klines.map(k=>k.low), closes = klines.map(k=>k.close);
  let tr = [], plusDM = [], minusDM = [];
  for (let i=1; i<klines.length; i++) {
    const h = highs[i], l = lows[i], ph = highs[i-1], pl = lows[i-1];
    tr.push(Math.max(h-l, Math.abs(h-closes[i-1]), Math.abs(l-closes[i-1])));
    const up = h - ph, down = pl - l;
    plusDM.push(up>down && up>0 ? up : 0);
    minusDM.push(down>up && down>0 ? down : 0);
  }
  const atrVal = tr.slice(-period).reduce((a,b)=>a+b,0)/period;
  const plusDI = plusDM.slice(-period).reduce((a,b)=>a+b,0)/period / atrVal * 100;
  const minusDI = minusDM.slice(-period).reduce((a,b)=>a+b,0)/period / atrVal * 100;
  const dx = Math.abs(plusDI - minusDI) / (plusDI + minusDI) * 100;
  return {adx: dx, plusDI, minusDI};
}
function volumeProfile(klines) {
  const poc = klines.reduce((max, k) => k.volume > (max.volume||0) ? k : max, klines[0]);
  return poc.close;
}

function computeIndicators(klines) {
  const closes = klines.map(k=>k.close);
  const r = rsi(closes);
  const atrVal = atr(klines);
  const adxVal = adx(klines);
  const ema9 = ema(closes, 9);
  const ema21 = ema(closes, 21);
  const macdLine = ema(closes, 12).map((v,i)=> v - (ema(closes,26)[i]||0));
  const signalLine = ema(macdLine.filter(v=>!isNaN(v)), 9);
  const macd = macdLine[macdLine.length-1] - (signalLine[signalLine.length-1]||0);
  const poc = volumeProfile(klines);
  const last = closes[closes.length-1];
  return {
    rsi: r, atr: atrVal, adx: adxVal.adx, plusDI: adxVal.plusDI, minusDI: adxVal.minusDI,
    ema9: ema9[ema9.length-1], ema21: ema21[ema21.length-1], macd, poc, last,
    volumeRatio: klines.slice(-5).reduce((s,k)=>s+k.volume,0) / klines.slice(-20).reduce((s,k)=>s+k.volume,0) * 4
  };
}

// ═══════════════════════ SİNYAL MOTORU ═════════════
function generateSignal(ind, strategy='trend') {
  let bull=0, bear=0, reasons=[];
  const {rsi, ema9, ema21, macd, adx, plusDI, minusDI, poc, last, volumeRatio} = ind;
  
  if (adx < 20) {
    if (strategy === 'mean' || strategy === 'trend') {
      if (rsi < 35 && last < poc) { bull += 2; reasons.push('RSI OS + POC altı'); }
      if (rsi > 65 && last > poc) { bear += 2; reasons.push('RSI OB + POC üstü'); }
    }
  } else {
    if (plusDI > minusDI && ema9 > ema21) { bull += 3; reasons.push('Trend yukarı'); }
    if (minusDI > plusDI && ema9 < ema21) { bear += 3; reasons.push('Trend aşağı'); }
  }
  if (macd > 0) bull += 1; else if (macd < 0) bear += 1;
  if (volumeRatio > 1.5) { if (bull>bear) bull+=1; else bear+=1; reasons.push('Vol spike'); }
  if (strategy === 'breakout') {
    const high20 = Math.max(...klines.slice(-20).map(k=>k.high));
    const low20 = Math.min(...klines.slice(-20).map(k=>k.low));
    if (last > high20) { bull += 2; reasons.push('Breakout yukarı'); }
    if (last < low20) { bear += 2; reasons.push('Breakout aşağı'); }
  }
  const total = Math.max(1, bull + bear);
  const conf = Math.round(Math.max(bull, bear) / total * 100);
  let signal = 'WAIT';
  if (bull > bear && bull >= 3) signal = 'LONG';
  else if (bear > bull && bear >= 3) signal = 'SHORT';
  return { signal, conf, reasons: reasons.join(', ') };
}

// ═══════════════════════ RİSK YÖNETİMİ ═══════════
function calculatePositionSize(sig, ind) {
  const riskModel = document.getElementById('riskModel').value;
  const atrVal = ind.atr || 50;
  let riskAmount = balance * 0.02;
  if (riskModel === 'kelly') riskAmount = balance * kellyFraction * 0.1;
  else if (riskModel === 'atr') riskAmount = balance * 0.01;
  const slDistance = atrVal * 1.5;
  const qty = riskAmount / slDistance;
  const positionValue = qty * ind.last;
  return Math.min(positionValue, balance * 0.4);
}

function isTradingAllowed() {
  const filter = document.getElementById('timeFilter').value;
  if (!filter) return true;
  const [start, end] = filter.split('-');
  const now = new Date();
  const utcHour = now.getUTCHours();
  const startH = parseInt(start.split(':')[0]);
  const endH = parseInt(end.split(':')[0]);
  if (startH < endH) return utcHour < startH || utcHour >= endH;
  return utcHour >= endH && utcHour < startH;
}

function hasCorrelatedPosition(pair) {
  const correlated = { BTCUSDT: ['ETHUSDT'], ETHUSDT: ['BTCUSDT'] };
  return positions.some(p => correlated[pair]?.includes(p.pair) && p.side === positions.find(x=>x.pair===pair)?.side);
}

// ═══════════════════════ EMİR İCRASI ═════════════
function openPosition(side, pair, price, size, ind) {
  if (positions.length >= MAX_POS) return addLog('⛔ Max pozisyon');
  if (!isTradingAllowed()) return addLog('⏰ Zaman filtresi aktif');
  if (hasCorrelatedPosition(pair)) return addLog('🔗 Korelasyon engeli');
  
  const lev = 2;
  const posValue = Math.min(size, balance * 0.4);
  const qty = posValue / price * lev;
  const sl = side === 'LONG' ? price - ind.atr * 1.5 : price + ind.atr * 1.5;
  const tp = side === 'LONG' ? price + ind.atr * 2.5 : price - ind.atr * 2.5;
  
  positions.push({
    id: posId++, pair, side, entry: price, qty, lev, sl, tp,
    posValue, comm: posValue * COMM
  });
  dailyPnL -= posValue * COMM;
  balance -= posValue * COMM;
  addLog(`✅ ${side} ${pair} @${price.toFixed(2)} SL:${sl.toFixed(2)} TP:${tp.toFixed(2)} Size:$${posValue.toFixed(0)}`);
}

function manualTrade(side) {
  if (!connected) return addLog('⛔ Bağlantı yok');
  const ind = indicators;
  if (!ind || !ind.last) return addLog('⛔ Veri bekleniyor');
  const size = calculatePositionSize({signal:side}, ind);
  openPosition(side, currentPair, ind.last, size, ind);
}

function checkPositions() {
  positions.forEach(p => {
    const price = DEMO[p.pair] || indicators.last;
    if (!price) return;
    const multiplier = p.side === 'LONG' ? 1 : -1;
    const pnl = (price - p.entry) * multiplier * p.qty - p.comm;
    if (pnl > 0 && price >= p.tp) closePosition(p, 'TP');
    else if (pnl < 0 && price <= p.sl) closePosition(p, 'SL');
  });
}

function closePosition(pos, reason) {
  const price = DEMO[pos.pair] || indicators.last;
  const multiplier = pos.side === 'LONG' ? 1 : -1;
  const pnl = (price - pos.entry) * multiplier * pos.qty - pos.comm;
  balance += pnl + pos.posValue;
  dailyPnL += pnl;
  trades.push({ pair: pos.pair, side: pos.side, pnl, reason });
  positions = positions.filter(p => p.id !== pos.id);
  addLog(`${reason === 'TP' ? '🟢' : '🔴'} ${pos.pair} ${pos.side} kapatıldı PnL:$${pnl.toFixed(2)} Bakiye:$${balance.toFixed(2)}`);
  if (balance > peakBalance) peakBalance = balance;
}

// ═══════════════════════ BACKTEST ═════════════════
function runBacktest() {
  const k = generateKlines(currentPair, 200);
  let simBalance = balance;
  let simPos = null;
  let wins = 0, total = 0;
  for (let i=50; i<k.length; i++) {
    const slice = k.slice(0, i+1);
    const ind = computeIndicators(slice);
    const sig = generateSignal(ind, document.getElementById('strategy').value);
    if (simPos) {
      const price = slice[slice.length-1].close;
      const mult = simPos.side === 'LONG' ? 1 : -1;
      const pnl = (price - simPos.entry) * mult * simPos.qty;
      if (pnl > 0 && price >= simPos.tp) {
        simBalance += pnl; wins++; total++; simPos = null;
      } else if (pnl < 0 && price <= simPos.sl) {
        simBalance += pnl; total++; simPos = null;
      }
    } else if (sig.signal !== 'WAIT') {
      const size = simBalance * 0.02;
      const qty = size / slice[slice.length-1].close * 2;
      simPos = {
        side: sig.signal, entry: slice[slice.length-1].close, qty,
        tp: sig.signal==='LONG'? slice[slice.length-1].close*1.01 : slice[slice.length-1].close*0.99,
        sl: sig.signal==='LONG'? slice[slice.length-1].close*0.995 : slice[slice.length-1].close*1.005
      };
    }
  }
  const result = `Backtest: ${total} işlem, Win:${wins}, %${(wins/total*100).toFixed(1)}, PnL:$${(simBalance-balance).toFixed(2)}`;
  addLog(result);
  alert(result);
}

// ═══════════════════════ CHART ═══════════════════
let chartCtx;
function initChart() { chartCtx = document.getElementById('chart').getContext('2d'); }
function drawChart() {
  if (!chartCtx || !klines.length) return;
  const w = chartCtx.canvas.width = chartCtx.canvas.offsetWidth;
  const h = chartCtx.canvas.height = 180;
  const ctx = chartCtx;
  ctx.clearRect(0,0,w,h);
  const closes = klines.map(k=>k.close);
  const min = Math.min(...closes)*0.999, max = Math.max(...closes)*1.001;
  const range = max - min;
  const pad = {l:20, r:10, t:10, b:20};
  const xScale = (w-pad.l-pad.r) / (closes.length-1);
  const yScale = (h-pad.t-pad.b) / range;
  ctx.beginPath();
  ctx.strokeStyle = '#00e0a0';
  ctx.lineWidth = 2;
  closes.forEach((c,i) => {
    const x = pad.l + i*xScale, y = pad.t + (max-c)*yScale;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
}

// ═══════════════════════ BAĞLANTI ═══════════════
function connect() {
  const url = document.getElementById('workerUrl').value.trim();
  if (!url || url === 'demo') {
    WORKER = 'demo'; connected = true;
    balance = parseFloat(document.getElementById('capital').value) || 50;
    startBalance = balance; peakBalance = balance;
    document.getElementById('connBadge').textContent = 'DEMO';
    document.getElementById('connBadge').className = 'badge demo';
    document.getElementById('modeBadge').textContent = 'SIM';
    document.getElementById('modeBadge').className = 'badge demo';
    addLog('🧪 Demo mod aktif (otomatik)');
    return;
  }
  fetch(url + '/ping')
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        WORKER = url; connected = true;
        document.getElementById('connBadge').textContent = 'LIVE';
        document.getElementById('connBadge').className = 'badge live';
        document.getElementById('modeBadge').textContent = 'LIVE';
        document.getElementById('modeBadge').className = 'badge live';
        addLog('✅ Canlı bağlantı kuruldu');
      }
    }).catch(() => addLog('❌ Bağlantı hatası'));
}

// ═══════════════════════ ANA DÖNGÜ ═══════════════
function mainLoop() {
  if (!connected) return setTimeout(mainLoop, 1000);
  
  // Demo veri üret
  klines = generateKlines(currentPair, 100);
  indicators = computeIndicators(klines);
  const sig = generateSignal(indicators, document.getElementById('strategy').value);
  signal = sig.signal;
  
  // UI güncelle
  document.getElementById('sigMain').textContent = sig.signal;
  document.getElementById('sigMain').className = 'signal-badge ' + sig.signal;
  document.getElementById('pairTitle').textContent = currentPair + ' · 15m';
  document.getElementById('indRsi').textContent = indicators.rsi.toFixed(1);
  document.getElementById('indMacd').textContent = indicators.macd.toFixed(4);
  document.getElementById('indAtr').textContent = indicators.atr.toFixed(2);
  document.getElementById('indAdx').textContent = indicators.adx.toFixed(1) + (indicators.adx>25?' Trend':' Sideways');
  document.getElementById('indVol').textContent = indicators.volumeRatio.toFixed(2);
  document.getElementById('indPoc').textContent = indicators.poc.toFixed(2);
  updateTicker();
  drawChart();
  
  // Motor aktifse otomatik işlem
  if (engineRunning && sig.signal !== 'WAIT') {
    const size = calculatePositionSize(sig, indicators);
    openPosition(sig.signal, currentPair, indicators.last, size, indicators);
  }
  
  checkPositions();
  updateUI();
  setTimeout(mainLoop, 8000);
}

function toggleEngine() {
  engineRunning = !engineRunning;
  document.getElementById('btnStartEngine').textContent = engineRunning ? 'Motoru Durdur' : 'Motoru Başlat';
  addLog(engineRunning ? '🚀 Pro motor çalıştı' : '⏸️ Motor durdu');
}

// ═══════════════════════ BAŞLANGIÇ ═══════════════
window.onload = () => {
  initChart();
  document.getElementById('capital').value = balance;
  // Otomatik demo başlat
  WORKER = 'demo'; connected = true;
  document.getElementById('connBadge').textContent = 'DEMO';
  document.getElementById('connBadge').className = 'badge demo';
  document.getElementById('modeBadge').textContent = 'SIM';
  document.getElementById('modeBadge').className = 'badge demo';
  addLog('🧪 Demo mod otomatik başlatıldı');
  mainLoop();
};
