<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS</title>

<style>
body{margin:0;background:#0b0f17;color:#e8eef7;font-family:-apple-system;padding:16px}
h1{text-align:center}
.card{background:#121724;border:1px solid #1f2a40;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.badge{padding:4px 10px;border-radius:10px;font-size:12px}
.RUNNING{background:#0f5132;color:#5cffb0}
.STOPPED{background:#5c1d24;color:#ff7a8a}
.signal{font-size:32px;text-align:center;margin:10px 0}
.LONG{color:#00ff88}.SHORT{color:#ff4466}.WAIT{color:#888}
button{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;margin-top:8px}
.start{background:#00e676}.stop{background:#ff4466;color:#fff}
</style>
</head>

<body>

<h1>NEXUS</h1>

<div class="card">
  <div class="row"><span>STATE</span><span id="state" class="badge STOPPED">STOPPED</span></div>
  <div class="row"><span>MODE</span><span id="mode">PAPER</span></div>
</div>

<div class="card">
  <div id="sig" class="signal WAIT">WAIT</div>
  <div class="row"><span>Confidence</span><span id="conf">—</span></div>
  <div id="reason" style="font-size:12px;color:#8fa0b8;text-align:center"></div>
</div>

<div class="card">
  <div class="row"><span>RSI</span><span id="iRsi">—</span></div>
  <div class="row"><span>EMA9</span><span id="iEma9">—</span></div>
  <div class="row"><span>EMA21</span><span id="iEma21">—</span></div>
  <div class="row"><span>MACD</span><span id="iMacd">—</span></div>
  <div class="row"><span>VOL</span><span id="iVol">—</span></div>
</div>

<button class="start" onclick="start()">START</button>
<button class="stop" onclick="stop()">STOP</button>

<script>
const BACKEND="https://nexus-agent-backend.tarkanol.workers.dev";
let timer=null;

async function start(){
  await fetch(BACKEND+"/agent/auto",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({on:true})});
  state.textContent="RUNNING";state.className="badge RUNNING";
  timer=setInterval(()=>fetch(BACKEND+"/agent/tick",{method:"POST"}),15000);
}

async function stop(){
  clearInterval(timer);
  await fetch(BACKEND+"/agent/stop",{method:"POST"});
  state.textContent="STOPPED";state.className="badge STOPPED";
}

async function refresh(){
  const r=await fetch(BACKEND+"/status");
  const d=await r.json();
  mode.textContent=d.mode;
  if(d.signal){
    sig.textContent=d.signal.name;
    sig.className="signal "+d.signal.name;
    conf.textContent=d.signal.confidence+"%";
    reason.textContent=d.signal.reasons.join(" · ");
    iRsi.textContent=d.signal.indicators.rsi;
    iEma9.textContent=d.signal.indicators.ema9;
    iEma21.textContent=d.signal.indicators.ema21;
    iMacd.textContent=d.signal.indicators.macd;
    iVol.textContent=d.signal.indicators.vol;
  }
}
setInterval(refresh,4000);
</script>

</body>
</html>
