<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<title>APEX Pro V3.7.2 – Scalpel</title>
<style>
/* ... CSS aynı, önceki V3.7.1'deki CSS'in tamamı buraya ... */
</style>
</head>
<body>
<!-- ... HTML aynı, sadece motor sayfasında Sinyal Seçimi dropdown'ı daha üstte ... -->

<!-- MOTOR SAYFASI (Sinyal Seçimi en üstte) -->
<div class="page" id="pg-engine">
  <div class="scroll">
    <!-- ... diğer kartlar aynı, Sinyal Seçimi dropdown'ını hemen OTONOM PRO kartının başına koydum -->
    <div class="card">
      <div style="font-size:9px;color:var(--gold);letter-spacing:1px;margin-bottom:8px">🤖 OTONOM PRO</div>
      
      <!-- Sinyal Seçimi EN ÜSTTE -->
      <div class="fr"><label>Sinyal Seçimi</label>
        <select id="signalSelection" style="font-size:13px; font-weight:bold; background:var(--panel);">
          <option value="first">İlk gelen sinyali aç</option>
          <option value="best" selected>En yüksek güvenli sinyali aç</option>
        </select>
      </div>
      
      <div class="tog-row">
        <div class="tog off" id="togAutoTrade" onclick="toggleAutoTrade()"></div>
        <div class="tog-b"><div class="tog-l">Otomatik İşlem</div><div class="tog-d" id="autoTradeDesc">Kapalı</div></div>
      </div>
      <!-- diğer toggle'lar aynı ... -->
    </div>
    <!-- ... -->
  </div>
</div>

<script>
// ═══════════════════════════════════
// KONFİGÜRASYON (AYNI)
// ... tüm değişkenler aynı ...

// ═══════════════════════════════════
// SİNYAL ANALİZİ (DÜZELTİLMİŞ)
function analyzeChallenge(sym){
  if(isInCooldown(sym)) return null;
  var pd = pData[sym];
  if(!pd) return null;
  var k5 = pd.kl5m || [], k15 = pd.kl15m || [], k1 = pd.kl1h || [], k4 = pd.kl4h || [];
  if(k5.length < 20 || k15.length < 20 || k1.length < 20) {
    // Eğer yeterli veri yoksa null dön ki sinyal üretilmesin
    return null;
  }
  var price = pd.price || k5[k5.length-1].c;

  // Hacim onayı (opsiyonel)
  if(volumeConfirmActive && k15.length >= 20){
    var vols = k15.slice(-20).map(function(k){return k.v;});
    var avg = vols.slice(0,-1).reduce(function(a,b){return a+b;},0)/19;
    if(vols[19] < avg * 1.2) return null;
  }

  // Scalp trend skoru
  var c5 = k5.map(function(k){return k.c;}), c15 = k15.map(function(k){return k.c;}), c1 = k1.map(function(k){return k.c;});
  var e9_5=ema(c5,9), e21_5=ema(c5,21), e9_15=ema(c15,9), e21_15=ema(c15,21), e50_15=ema(c15,50), e9_1=ema(c1,9), e21_1=ema(c1,21), e50_1=ema(c1,50);
  var l9_5=e9_5[e9_5.length-1], l21_5=e21_5[e21_5.length-1], l9_15=e9_15[e9_15.length-1], l21_15=e21_15[e21_15.length-1], l50_15=e50_15[e50_15.length-1], l9_1=e9_1[e9_1.length-1], l21_1=e21_1[e21_1.length-1], l50_1=e50_1[e50_1.length-1];

  var sBull = 0, sBear = 0;
  if(l9_5 > l21_5) sBull += 3; else sBear += 3;
  if(l9_15 > l21_15 && l21_15 > l50_15) sBull += 4; else if(l9_15 < l21_15 && l21_15 < l50_15) sBear += 4; else if(l9_15 > l21_15) sBull++; else sBear++;
  if(l9_1 > l21_1 && l21_1 > l50_1) sBull += 5; else if(l9_1 < l21_1 && l21_1 < l50_1) sBear += 5; else if(l9_1 > l21_1) sBull += 2; else sBear += 2;
  var rs = rsi(c15, 14);
  if(rs > 55 && rs < 70) sBull += 3; else if(rs < 45 && rs > 30) sBear += 3;
  var adx = adxCalc(k15, 14);
  if(adx.adx > 20) { if(adx.pDI > adx.mDI) sBull += 4; else sBear += 4; }

  // 4h filtre (sadece yön uyumu)
  var c4 = k4.map(function(k){return k.c;}), e50_4 = ema(c4, 50), l50_4 = e50_4[e50_4.length-1];
  var htf = 'NEUTRAL';
  if(price > l50_4 * 1.005) htf = 'LONG';
  else if(price < l50_4 * 0.995) htf = 'SHORT';

  var sig = 'WAIT', conf = 0;
  if(sBull > sBear && sBull >= 12) { sig = 'LONG'; conf = Math.round(sBull/(sBull+sBear)*100); }
  else if(sBear > sBull && sBear >= 12) { sig = 'SHORT'; conf = Math.round(sBear/(sBull+sBear)*100); }
  if(sig === 'WAIT') return null;

  // 4h trende ters düşme kontrolü
  if(htf !== 'NEUTRAL' && sig !== htf) {
    addLog('🚫 4h blok: '+sym.replace('USDT','')+' sinyal '+sig+' ama 4h '+htf, 'info');
    return null;
  }

  // Çakışma koruması (opsiyonel)
  if(conflictActive){
    var opp = (sig === 'LONG') ? sBear : sBull;
    if(opp > ((sig === 'LONG') ? sBull : sBear) * 0.8) return null;
  }

  // TP/SL hesapla
  var tpsl = calcTPSL(sig, price);
  if(!tpsl || !tpsl.sl || !tpsl.tp) return null;

  // Minimum güven eşiği kontrolü (engine'de de var ama burada da olsun)
  if(conf < minConfidence) return null;

  return {
    signal: sig,
    conf: conf,
    price: price,
    sl: tpsl.sl,
    tp: tpsl.tp,
    rrRatio: userRR,
    indicators: {rsi:rs, macdHist:macd(c15).hist, adx:adx.adx, ema50above:price>l50_1},
    mtf: {'5m':l9_5>l21_5?'LONG':'SHORT', '15m':l9_15>l21_15?'LONG':'SHORT', '1h':l9_1>l21_1?'LONG':'SHORT', '4h':htf}
  };
}

// ═══════════════════════════════════
// ENGINE (DÜZELTİLDİ - Sinyal seçimi değişikliğini anında algılar)
async function runEngine(){
  if(!engineOn) return;
  if(!isTradingHours()) return;

  // Sinyal seçimi dropdown'ından anlık oku
  var selEl = document.getElementById('signalSelection');
  if(selEl) signalSelection = selEl.value;

  var signals = [];
  for(var i=0; i<customPairs.length; i++){
    var sym = customPairs[i];
    if(isInCooldown(sym)) continue;
    var an = pData[sym] ? pData[sym].analysis : null;
    if(!an || an.signal === 'WAIT' || an.conf < minConfidence) continue;
    signals.push({sym:sym, an:an, conf:an.conf});
  }
  if(!signals.length) {
    document.getElementById('eSig').textContent = 'Sinyal yok';
    return;
  }
  if(signalSelection === 'best') signals.sort(function(a,b){ return b.conf - a.conf; });
  var sel = signals[0];
  if(autoTrade){
    var canOpen = positions.length < getMaxPositions() && (!challengeRulesActive || (dailyTradeCount < getMaxDailyTrades() && dailyLossAmt < getMaxDailyLoss()));
    if(canOpen && !positions.some(function(p){return p.pair === sel.sym;})){
      await openPos(sel.sym, sel.an.signal, true);
    }
  }
  document.getElementById('eSig').textContent = sel.sym.replace('USDT','') + ':' + sel.an.signal + '(' + sel.conf + '%)';
  document.getElementById('eOpened').textContent = positions.length;
}

// ═══════════════════════════════════
// BAŞLATMA (Sinyal seçimi event'i)
window.addEventListener('DOMContentLoaded', function(){
  sw('signal'); initChart(); startDemo();
  renderPairManager(); renderPopularCoins();
  setScalpPreset(0.12);
  addLog('APEX V3.7.2 – Sinyal seçimi düzeltildi, motor aktif', 'info');

  // Sinyal seçimi dropdown'ına event bağla (yedek)
  var selEl = document.getElementById('signalSelection');
  if(selEl){
    selEl.addEventListener('change', function(){
      signalSelection = this.value;
      addLog('Sinyal seçimi: ' + (this.value === 'best' ? 'En yüksek güvenli' : 'İlk gelen'), 'info');
    });
  }
});
</script>
</body>
</html>
