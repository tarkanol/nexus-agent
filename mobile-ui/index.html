<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NEXUS</title>
<style>
body{background:#05070a;color:#e0eaf5;font-family:-apple-system;padding:20px}
button{width:100%;padding:18px;border-radius:14px;font-size:18px;margin:10px 0}
.start{background:#00ff88;border:none}
.stop{background:#ff3355;border:none;color:#fff}
.status{margin:20px 0;font-size:20px;text-align:center}
</style>
</head>
<body>

<h2 style="text-align:center">NEXUS AGENT</h2>
<div id="status" class="status">STOPPED</div>

<button class="start" onclick="start()">START AUTO</button>
<button class="stop" onclick="stop()">STOP AUTO</button>

<script>
const BACKEND = "https://nexus-agent-backend.tarkanol.workers.dev/";
let timer = null;

function start(){
  document.getElementById("status").innerText="RUNNING";
  fetch(`${BACKEND}/agent/auto`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ on:true })
  });

  timer = setInterval(()=>{
    fetch(`${BACKEND}/agent/tick`,{ method:"POST" });
  }, 15000);
}
function stop(){
  document.getElementById("status").innerText="STOPPED";
  fetch(`${BACKEND}/agent/stop`,{ method:"POST" });
  clearInterval(timer);
}

</script>

</body>
</html>
