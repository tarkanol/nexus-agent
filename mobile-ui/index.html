<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXUS</title>

<style>
body{
  margin:0;
  background:#0b0f17;
  color:#e8eef7;
  padding:18px;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
}

h1{
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  font-size:13px;
  color:#8fa0b8;
  margin-bottom:12px;
}

.card{
  background:#121724;
  border:1px solid #1f2a40;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin:6px 0;
}

.badge{
  padding:4px 10px;
  border-radius:10px;
  font-size:12px;
}

.RUNNING{background:#0f5132;color:#5cffb0;}
.STOPPED{background:#5c1d24;color:#ff7a8a;}

.signal{
  text-align:center;
  font-size:32px;
  margin:10px 0;
}

.LONG{color:#00ff88;}
.SHORT{color:#ff4466;}
.WAIT{color:#8899aa;}

button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:16px;
  font-weight:600;
  margin-top:8px;
}

.start{background:#00e676;color:#000;}
.stop{background:#ff4466;color:#fff;}

.log{
  font-size:12px;
  color:#9fb0c8;
  border-bottom:1px solid #1f2a40;
  padding:4px 0;
}
</style>
</head>

<body>

<h1>NEXUS</h1>
<div class="sub">Agent Control Panel</div>

<div class="card">
  <div class="row">
    <span>STATE</span>
    <span id="state" class="badge STOPPED">STOPPED</span>
  </div>
  <div class="row">
    <span>MODE</span>
    <span id="mode">PAPER</span>
  </div>
</div>

<div class="card">
  <div id="signal" class="signal WAIT">WAIT</div>
  <div class="row"><span>Confidence</span><span id="confidence">—</span></div>
  <div id="reason" style="font-size:12px;color:#8fa0b8;text-align:center;"></div>
</div>

<div class="card">
  <div class="row"><span>RSI</span><span id="iRsi">—</span></div>
  <div class="row"><span>EMA9</span><span id="iEma9">—</span></div>
  <div class="row"><span>EMA21</span><span id="iEma21">—</span></div>
  <div class="row"><span>MACD</span><span id="iMacd">—</span></div>
  <div class="row"><span>VOL</span><span id="iVol">—</span></div>
</div>

<button class="start" onclick="startAgent()">START</button>
<button class="stop" onclick="stopAgent()">STOP</button>

<div class="card">
  <strong>Trade Logs</strong>
  <div id="logs"></div>
</div>

<script>
const BACKEND_URL = "https://SENIN-WORKER.workers.dev";
let tickTimer = null;

async function startAgent(){
  await fetch(BACKEND_URL + "/agent/auto",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ on:true })
  });

  state.textContent="RUNNING";
  state.className="badge RUNNING";

  tickTimer=setInterval(()=>{
    fetch(BACKEND_URL+"/agent/tick",{method:"POST"});
  },15000);
}

async function stopAgent(){
  clearInterval(tickTimer);
  await fetch(BACKEND_URL+"/agent/stop",{method:"POST"});
  state.textContent="STOPPED";
  state.className="badge STOPPED";
}

async function refresh(){
  const r = await fetch(BACKEND_URL + "/status");
  const d = await r.json();

  mode.textContent = d.mode;

  if (d.signal){
    signal.textContent = d.signal.name;
    signal.className = "signal " + d.signal.name;
    confidence.textContent = d.signal.confidence + "%";
    reason.textContent = d.signal.reasons.join(" · ");

    iRsi.textContent = d.signal.indicators.rsi;
    iEma9.textContent = d.signal.indicators.ema9;
    iEma21.textContent = d.signal.indicators.ema21;
    iMacd.textContent = d.signal.indicators.macd;
    iVol.textContent = d.signal.indicators.vol;
  }

  logs.innerHTML = (d.logs || []).map(l => `<div class="log">${l}</div>`).join("");
}

setInterval(refresh,4000);
</script>

</body>
</html>
``
