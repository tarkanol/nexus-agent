<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APEX PRO v12 · Geri Sayım + Piyasa</title>
  <style>
    :root {
      --bg: #030711; --panel: #060f1e; --border: #131f38;
      --acc: #00e0a0; --long: #00e676; --short: #ff3d5c;
      --warn: #f5a623; --text: #c0cde0; --dim: #5a6a80; --deep: #2a3348;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
    header { background:var(--panel); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .logo { font-weight:700; font-size:20px; color:var(--acc); }
    .badge { font-size:10px; padding:3px 8px; border-radius:3px; background:var(--deep); color:var(--dim); margin-left:6px; }
    .badge.live { background:#0a2f1a; color:var(--long); }
    .badge.demo { background:#2a2000; color:var(--warn); }
    .ticker { background:#0a101a; border-bottom:1px solid var(--border); padding:5px 16px; display:flex; gap:18px; overflow:hidden; font-family:'JetBrains Mono',monospace; font-size:11px; white-space:nowrap; }
    main { flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:800px) { main { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px; }
    .card h3 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:10px; }
    .flex-row { display:flex; gap:6px; flex-wrap:wrap; }
    .btn { border:none; border-radius:5px; padding:9px 14px; font-weight:600; cursor:pointer; font-size:12px; }
    .btn:disabled { opacity:0.35; }
    .btn-long { background:var(--long); color:#000; }
    .btn-short { background:var(--short); color:#fff; }
    .btn-acc { background:var(--acc); color:#000; }
    .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
    .btn-warn { background:var(--warn); color:#000; }
    .metric { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:600; }
    .metric-label { font-size:9px; color:var(--dim); margin-top:1px; }
    .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    input, select { background:var(--deep); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:4px; width:100%; font-family:'JetBrains Mono',monospace; font-size:12px; }
    .log-box { background:#000; color:#5a7a6a; font-family:'JetBrains Mono',monospace; font-size:10px; height:250px; overflow-y:auto; padding:8px; border-radius:4px; margin-top:8px; line-height:1.6; }
    .signal-badge { font-size:24px; font-weight:700; padding:6px 16px; border-radius:6px; display:inline-block; }
    .LONG { background:rgba(0,230,118,0.12); color:var(--long); }
    .SHORT { background:rgba(255,61,92,0.12); color:var(--short); }
    .WAIT { background:var(--deep); color:var(--dim); }
    canvas { width:100%; border-radius:4px; background:rgba(0,0,0,.3); }
    .tab-bar { display:flex; gap:0; margin-bottom:10px; }
    .tab { padding:7px 14px; background:var(--deep); border:none; color:var(--dim); cursor:pointer; font-size:11px; }
    .tab.active { background:var(--panel); color:var(--acc); border-bottom:2px solid var(--acc); }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .pair-select { display:flex; gap:4px; margin-bottom:8px; }
    .pair-btn { padding:4px 10px; border:1px solid var(--border); background:transparent; color:var(--dim); border-radius:3px; cursor:pointer; font-size:11px; }
    .pair-btn.active { border-color:var(--acc); color:var(--acc); }
    .notification { padding:10px; border-radius:6px; margin:8px 0; font-weight:600; text-align:center; display:none; }
    .notification.show { display:block; }
    .notification.success { background:rgba(0,230,118,0.15); border:1px solid var(--long); color:var(--long); }
    .notification.error { background:rgba(255,61,92,0.15); border:1px solid var(--short); color:var(--short); }
    .notification.info { background:rgba(255,184,48,0.15); border:1px solid var(--warn); color:var(--warn); }
    .tp-sl-panel { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:8px; margin-top:8px; font-size:9px; }
    .toggle-row { display:flex; align-items:center; gap:8px; margin:8px 0; }
    .toggle { width:40px; height:20px; background:var(--deep); border-radius:10px; cursor:pointer; position:relative; transition:background .2s; }
    .toggle.on { background:var(--acc); }
    .toggle::after { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .2s; }
    .toggle.on::after { left:22px; }
    .countdown { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; color:var(--acc); text-align:center; padding:8px; background:var(--bg); border-radius:6px; margin-top:8px; }
    .countdown.paused { color:var(--dim); }
    .best-signal { font-size:10px; color:var(--warn); margin-top:4px; min-height:16px; }
  </style>
</head>
<body>
<header>
  <div class="logo">APEX PRO</div>
  <div style="display:flex;">
    <span class="badge demo" id="connBadge">DEMO</span>
    <span class="badge demo" id="modeBadge">SIM</span>
    <span class="badge" id="posBadge">0/3</span>
  </div>
</header>

<div id="notifArea" style="padding:0 12px;"></div>
<div class="ticker" id="ticker">⏳ Yükleniyor...</div>

<main>
  <div class="card" style="grid-column:1/-1;">
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('signal')">Sinyal</button>
      <button class="tab" onclick="switchTab('engine')">Motor</button>
      <button class="tab" onclick="switchTab('portfolio')">Portföy</button>
      <button class="tab" onclick="switchTab('settings')">Ayarlar</button>
    </div>

    <!-- SİNYAL SEKME -->
    <div id="signal" class="tab-content active">
      <div class="pair-select">
        <button class="pair-btn active" onclick="setPair('BTCUSDT')">BTC</button>
        <button class="pair-btn" onclick="setPair('ETHUSDT')">ETH</button>
        <button class="pair-btn" onclick="setPair('SOLUSDT')">SOL</button>
        <button class="pair-btn" onclick="setPair('BNBUSDT')">BNB</button>
        <button class="pair-btn" onclick="setPair('XRPUSDT')">XRP</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 id="pairTitle">BTCUSDT · 15m</h3>
        <div class="signal-badge WAIT" id="sigMain">WAIT</div>
      </div>
      <canvas id="chart" height="180"></canvas>
      <div class="grid-3" style="margin-top:10px;">
        <div><span class="metric-label">RSI</span><div class="metric" id="iRsi">--</div></div>
        <div><span class="metric-label">MACD</span><div class="metric" id="iMacd">--</div></div>
        <div><span class="metric-label">ATR</span><div class="metric" id="iAtr">--</div></div>
        <div><span class="metric-label">ADX</span><div class="metric" id="iAdx">--</div></div>
        <div><span class="metric-label">Vol</span><div class="metric" id="iVol">--</div></div>
        <div><span class="metric-label">POC</span><div class="metric" id="iPoc">--</div></div>
      </div>
      <div id="sigSuggestion" style="margin-top:8px;font-size:10px;color:var(--warn);min-height:18px;"></div>
      <div class="flex-row" style="margin-top:10px;">
        <button class="btn btn-long" id="btnLong" onclick="confirmTrade('LONG')">▲ LONG</button>
        <button class="btn btn-short" id="btnShort" onclick="confirmTrade('SHORT')">▼ SHORT</button>
        <button class="btn btn-outline" onclick="runBacktest()">Backtest</button>
      </div>
      <div id="backtestResult" style="margin-top:8px;font-size:10px;color:var(--text2);min-height:18px;"></div>
      <button class="btn btn-warn" id="btnBacktestTrade" style="display:none;margin-top:6px;width:100%;" onclick="confirmBacktestTrade()">📊 Backtest ile İşlem Aç</button>
    </div>

    <!-- MOTOR SEKME -->
    <div id="engine" class="tab-content">
      <h3>Pro Motor</h3>

      <!-- GERİ SAYIM SAYACI -->
      <div class="countdown" id="countdownDisplay">120</div>
      <div style="text-align:center;font-size:9px;color:var(--dim);margin-top:2px;" id="countdownLabel">saniye kaldı</div>

      <div class="grid-2" style="margin-top:10px;">
        <div><label>Strateji</label><select id="strategy"><option value="trend">Trend</option><option value="mean">Mean Rev</option><option value="breakout">Breakout</option></select></div>
        <div><label>Risk</label><select id="riskModel"><option value="kelly">Kelly</option><option value="fixed">Sabit %2</option><option value="atr">ATR</option></select></div>
        <div><label>Kaldıraç</label><select id="leverage"><option value="2">2x</option><option value="3">3x</option><option value="5">5x</option></select></div>
        <div><label>İşlem $</label><input id="tradeSize" value="15" type="number"></div>
      </div>

      <!-- TARAMA MODU -->
      <div class="grid-2" style="margin-top:8px;">
        <div>
          <label>Tarama Modu</label>
          <select id="scanMode" onchange="updateScanMode()">
            <option value="fixed">5 Coin (Sabit)</option>
            <option value="market">Piyasa (En İyi Sinyal)</option>
          </select>
        </div>
        <div>
          <label>Tarama Sıklığı</label>
          <select id="scanInterval" onchange="updateScanInterval()">
            <option value="15">15 saniye</option>
            <option value="30">30 saniye</option>
            <option value="60">1 dakika</option>
            <option value="120" selected>2 dakika</option>
            <option value="300">5 dakika</option>
            <option value="900">15 dakika</option>
          </select>
        </div>
      </div>

      <!-- EK COINLER (sadece piyasa modunda görünür) -->
      <div id="extraPairsRow" style="margin-top:8px;display:none;">
        <label style="font-size:9px;color:var(--dim);">Ek Coinler (virgülle ayırın)</label>
        <input id="extraPairs" value="DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT" placeholder="örn: DOGEUSDT,APTUSDT">
      </div>

      <div class="grid-2" style="margin-top:8px;">
        <div>
          <label>Tek Pozisyon Modu</label>
          <div class="toggle-row">
            <div class="toggle" id="singlePosToggle" onclick="toggleSinglePos()"></div>
            <span style="font-size:9px;color:var(--text2);" id="singlePosLabel">Kapalı (çoklu)</span>
          </div>
        </div>
      </div>

      <div class="flex-row" style="margin-top:12px;">
        <button class="btn btn-acc" id="btnEngine" onclick="toggleEngine()">Motoru Başlat</button>
        <button class="btn btn-outline" onclick="runBacktest()">Backtest</button>
      </div>

      <!-- En iyi sinyal (piyasa modu) -->
      <div class="best-signal" id="bestSignalInfo"></div>
      <div id="engineSuggestion" style="margin-top:4px;font-size:10px;color:var(--warn);min-height:18px;"></div>

      <!-- TP/SL Canlı Panel -->
      <div class="tp-sl-panel" id="tpSlPanel">
        <div style="color:var(--dim);margin-bottom:4px;">📌 AÇIK POZİSYON TP/SL</div>
        <div id="tpSlContent" style="color:var(--text2);">Pozisyon yok</div>
      </div>
      <div id="commWarning" style="margin-top:6px;font-size:9px;color:var(--short);display:none;"></div>
    </div>

    <!-- PORTFÖY SEKME -->
    <div id="portfolio" class="tab-content">
      <h3>Portföy</h3>
      <div class="grid-3">
        <div><span class="metric-label">Bakiye</span><div class="metric" id="balance">$50</div></div>
        <div><span class="metric-label">P&L</span><div class="metric" id="dayPnl">$0</div></div>
        <div><span class="metric-label">Win Rate</span><div class="metric" id="winRate">--</div></div>
      </div>
      <div id="posList" style="margin-top:10px;font-size:10px;color:var(--text2);"></div>
    </div>

    <!-- AYARLAR SEKME -->
    <div id="settings" class="tab-content">
      <h3>Bağlantı</h3>
      <div class="grid-2">
        <div><label>Worker URL</label><input id="workerUrl" value=""></div>
        <div><label>Sermaye</label><input id="capital" value="50" type="number"></div>
      </div>
      <div class="flex-row" style="margin-top:10px;">
        <button class="btn btn-acc" onclick="connect()">Bağlan</button>
        <button class="btn btn-outline" onclick="switchToDemo()">Demo</button>
      </div>
      <h3 style="margin-top:16px;">Log</h3>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════════
// APEX PRO v12 — GERİ SAYIM + PİYASA MODU
// ═══════════════════════════════════════════════════════
const MAX_POS = 3;
const COMM = 0.0004;
const MIN_SL_PCT = 0.005;
const MIN_TP_PCT = 0.008;

// Tüm coin havuzu (piyasa modu için)
const ALL_PAIRS = [
  'BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT',
  'DOGEUSDT','ADAUSDT','AVAXUSDT','LINKUSDT','DOTUSDT',
  'LTCUSDT','UNIUSDT','ATOMUSDT','NEARUSDT','APTUSDT',
  'ARBUSDT','OPUSDT','SUIUSDT','SEIUSDT','MATICUSDT'
];

let WORKER = '';
let mode = 'demo';
let engineRunning = false;
let balance = 50, startBalance = 50, peakBalance = 50;
let positions = [], trades = [];
let posId = 1;
let dailyPnL = 0;
let currentPair = 'BTCUSDT';
let klines = [], indicators = {};
let signal = 'WAIT';
let loopTimer = null;
let countdownTimer = null;
let countdown = 120;
let lastBacktestResult = null;
let singlePosMode = false;
let scanInterval = 120;
let scanMode = 'fixed'; // 'fixed' | 'market'
let bestMarketSignal = null; // piyasa modunda en iyi sinyal

const DEMO = {
  BTCUSDT:68000, ETHUSDT:3500, SOLUSDT:180, BNBUSDT:590, XRPUSDT:0.65,
  DOGEUSDT:0.13, ADAUSDT:0.46, AVAXUSDT:36, LINKUSDT:15, DOTUSDT:7.2,
  LTCUSDT:82, UNIUSDT:6.2, ATOMUSDT:9.1, NEARUSDT:5.1, APTUSDT:8.3,
  ARBUSDT:1.1, OPUSDT:2.4, SUIUSDT:1.8, SEIUSDT:0.9, MATICUSDT:0.85
};

// ── BİLDİRİM ─────────────────────────────────────
function showNotification(msg, type = 'info') {
  const area = document.getElementById('notifArea');
  const div = document.createElement('div');
  div.className = `notification ${type} show`;
  div.textContent = msg;
  area.appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

function log(msg) {
  const b = document.getElementById('logBox');
  const t = new Date().toLocaleTimeString('tr-TR');
  b.innerHTML += `<div>${t} ${msg}</div>`;
  b.scrollTop = b.scrollHeight;
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (event && event.target) event.target.classList.add('active');
  if (id === 'signal') drawChart();
}

function updateUI() {
  document.getElementById('balance').textContent = '$' + balance.toFixed(2);
  document.getElementById('posBadge').textContent = positions.length + '/' + MAX_POS;
  document.getElementById('dayPnl').textContent = (dailyPnL >= 0 ? '+':'') + '$' + dailyPnL.toFixed(2);
  const wins = trades.filter(t => t.pnl > 0).length;
  const total = trades.length;
  document.getElementById('winRate').textContent = total ? (wins/total*100).toFixed(1)+'%' : '--';

  let posHtml = '';
  positions.forEach(p => {
    const pr = currentPrice(p.pair);
    const mult = (p.side==='LONG'||p.side==='BUY') ? 1 : -1;
    const pnl = (pr - p.entry) * mult * p.qty - (p.comm||0);
    posHtml += `<div>${p.pair.replace('USDT','')} ${p.side} @${p.entry.toFixed(2)} PnL: <span style="color:${pnl>=0?'var(--long)':'var(--short)'}">$${pnl.toFixed(2)}</span></div>`;
  });
  document.getElementById('posList').innerHTML = posHtml || 'Açık pozisyon yok';

  updateTpSlPanel();
  updateCommWarning();

  if (signal !== 'WAIT') {
    const pair = scanMode === 'market' && bestMarketSignal ? bestMarketSignal.symbol.replace('USDT','') : currentPair.replace('USDT','');
    const sug = `💡 Öneri: ${signal} ${pair} (Güven: %${indicators.conf || '--'})`;
    document.getElementById('sigSuggestion').textContent = sug;
    document.getElementById('engineSuggestion').textContent = sug;
  } else {
    document.getElementById('sigSuggestion').textContent = '';
    document.getElementById('engineSuggestion').textContent = '';
  }

  // Piyasa modu en iyi sinyal bilgisi
  if (scanMode === 'market' && bestMarketSignal) {
    document.getElementById('bestSignalInfo').textContent =
      `🏆 En iyi: ${bestMarketSignal.symbol.replace('USDT','')} → ${bestMarketSignal.signal} (%${bestMarketSignal.conf})`;
  } else if (scanMode === 'market') {
    document.getElementById('bestSignalInfo').textContent = '🔍 Sinyal aranıyor...';
  } else {
    document.getElementById('bestSignalInfo').textContent = '';
  }
}

function updateTpSlPanel() {
  const panel = document.getElementById('tpSlContent');
  if (positions.length === 0) {
    panel.innerHTML = '<span style="color:var(--text3);">Pozisyon yok</span>';
    return;
  }
  let html = '';
  positions.forEach(p => {
    const tpPct = p.tp > 0 ? Math.abs((p.tp - p.entry) / p.entry * 100).toFixed(2) : '--';
    const slPct = p.sl > 0 ? Math.abs((p.entry - p.sl) / p.entry * 100).toFixed(2) : '--';
    html += `<div style="margin:4px 0;display:flex;gap:12px;align-items:center;">
      <span style="color:var(--text);">${p.pair.replace('USDT','')} ${p.side}</span>
      <span style="color:var(--long);">TP: $${p.tp.toFixed(4)} (${tpPct}%)</span>
      <span style="color:var(--short);">SL: $${p.sl.toFixed(4)} (${slPct}%)</span>
    </div>`;
  });
  panel.innerHTML = html;
}

function updateCommWarning() {
  const warn = document.getElementById('commWarning');
  if (positions.length === 0) { warn.style.display = 'none'; return; }
  let warnings = [];
  positions.forEach(p => {
    const commCost = (p.posValue || 15) * COMM * 2;
    const tpDist = p.tp ? Math.abs(p.tp - p.entry) : 0;
    const tpProfit = tpDist / p.entry * (p.posValue || 15) * (p.lev || 2);
    if (tpProfit < commCost * 2) {
      warnings.push(`${p.pair}: TP ($${tpProfit.toFixed(3)}) komisyonu ($${commCost.toFixed(3)}) zor kurtarır`);
    }
  });
  if (warnings.length) {
    warn.style.display = 'block';
    warn.textContent = '⚠️ ' + warnings.join(' | ');
  } else {
    warn.style.display = 'none';
  }
}

function currentPrice(sym) {
  sym = sym || currentPair;
  if (mode === 'demo') return DEMO[sym] || 100;
  if (sym === currentPair && indicators.last) return indicators.last;
  return DEMO[sym] || 100;
}

function setPair(pair) {
  currentPair = pair;
  document.querySelectorAll('.pair-btn').forEach(b => b.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  document.getElementById('pairTitle').textContent = pair + ' · 15m';
  if (mode === 'live') fetchLiveData();
}

// ── GERİ SAYIM ───────────────────────────────────
function startCountdown() {
  stopCountdown();
  countdown = scanInterval;
  updateCountdownDisplay();
  countdownTimer = setInterval(() => {
    countdown--;
    updateCountdownDisplay();
    if (countdown <= 0) {
      countdown = scanInterval;
    }
  }, 1000);
}

function stopCountdown() {
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
}

function updateCountdownDisplay() {
  const el = document.getElementById('countdownDisplay');
  el.textContent = countdown;
  el.className = 'countdown' + (!engineRunning ? ' paused' : '');
  document.getElementById('countdownLabel').textContent =
    engineRunning ? 'saniye kaldı' : 'motor durdu';
}

// ── TARAMA MODU ──────────────────────────────────
function updateScanMode() {
  scanMode = document.getElementById('scanMode').value;
  document.getElementById('extraPairsRow').style.display = scanMode === 'market' ? 'block' : 'none';
  log('📡 Tarama modu: ' + (scanMode === 'market' ? 'Piyasa (en iyi sinyal)' : '5 Coin (sabit)'));
}

function getActivePairs() {
  if (scanMode === 'fixed') {
    return ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT'];
  }
  const extra = document.getElementById('extraPairs').value
    .split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
  return [...new Set([...ALL_PAIRS, ...extra])];
}

// ── DEMO ──────────────────────────────────────────
function generateKlines(sym, count=100) {
  let base = DEMO[sym] || 100;
  const k = [];
  for (let i=0; i<count; i++) {
    const open = base * (1 + (Math.random()-0.5)*0.005);
    const close = open * (1 + (Math.random()-0.5)*0.007);
    const high = Math.max(open,close) * (1 + Math.random()*0.003);
    const low = Math.min(open,close) * (1 - Math.random()*0.003);
    const vol = Math.random()*3000+500;
    k.push({time:Date.now()-(count-i)*60000, open, high, low, close, volume:vol});
    base = close;
  }
  DEMO[sym] = base;
  return k;
}

// ── İNDİKATÖRLER ─────────────────────────────────
function ema(data, p) { const k=2/(p+1); let e=[data[0]]; for(let i=1;i<data.length;i++) e.push(data[i]*k+e[i-1]*(1-k)); return e; }
function rsiFn(cl, p=14) {
  if(cl.length<p+1) return 50;
  let g=0,l=0; for(let i=1;i<=p;i++){const d=cl[i]-cl[i-1]; d>0?g+=d:l-=d;}
  let ag=g/p, al=l/p;
  for(let i=p+1;i<cl.length;i++){const d=cl[i]-cl[i-1]; ag=(ag*13+(d>0?d:0))/14; al=(al*13+(d<0?-d:0))/14;}
  return al===0?100:100-(100/(1+ag/al));
}
function atrFn(kl, p=14) {
  let tr=[]; for(let i=1;i<kl.length;i++){const h=kl[i].high,l=kl[i].low,pc=kl[i-1].close; tr.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)));}
  return tr.slice(-p).reduce((a,b)=>a+b,0)/p;
}
function adxFn(kl, p=14) {
  const hh=kl.map(k=>k.high),ll=kl.map(k=>k.low),cc=kl.map(k=>k.close);
  let tr=[],pDM=[],mDM=[];
  for(let i=1;i<kl.length;i++){const h=hh[i],l=ll[i],ph=hh[i-1],pl=ll[i-1]; tr.push(Math.max(h-l,Math.abs(h-cc[i-1]),Math.abs(l-cc[i-1]))); const up=h-ph, down=pl-l; pDM.push(up>down&&up>0?up:0); mDM.push(down>up&&down>0?down:0);}
  const atr=tr.slice(-p).reduce((a,b)=>a+b,0)/p||1;
  const pDI=pDM.slice(-p).reduce((a,b)=>a+b,0)/p/atr*100;
  const mDI=mDM.slice(-p).reduce((a,b)=>a+b,0)/p/atr*100;
  const dx=Math.abs(pDI-mDI)/(pDI+mDI)*100;
  return {adx:dx,plusDI:pDI,minusDI:mDI};
}
function volumeProfile(kl) { return kl.reduce((max,k)=>k.volume>(max.volume||0)?k:max,kl[0]).close; }

function computeIndicators(kl) {
  const cl=kl.map(k=>k.close), r=rsiFn(cl), av=atrFn(kl), ad=adxFn(kl);
  const e9=ema(cl,9), e21=ema(cl,21), ml=ema(cl,12).map((v,i)=>v-(ema(cl,26)[i]||0));
  const sl=ema(ml.filter(v=>!isNaN(v)),9), macd=ml[ml.length-1]-(sl[sl.length-1]||0);
  const poc=volumeProfile(kl), last=cl[cl.length-1];
  return {rsi:r,atr:av,adx:ad.adx,plusDI:ad.plusDI,minusDI:ad.minusDI,ema9:e9[e9.length-1],ema21:e21[e21.length-1],macd,poc,last,
    volumeRatio:kl.slice(-5).reduce((s,k)=>s+k.volume,0)/kl.slice(-20).reduce((s,k)=>s+k.volume,0)*4};
}

function generateSignal(ind, kl, strat='trend') {
  let b=0, s=0, r=[];
  const {rsi,ema9,ema21,macd,adx,plusDI,minusDI,poc,last,volumeRatio}=ind;
  if(adx<20){ if(rsi<38&&last<poc){b+=2;r.push('RSI OS');} if(rsi>62&&last>poc){s+=2;r.push('RSI OB');} }
  else{ if(plusDI>minusDI&&ema9>ema21){b+=3;r.push('Trend↑');} if(minusDI>plusDI&&ema9<ema21){s+=3;r.push('Trend↓');} }
  if(macd>0)b+=1; else if(macd<0)s+=1;
  if(volumeRatio>1.4){if(b>s)b+=1;else s+=1;r.push('Vol');}
  if(strat==='breakout'){const h20=Math.max(...kl.slice(-20).map(k=>k.high)),l20=Math.min(...kl.slice(-20).map(k=>k.low)); if(last>h20){b+=2;r.push('BO↑');} if(last<l20){s+=2;r.push('BO↓');}}
  const tot=Math.max(1,b+s), conf=Math.round(Math.max(b,s)/tot*100);
  let sig='WAIT'; if(b>s&&b>=3)sig='LONG'; else if(s>b&&s>=3)sig='SHORT';
  return {signal:sig,conf,reasons:r.join(',')};
}

// ── PİYASA TARAMASI ──────────────────────────────
async function scanMarket() {
  const pairs = getActivePairs();
  if (mode === 'demo') {
    // Demo: her coin için sahte sinyal üret
    const results = [];
    for (const sym of pairs.slice(0, 15)) {
      const kl = generateKlines(sym, 80);
      const ind = computeIndicators(kl);
      const sig = generateSignal(ind, kl, document.getElementById('strategy').value);
      results.push({ symbol: sym, signal: sig.signal, conf: sig.conf, price: ind.last, indicators: ind, klines: kl });
    }
    return results.filter(r => r.signal !== 'WAIT').sort((a, b) => b.conf - a.conf);
  }

  // Canlı: worker'a istek gönder
  if (!WORKER) return [];
  try {
    const res = await fetch(`${WORKER}/scan?pairs=${pairs.join(',')}&mode=standard`);
    const data = await res.json();
    if (data.success && data.results) {
      return data.results
        .filter(r => r.signal !== 'WAIT')
        .sort((a, b) => (b.sc5?.conf || 0) - (a.sc5?.conf || 0));
    }
  } catch(e) { log('⚠️ Piyasa tarama hatası: ' + e.message); }
  return [];
}

async function runMarketScan() {
  const results = await scanMarket();
  if (results.length > 0) {
    bestMarketSignal = results[0];
    // En iyi sinyale göre currentPair'i güncelle
    if (bestMarketSignal.symbol !== currentPair) {
      currentPair = bestMarketSignal.symbol;
      document.getElementById('pairTitle').textContent = currentPair + ' · 15m';
      document.querySelectorAll('.pair-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sym === currentPair);
      });
    }
    // Göstergeleri güncelle
    if (bestMarketSignal.indicators) {
      indicators = bestMarketSignal.indicators;
    }
    if (bestMarketSignal.klines) {
      klines = bestMarketSignal.klines;
    }
    signal = bestMarketSignal.signal;
    indicators.conf = bestMarketSignal.conf;
    indicators.last = bestMarketSignal.price;
    updateSignalUI({ signal: signal, conf: bestMarketSignal.conf });
    log(`📡 Piyasa: ${results.length} sinyal bulundu, en iyisi: ${bestMarketSignal.symbol} → ${bestMarketSignal.signal} (%${bestMarketSignal.conf})`);
    return true;
  } else {
    bestMarketSignal = null;
    signal = 'WAIT';
    log('📡 Piyasa: sinyal bulunamadı');
    return false;
  }
}

// ── GERÇEK EMİR ──────────────────────────────────
async function sendOrderToWorker(side, symbol, usdAmount, leverage, tp, sl) {
  if (!WORKER) return { success: false, error: 'Worker URL yok' };
  try {
    const res = await fetch(WORKER + '/order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol, side, usdAmount, leverage, tp: parseFloat(tp.toFixed(4)), sl: parseFloat(sl.toFixed(4)) })
    });
    return await res.json();
  } catch(e) { return { success: false, error: e.message }; }
}
async function closeOrderOnWorker(symbol, side) {
  if (!WORKER) return { success: false, error: 'Worker URL yok' };
  try {
    const res = await fetch(WORKER + '/close', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol, side })
    });
    return await res.json();
  } catch(e) { return { success: false, error: e.message }; }
}

// ── İŞLEM ─────────────────────────────────────────
function confirmTrade(side) {
  if (!indicators.last) return showNotification('⛔ Veri bekleniyor...', 'error');
  const pair = scanMode === 'market' && bestMarketSignal ? bestMarketSignal.symbol : currentPair;
  const conf = indicators.conf || generateSignal(indicators, klines, document.getElementById('strategy').value).conf;
  const msg = `${side} işlemi açılacak.\nPair: ${pair}\nFiyat: ${indicators.last.toFixed(4)}\nGüven: %${conf}\n\nOnaylıyor musunuz?`;
  if (confirm(msg)) executeTrade(side, pair);
}
function confirmBacktestTrade() {
  if (!lastBacktestResult) return;
  const { signal: sig, conf } = lastBacktestResult;
  if (sig === 'WAIT') return showNotification('Backtest sinyali WAIT', 'error');
  const pair = scanMode === 'market' && bestMarketSignal ? bestMarketSignal.symbol : currentPair;
  if (confirm(`Backtest ile ${sig} açılsın mı?\nPair: ${pair}\nGüven: %${conf}`)) executeTrade(sig, pair);
}

async function executeTrade(side, pairOverride) {
  const pair = pairOverride || currentPair;
  if (singlePosMode && positions.length > 0) {
    showNotification('⛔ Tek Pozisyon Modu aktif', 'error');
    return;
  }
  if (positions.length >= MAX_POS) return showNotification('⛔ Max pozisyon (3)', 'error');
  if (positions.some(p => p.pair === pair)) return showNotification(`⛔ ${pair} zaten açık`, 'error');

  const lev = parseInt(document.getElementById('leverage').value) || 2;
  const tradeSizeUSD = parseFloat(document.getElementById('tradeSize').value) || 15;
  const price = indicators.last || currentPrice(pair);
  const ind = indicators;
  const pv = Math.min(tradeSizeUSD, balance * 0.4);
  const qty = pv / price * lev;

  const minSlDist = Math.max(ind.atr * 1.5, price * MIN_SL_PCT);
  const minTpDist = Math.max(ind.atr * 2.5, price * MIN_TP_PCT);

  const sl = side === 'LONG' ? price - minSlDist : price + minSlDist;
  const tp = side === 'LONG' ? price + minTpDist : price - minTpDist;

  const commCost = pv * COMM * 2;
  const tpProfit = minTpDist / price * pv * lev;
  if (tpProfit < commCost * 1.5) {
    showNotification('⚠️ TP kazancı komisyonu zor kurtarır.', 'error');
  }

  const posObj = { id: posId++, pair, side, entry: price, qty, lev, sl, tp, posValue: pv, comm: pv * COMM, auto: false };
  positions.push(posObj);
  dailyPnL -= pv * COMM;
  balance -= pv * COMM;
  showNotification(`✅ ${side} ${pair.replace('USDT','')} açıldı! TP:$${tp.toFixed(4)} SL:$${sl.toFixed(4)}`, 'success');
  log(`✅ ${side} ${pair.replace('USDT','')} @${price.toFixed(4)} TP:${tp.toFixed(4)} SL:${sl.toFixed(4)} $${pv.toFixed(0)}`);

  if (mode === 'live' && WORKER) {
    showNotification('📡 Binance emri gönderiliyor...', 'info');
    const result = await sendOrderToWorker(side, pair, tradeSizeUSD, lev, tp, sl);
    if (result.success) {
      showNotification('✅ Binance: Emir iletildi!', 'success');
      log('✅ Binance: ' + side + ' qty:' + result.quantity + ' @' + result.price);
    } else {
      showNotification('❌ Binance HATASI: ' + (result.error || 'bilinmeyen'), 'error');
      log('❌ Binance HATASI: ' + (result.error || 'bilinmeyen'));
      positions = positions.filter(p => p.id !== posObj.id);
      balance += pv * COMM; dailyPnL += pv * COMM;
    }
  }
  updateUI();
}

async function closePos(pos, reason) {
  const pr = currentPrice(pos.pair);
  const mult = (pos.side === 'LONG' || pos.side === 'BUY') ? 1 : -1;
  const pnl = (pr - pos.entry) * mult * pos.qty - (pos.comm || 0);
  balance += pnl + pos.posValue;
  dailyPnL += pnl;
  trades.push({ pair: pos.pair, side: pos.side, pnl, reason });
  positions = positions.filter(p => p.id !== pos.id);
  showNotification(`${reason==='TP'?'🟢':'🔴'} ${pos.pair.replace('USDT','')} kapandı! PnL:$${pnl.toFixed(2)}`, pnl>=0?'success':'error');
  log(`${reason==='TP'?'🟢':'🔴'} ${pos.pair.replace('USDT','')} PnL:$${pnl.toFixed(2)} Bal:$${balance.toFixed(2)}`);

  if (mode === 'live' && WORKER) {
    const result = await closeOrderOnWorker(pos.pair, pos.side);
    if (result.success) log('✅ Binance kapatıldı: ' + pos.pair);
    else log('❌ Binance kapatma HATASI: ' + (result.error || ''));
  }
  if (balance > peakBalance) peakBalance = balance;
  updateUI();
}

async function checkPositions() {
  for (const p of positions) {
    const pr = currentPrice(p.pair);
    const mult = (p.side === 'LONG' || p.side === 'BUY') ? 1 : -1;
    const pnl = (pr - p.entry) * mult * p.qty - (p.comm || 0);
    if (pnl > 0 && ((p.side==='LONG'&&pr>=p.tp) || (p.side==='SHORT'&&pr<=p.tp))) await closePos(p, 'TP');
    else if (pnl < 0 && ((p.side==='LONG'&&pr<=p.sl) || (p.side==='SHORT'&&pr>=p.sl))) await closePos(p, 'SL');
  }
}

// ── BACKTEST ──────────────────────────────────────
function runBacktest() {
  const strat = document.getElementById('strategy').value;
  let bk;
  if (mode === 'live' && klines.length >= 50) {
    bk = klines.slice();
  } else {
    bk = generateKlines(currentPair, 200);
    if (mode === 'live') log('⚠️ Canlı veri yetersiz, demo veriyle backtest yapılıyor');
  }
  if (!bk || bk.length < 50) return log('⛔ Yetersiz veri');
  let sim = balance, pos = null, w = 0, t = 0;
  for (let i=50; i<bk.length; i++) {
    const sl = bk.slice(0,i+1), ind = computeIndicators(sl), sig = generateSignal(ind, sl, strat);
    if (pos) {
      const pr = sl[sl.length-1].close, mult = pos.side==='LONG'?1:-1, pnl = (pr-pos.entry)*mult*pos.qty;
      if ((pos.side==='LONG'&&pr>=pos.tp) || (pos.side==='SHORT'&&pr<=pos.tp)) { sim += pnl; w++; t++; pos = null; }
      else if ((pos.side==='LONG'&&pr<=pos.sl) || (pos.side==='SHORT'&&pr>=pos.sl)) { sim += pnl; t++; pos = null; }
    } else if (sig.signal !== 'WAIT') {
      const sz = sim * 0.02, qty = sz / sl[sl.length-1].close * 2;
      const minSl = Math.max(ind.atr*1.5, sl[sl.length-1].close*MIN_SL_PCT);
      const minTp = Math.max(ind.atr*2.5, sl[sl.length-1].close*MIN_TP_PCT);
      pos = { side:sig.signal, entry:sl[sl.length-1].close, qty,
        tp: sig.signal==='LONG' ? sl[sl.length-1].close+minTp : sl[sl.length-1].close-minTp,
        sl: sig.signal==='LONG' ? sl[sl.length-1].close-minSl : sl[sl.length-1].close+minSl };
    }
  }
  const wr = t ? (w/t*100).toFixed(1) : '0';
  const pnl = (sim - balance).toFixed(2);
  const resultMsg = `Backtest: ${t} işlem Win:${w} %${wr} PnL:$${pnl}`;
  log(resultMsg);
  document.getElementById('backtestResult').textContent = '📊 ' + resultMsg;
  if (t > 0 && wr > 40 && pnl > 0) {
    const sig = generateSignal(indicators, klines, strat);
    if (sig.signal !== 'WAIT') {
      lastBacktestResult = { signal: sig.signal, conf: sig.conf };
      document.getElementById('btnBacktestTrade').style.display = 'block';
      document.getElementById('btnBacktestTrade').textContent = `📊 Backtest ile ${sig.signal} Aç (%${sig.conf} güven)`;
    } else {
      document.getElementById('btnBacktestTrade').style.display = 'none';
    }
  } else {
    document.getElementById('btnBacktestTrade').style.display = 'none';
  }
}

// ── CHART ─────────────────────────────────────────
let chartCtx;
function initChart() { chartCtx = document.getElementById('chart').getContext('2d'); }
function drawChart() {
  if (!chartCtx || !klines.length) return;
  const w = chartCtx.canvas.width = chartCtx.canvas.offsetWidth;
  const h = chartCtx.canvas.height = 180;
  chartCtx.clearRect(0, 0, w, h);
  const closes = klines.map(k => k.close);
  const min = Math.min(...closes) * 0.999, max = Math.max(...closes) * 1.001, rng = max - min;
  const pad = {l:20, r:10, t:10, b:20};
  chartCtx.beginPath(); chartCtx.strokeStyle = '#00e0a0'; chartCtx.lineWidth = 2;
  closes.forEach((v, i) => {
    const x = pad.l + i / (closes.length - 1) * (w - pad.l - pad.r);
    const y = pad.t + (max - v) / rng * (h - pad.t - pad.b);
    i === 0 ? chartCtx.moveTo(x, y) : chartCtx.lineTo(x, y);
  });
  chartCtx.stroke();
}

// ── CANLI VERİ ────────────────────────────────────
async function fetchLiveData(sym) {
  sym = sym || currentPair;
  if (!WORKER) return;
  try {
    const [pr, kl] = await Promise.all([
      fetch(`${WORKER}/price?symbol=${sym}`).then(r=>r.json()).catch(()=>null),
      fetch(`${WORKER}/klines?symbol=${sym}&interval=15m&limit=100`).then(r=>r.json()).catch(()=>null)
    ]);
    if (pr && pr.success && pr.data) {
      const p = parseFloat(pr.data.lastPrice || pr.data.price);
      if (p) { indicators.last = p; updateTickerLive(pr.data.symbol, p); }
    }
    if (kl && kl.success && Array.isArray(kl.data) && kl.data.length > 50) {
      klines = kl.data.map(k => ({time: k[0], open: +k[1], high: +k[2], low: +k[3], close: +k[4], volume: +k[5]}));
      indicators = computeIndicators(klines);
      return true;
    }
  } catch(e) { log('⚠️ Veri çekme: ' + e.message); }
  return false;
}

function updateTickerLive(sym, price) {
  document.getElementById('ticker').innerHTML = `<span>${(sym||currentPair).replace('USDT','')} $${price.toFixed(4)}</span>`;
}

function updateSignalUI(sig) {
  document.getElementById('sigMain').textContent = sig.signal;
  document.getElementById('sigMain').className = 'signal-badge ' + sig.signal;
  document.getElementById('iRsi').textContent = indicators.rsi.toFixed(1);
  document.getElementById('iMacd').textContent = indicators.macd.toFixed(4);
  document.getElementById('iAtr').textContent = indicators.atr.toFixed(4);
  document.getElementById('iAdx').textContent = indicators.adx.toFixed(1) + (indicators.adx>25?' Trend':' Side');
  document.getElementById('iVol').textContent = indicators.volumeRatio.toFixed(2);
  document.getElementById('iPoc').textContent = indicators.poc.toFixed(4);
  drawChart(); updateUI();
}

// ── BAĞLANTI ──────────────────────────────────────
async function connect() {
  const url = document.getElementById('workerUrl').value.trim();
  if (!url) return log('❌ URL girin');
  try {
    const r = await fetch(url + '/ping'); const d = await r.json();
    if (d.success) {
      WORKER = url; mode = 'live';
      balance = parseFloat(document.getElementById('capital').value) || 50;
      startBalance = balance; peakBalance = balance;
      document.getElementById('connBadge').textContent = 'LIVE'; document.getElementById('connBadge').className = 'badge live';
      document.getElementById('modeBadge').textContent = 'LIVE';
      showNotification('✅ Canlı bağlantı kuruldu!', 'success');
      if (loopTimer) clearTimeout(loopTimer);
      if (countdownTimer) stopCountdown();
      mainLoop();
    } else { showNotification('❌ Worker yanıt vermedi', 'error'); }
  } catch(e) { showNotification('❌ Bağlantı hatası: ' + e.message, 'error'); }
}

function switchToDemo() {
  mode = 'demo'; WORKER = '';
  balance = parseFloat(document.getElementById('capital').value) || 50;
  startBalance = balance; peakBalance = balance;
  document.getElementById('connBadge').textContent = 'DEMO'; document.getElementById('connBadge').className = 'badge demo';
  document.getElementById('modeBadge').textContent = 'SIM';
  showNotification('🧪 Demo mod', 'info');
  if (loopTimer) clearTimeout(loopTimer);
  if (countdownTimer) stopCountdown();
  mainLoop();
}

// ── TEK POZİSYON ─────────────────────────────────
function toggleSinglePos() {
  singlePosMode = !singlePosMode;
  const toggle = document.getElementById('singlePosToggle');
  const label = document.getElementById('singlePosLabel');
  if (singlePosMode) { toggle.classList.add('on'); label.textContent = 'Açık (tek)'; showNotification('🔒 Tek Pozisyon', 'info'); }
  else { toggle.classList.remove('on'); label.textContent = 'Kapalı (çoklu)'; showNotification('🔓 Çoklu Pozisyon', 'info'); }
}

function updateScanInterval() {
  scanInterval = parseInt(document.getElementById('scanInterval').value);
  log('⏱ Tarama: ' + scanInterval + 's');
  countdown = scanInterval;
  updateCountdownDisplay();
  if (loopTimer) clearTimeout(loopTimer);
  if (engineRunning || mode === 'live' || mode === 'demo') mainLoop();
}

// ── ANA DÖNGÜ ─────────────────────────────────────
async function mainLoop() {
  // Geri sayımı başlat (eğer motor çalışıyorsa)
  if (engineRunning && !countdownTimer) {
    startCountdown();
  }
  if (!engineRunning && countdownTimer) {
    stopCountdown();
  }
  updateCountdownDisplay();

  if (scanMode === 'market') {
    // Piyasa modu: tüm coinleri tara, en iyisini seç
    await runMarketScan();
  } else {
    // Sabit mod: sadece seçili coin
    if (mode === 'demo') {
      klines = generateKlines(currentPair, 100);
      indicators = computeIndicators(klines);
      const sig = generateSignal(indicators, klines, document.getElementById('strategy').value);
      signal = sig.signal; indicators.conf = sig.conf;
      updateSignalUI(sig);
    } else if (mode === 'live') {
      await fetchLiveData(currentPair);
      const sig = generateSignal(indicators, klines, document.getElementById('strategy').value);
      signal = sig.signal; indicators.conf = sig.conf;
      updateSignalUI(sig);
    }
  }

  // Motor: sinyal varsa işlem aç
  if (engineRunning && signal !== 'WAIT' && indicators.last) {
    if (singlePosMode && positions.length > 0) {
      // sessizce bekle
    } else {
      const tradePair = scanMode === 'market' && bestMarketSignal ? bestMarketSignal.symbol : currentPair;
      if (!positions.some(p => p.pair === tradePair)) {
        await executeTrade(signal, tradePair);
      }
    }
  }

  await checkPositions();
  updateUI();

  // Geri sayımı sıfırla
  countdown = scanInterval;
  updateCountdownDisplay();

  loopTimer = setTimeout(mainLoop, scanInterval * 1000);
}

function toggleEngine() {
  engineRunning = !engineRunning;
  document.getElementById('btnEngine').textContent = engineRunning ? 'Durdur' : 'Başlat';
  const msg = engineRunning ? '🚀 Motor çalıştı (her ' + scanInterval + 'sn)' : '⏸️ Motor durdu';
  showNotification(msg, engineRunning ? 'success' : 'info');
  log(msg);

  if (engineRunning) {
    startCountdown();
    // Hemen bir tarama yap
    if (loopTimer) clearTimeout(loopTimer);
    mainLoop();
  } else {
    stopCountdown();
  }
}

// ── BAŞLANGIÇ ─────────────────────────────────────
window.onload = () => {
  initChart();
  document.getElementById('capital').value = balance;
  document.getElementById('scanInterval').value = scanInterval;
  document.getElementById('scanMode').value = scanMode;
  updateScanMode();
  switchToDemo();
  updateCountdownDisplay();
  log('APEX PRO v12 · Geri Sayım + Piyasa Modu');
};
