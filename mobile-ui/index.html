<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>NEXUS Agent</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b0f17;
  color:#e8eef7;
  padding:18px;
}

h1{
  text-align:center;
  letter-spacing:2px;
  margin-bottom:4px;
}
.sub{
  text-align:center;
  font-size:13px;
  color:#8fa0b8;
  margin-bottom:16px;
}

.card{
  background:#121724;
  border:1px solid #1f2a40;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:6px 0;
  font-size:14px;
}

.label{ color:#8fa0b8 }
.value{ font-weight:600 }

.badge{
  padding:4px 10px;
  border-radius:10px;
  font-size:12px;
}
.paper{ background:#223a5e; color:#9ec6ff }
.running{ background:#0f5132; color:#5cffb0 }
.stopped{ background:#5c1d24; color:#ff7a8a }

.pairs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:6px;
}
.pair{
  padding:8px 14px;
  border-radius:12px;
  border:1px solid #2a3550;
  font-size:13px;
  color:#9fb0c8;
}
.pair.active{
  background:#1c3d6e;
  color:#9ec6ff;
  border-color:#3b78c4;
}

.leverages{
  display:flex;
  gap:6px;
  margin-top:6px;
}
.lev{
  flex:1;
  padding:10px 0;
  text-align:center;
  border-radius:12px;
  border:1px solid #2a3550;
  font-size:14px;
  color:#9fb0c8;
}
.lev.active{
  background:#205c3b;
  color:#5cffb0;
  border-color:#2ea76d;
}

.sliderBlock{
  margin-top:10px;
}
input[type=range]{
  width:100%;
}

button{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:600;
  margin-top:10px;
}
.start{ background:#00e676; color:#000 }
.stop{ background:#ff3b5c; color:#fff }

.footer{
  text-align:center;
  font-size:12px;
  color:#6f8099;
  margin-top:12px;
}
</style>
</head>

<body>

<h1>NEXUS</h1>
<div class="sub">Automated Futures Agent</div>

<!-- STATUS -->
<div class="card">
  <div class="row">
    <span class="label">MODE</span>
    <span class="badge paper">PAPER • Live Data</span>
  </div>
  <div class="row">
    <span class="label">STATE</span>
    <span id="state" class="badge stopped">STOPPED</span>
  </div>
</div>

<!-- LIVE PRICE -->
<div class="card">
  <div class="row">
    <span class="label">Selected Pair</span>
    <span class="value" id="livePair">BTCUSDT</span>
  </div>
  <div class="row">
    <span class="label">Live Price</span>
    <span class="value" id="livePrice">--</span>
  </div>
</div>

<!-- PAIRS -->
<div class="card">
  <div class="label">Trading Pairs</div>
  <div class="pairs">
    <div class="pair active" onclick="togglePair(this)">BTCUSDT</div>
    <div class="pair" onclick="togglePair(this)">ETHUSDT</div>
    <div class="pair" onclick="togglePair(this)">SOLUSDT</div>
    <div class="pair" onclick="togglePair(this)">XRPUSDT</div>
  </div>
</div>

<!-- LEVERAGE -->
<div class="card">
  <div class="label">Leverage</div>
  <div class="leverages">
    <div class="lev active" onclick="setLev(this)">x1</div>
    <div class="lev" onclick="setLev(this)">x2</div>
    <div class="lev" onclick="setLev(this)">x3</div>
    <div class="lev" onclick="setLev(this)">x4</div>
    <div class="lev" onclick="setLev(this)">x5</div>
  </div>
</div>

<!-- TP / SL -->
<div class="card">
  <div class="sliderBlock">
    <div class="row">
      <span class="label">Take Profit</span>
      <span class="value" id="tpVal">0.6%</span>
    </div>
    <input type="range" min="1" max="10" value="6" id="tp">
  </div>

  <div class="sliderBlock">
    <div class="row">
      <span class="label">Stop Loss</span>
      <span class="value" id="slVal">0.3%</span>
    </div>
    <input type="range" min="1" max="10" value="3" id="sl">
  </div>
</div>

<button class="start" onclick="start()">START AGENT</button>
<button class="stop" onclick="stop()">STOP & CLOSE</button>

<div class="footer">
  Live market data • No real orders
</div>

<script>
  const BACKEND_URL = "https://nexus-agent-backend.tarkanol.workers.dev";
let selectedPair = "BTCUSDT";

// SL / TP
tp.oninput = ()=> tpVal.innerText = (tp.value/10).toFixed(1)+"%";
sl.oninput = ()=> slVal.innerText = (sl.value/10).toFixed(1)+"%";

// PAIRS
function togglePair(el){
  document.querySelectorAll('.pair').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  selectedPair = el.innerText;
  livePair.innerText = selectedPair;
  fetchPrice();
}

// LEVERAGE
function setLev(el){
  document.querySelectorAll('.lev').forEach(l=>l.classList.remove('active'));
  el.classList.add('active');
}

// LIVE PRICE
async function fetchPrice(){
  const res = await fetch(
    `https://fapi.binance.com/fapi/v1/ticker/price?symbol=${selectedPair}`
  );
  const data = await res.json();
  livePrice.innerText = Number(data.price).toLocaleString();
}
setInterval(fetchPrice, 5000);
fetchPrice();

// START / STOP
function start(){
  state.innerText="RUNNING";
  state.className="badge running";
}
function stop(){
  state.innerText="STOPPED";
  state.className="badge stopped";
}
</script>

</body>
</html>
